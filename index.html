<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dalal Dhor</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:#f0f2f5;
  color:#222;
}

header{
  background:#008f4c;
  color:white;
  padding:14px 18px;
  position:sticky;
  top:0;
  z-index:100;
}

.header{
  max-width:850px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:25px;
  font-weight:bold;
}

.header button{
  border:0;
  border-radius:7px;
  padding:9px 14px;
  cursor:pointer;
  font-weight:bold;
}

.container{
  max-width:850px;
  margin:20px auto;
  padding:0 12px;
}

.card{
  background:white;
  border-radius:12px;
  margin-bottom:18px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  overflow:hidden;
}

.form{
  padding:18px;
}

h2,h3{
  margin-top:0;
}

input,textarea,select{
  width:100%;
  padding:12px;
  margin:7px 0 12px;
  border:1px solid #ddd;
  border-radius:7px;
  font-size:15px;
}

textarea{
  min-height:110px;
  resize:vertical;
}

.main-btn{
  width:100%;
  padding:12px;
  border:0;
  border-radius:7px;
  background:#008f4c;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.post{
  padding:16px;
}

.post-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.type{
  display:inline-block;
  background:#e7f7ee;
  color:#008f4c;
  padding:5px 9px;
  border-radius:15px;
  font-size:13px;
}

.post-title{
  font-size:20px;
  font-weight:bold;
  margin:8px 0;
}

.post-text{
  white-space:pre-wrap;
  line-height:1.6;
}

.media{
  width:100%;
  max-height:500px;
  object-fit:contain;
  background:#000;
  display:block;
  margin-top:12px;
}

.actions{
  display:flex;
  border-top:1px solid #eee;
  border-bottom:1px solid #eee;
  margin-top:14px;
}

.action-btn{
  flex:1;
  border:0;
  background:white;
  padding:12px 5px;
  cursor:pointer;
  font-size:15px;
}

.action-btn:hover{
  background:#f5f5f5;
}

.liked{
  color:#008f4c;
  font-weight:bold;
}

.comments{
  padding:12px;
  background:#fafafa;
}

.comment{
  background:white;
  border-radius:8px;
  padding:8px 10px;
  margin-bottom:7px;
}

.comment-name{
  font-weight:bold;
  font-size:13px;
}

.comment-text{
  margin-top:4px;
}

.comment-box{
  display:flex;
  gap:7px;
}

.comment-box input{
  margin:0;
}

.comment-box button{
  border:0;
  background:#008f4c;
  color:white;
  padding:0 15px;
  border-radius:7px;
}

.hidden{
  display:none !important;
}

.status{
  text-align:center;
  padding:12px;
}

#userInfo{
  font-size:14px;
}

.small{
  color:#777;
  font-size:13px;
}

.logout{
  background:#fff;
  color:#008f4c;
}

.login-box{
  max-width:450px;
  margin:30px auto;
}

.refresh{
  margin-bottom:15px;
  background:white;
  color:#008f4c;
  border:1px solid #008f4c;
}

.no-post{
  text-align:center;
  padding:30px;
  color:#777;
}
</style>
</head>

<body>

<header>
  <div class="header">
    <div class="logo">🟢 Dalal Dhor</div>

    <div>
      <span id="userInfo"></span>
      <button id="loginBtn" onclick="showLogin()">Login</button>
      <button id="logoutBtn" class="logout hidden" onclick="logout()">Logout</button>
    </div>
  </div>
</header>


<div class="container">

  <!-- LOGIN -->
  <div id="loginSection" class="card login-box hidden">
    <div class="form">

      <h2>Login</h2>

      <input
        type="email"
        id="email"
        placeholder="Email"
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
      >

      <button class="main-btn" onclick="login()">
        Login
      </button>

      <br><br>

      <button class="main-btn"
        style="background:#555"
        onclick="signup()">
        Create Account
      </button>

      <p id="authMessage" class="status"></p>

    </div>
