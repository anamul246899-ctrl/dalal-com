<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">

<title>ঘুষ সাইট</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}

body{
 margin:0;

button,input,textarea,select{font:inherit}

.topbar{

.searchBox{

.authBox{

.authLogo{

.loading{

.searchResult{

  left:-20px;

</style>
</head>

<div id="toast" class="toast"></div>


<script>

const SUPABASE_URL =
"https://klreqkbqyyiwmohlmgkh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_xlqcHTsDaMpBq4n54iMs4A_S7gKpiZc";

const db =
supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);


let currentUser=null;
let currentProfile=null;

const STORAGE_KEY="ghus_guest_user";


function $(id){
 return document.getElementById(id);
}


function escapeHTML(value){

 if(value===null || value===undefined){
  return "";
 }

 return String(value)
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


function toast(message){

 const el=$("toast");

 el.textContent=message;

 el.classList.add("show");

 setTimeout(()=>{
  el.classList.remove("show");
 },2500);

}


function normalizePhone(phone){

 return String(phone||"")
  .replace(/[^\d+]/g,"")
  .trim();

}


function showPage(pageId){

 [
  "homePage",
  "profilePage",
  "editProfilePage",
  "helpPage"
 ].forEach(id=>{

  const el=$(id);

  if(el){
   el.classList.add("hidden");
  }

 });


 const page=$(pageId);

 if(page){
  page.classList.remove("hidden");
 }


 if(pageId==="homePage"){
  loadFeed();
 }


 if(pageId==="profilePage"){
  loadProfile();
 }


 if(pageId==="helpPage"){

  $("searchResults").classList.add("hidden");

 }

}


function showSignup(){

 $("loginBox").classList.add("hidden");

 $("signupBox").classList.remove("hidden");

}


function showLogin(){

 $("signupBox").classList.add("hidden");

 $("loginBox").classList.remove("hidden");

}


async function signup(){

 const name=$("signupName").value.trim();

 const username=
  $("signupUsername").value.trim().toLowerCase();

 const phone=
  normalizePhone($("signupPhone").value);

 $("signupMsg").innerHTML="";


 if(!name || !username || !phone){

  $("signupMsg").innerHTML=
   '<div class="error">সব তথ্য পূরণ করুন।</div>';

  return;

 }


 if(username.length<3){

  $("signupMsg").innerHTML=
   '<div class="error">Username কমপক্ষে ৩ অক্ষরের হতে হবে।</div>';

  return;

 }


 try{

  const checkUsername=
   await db
   .from("profiles")
   .select("id")
   .eq("username",username)
   .limit(1);


  if(checkUsername.error){
   throw checkUsername.error;
  }


  if((checkUsername.data||[]).length){

   $("signupMsg").innerHTML=
    '<div class="error">এই Username আগে থেকেই আছে।</div>';

   return;

  }


  const checkPhone=
   await db
   .from("profiles")
   .select("id")
   .eq("phone",phone)
   .limit(1);


  if(checkPhone.error){
   throw checkPhone.error;
  }


  if((checkPhone.data||[]).length){

   $("signupMsg").innerHTML=
    '<div class="error">এই Phone Number দিয়ে ইতিমধ্যে account আছে।</div>';

   return;

  }


  const {data,error}=await db
   .from("profiles")
   .insert({
    display_name:name,
    username:username,
    phone:phone,
    role:"user"
   })
   .select("*")
   .limit(1);


  if(error){
   throw error;
  }


  const user=(data||[])[0];


  if(!user){
   throw new Error("Account তৈরি হয়নি।");
  }


  localStorage.setItem(
   STORAGE_KEY,
   JSON.stringify({
    id:user.id
   })
  );


  currentUser={
   id:user.id
  };


  currentProfile=user;


  $("signupMsg").innerHTML=
   '<div class="success">Account সফলভাবে তৈরি হয়েছে।</div>';


  setTimeout(()=>{
   enterApp();
  },500);


 }catch(err){

  console.error("SIGNUP ERROR:",err);


  $("signupMsg").innerHTML=
   '<div class="error">'+
   escapeHTML(
    err.message||
    "Account তৈরি করতে সমস্যা হয়েছে।"
   )+
   '</div>';

 }

}


async function login(){

 const identity=
  $("loginIdentity").value.trim();

 $("loginMsg").innerHTML="";


 if(!identity){

  $("loginMsg").innerHTML=
   '<div class="error">Username অথবা Phone Number দিন।</div>';

  return;

 }


 $("loginMsg").innerHTML=
  '<div class="status">Account খোঁজা হচ্ছে...</div>';


 try{

  let result=
   await db
   .from("profiles")
   .select("*")
   .ilike("username",identity)
   .limit(1);


  if(result.error){
   throw result.error;
  }


  let user=
   (result.data||[])[0]||
   null;


  if(!user){

   const phone=
    normalizePhone(identity);


   const phoneResult=
    await db
    .from("profiles")
    .select("*")
    .eq("phone",phone)
    .limit(1);


   if(phoneResult.error){
    throw phoneResult.error;
   }


   user=
    (phoneResult.data||[])[0]||
    null;

  }


  if(!user){

   $("loginMsg").innerHTML=
    '<div class="error">No account found.</div>';

   return;

  }


  currentUser={
   id:user.id
  };


  currentProfile=user;


  localStorage.setItem(
   STORAGE_KEY,
   JSON.stringify({
    id:user.id
   })
  );


  $("loginMsg").innerHTML=
   '<div class="success">Login successful.</div>';


  setTimeout(()=>{
   enterApp();
  },300);


 }catch(err){

  console.error("LOGIN ERROR:",err);


  $("loginMsg").innerHTML=
   '<div class="error">'+
   escapeHTML(
    err.message||
    "Login failed."
   )+
   '</div>';

 }

}


async function restoreSession(){

 const saved=
  localStorage.getItem(STORAGE_KEY);


 if(!saved){
  return;
 }


 try{

  const obj=
   JSON.parse(saved);


  if(!obj.id){
   return;
  }


  const {data,error}=
   await db
   .from("profiles")
   .select("*")
   .eq("id",obj.id)
   .limit(1);


  if(error){
   throw error;
  }


  const user=
   (data||[])[0];


  if(!user){

   localStorage.removeItem(STORAGE_KEY);

   return;

  }


  currentUser={
   id:user.id
  };


  currentProfile=user;


  enterApp();


 }catch(err){

  console.error(
   "RESTORE ERROR:",
   err
  );


  localStorage.removeItem(
   STORAGE_KEY
  );

 }

}

async function loadAwareness(){

   await db.rpc(

   );

   if(typeof data==="string"){

    text=data;

   }else if(
    Array.isArray(data) &&
    data.length
   ){

    text=
     data[0]?.text||
     data[0]?.sentence||
     "";

   }else if(
    typeof data==="object"
   ){

    text=
     data.text||
     data.sentence||
     "";

   }

  }

 }catch(err){

   "Awareness RPC unavailable"

 }


 if(!text){

  const day=
   Math.floor(
    Date.now()/
    (1000*60*60*24)
   );


  text=
   awarenessFallback[
    day%awarenessFallback.length
   ];

 }


 $("awarenessText").textContent=
  text;

}


async function createPost(){

 if(!currentUser){

  toast("আগে Login করুন।");

  return;

 }


 const text=
  $("postText").value.trim();


 const category=
  $("postCategory").value;


 const isAnonymous=
  $("anonymousPost").checked;


 const rules=
  $("rulesConfirm").checked;


 const photos=[
  ...($("photoInput").files||[])
 ];


 const videos=[
  ...($("videoInput").files||[])
 ];


 const files=[
  ...photos,
  ...videos
 ];


 if(!text && !files.length){

  toast(
   "Post-এর জন্য কিছু লিখুন বা ছবি/video দিন।"
  );

  return;

 }


 if(files.length>10){

  toast(
   "একটি post-এ সর্বোচ্চ ১০টি media দেওয়া যাবে।"
  );

  return;

 }


 if(!rules){

  toast(
   "Rules confirmation দিন।"
  );

  return;

 }


 try{

  const profileResult=
   await db
   .from("profiles")
   .select("id")
   .eq("id",currentUser.id)
   .limit(1);


  if(profileResult.error){
   throw profileResult.error;
  }


  if(!(profileResult.data||[]).length){

   throw new Error(
    "আপনার profile পাওয়া যায়নি। আবার Login করুন।"
   );

  }


  /*
   FIX:
   posts table-এ anonymous নয়,
   is_anonymous column ব্যবহার করা হচ্ছে।
  */

  const {data:postData,error:postError}=
   await db
   .from("posts")
   .insert({
    user_id:currentUser.id,
    content:text,
    category:category,
    is_anonymous:isAnonymous,
    status:"published"
   })
   .select("*")
   .limit(1);


  if(postError){
   throw postError;
  }


  const post=
   (postData||[])[0];


  if(!post){

   throw new Error(
    "Post তৈরি হয়নি।"
   );

  }


  for(const file of files){

   const safeName=
    file.name
    .replace(
     /[^a-zA-Z0-9._-]/g,
     "_"
    );


   const path=
    currentUser.id+
    "/"+
    Date.now()+
    "_"+
    Math.random()
     .toString(36)
     .slice(2)+
    "_"+
    safeName;


   const upload=
    await db.storage
    .from("media")
    .upload(
     path,
     file,
     {
      cacheControl:"3600",
      upsert:false
     }
    );


   if(upload.error){

    console.error(
     "MEDIA UPLOAD ERROR:",
     upload.error
    );

    continue;

   }


   const publicUrl=
    db.storage
    .from("media")
    .getPublicUrl(path)
    .data.publicUrl;


   const mediaType=
    file.type.startsWith("video/")
    ? "video"
    : "image";


   const mediaInsert=
    await db
    .from("post_media")
    .insert({
     post_id:post.id,
     media_url:publicUrl,
     media_type:mediaType
    });


   if(mediaInsert.error){

    console.error(
     "MEDIA DB ERROR:",
     mediaInsert.error
    );

   }

  }


  $("postText").value="";

  $("photoInput").value="";

  $("videoInput").value="";

  $("anonymousPost").checked=false;

  $("rulesConfirm").checked=false;


  toast(
   "Post সফল হয়েছে।"
  );


  loadFeed();


 }catch(err){

  console.error(
   "CREATE POST ERROR:",
   err
  );


  toast(
   "Post failed: "+
   (
    err.message||
    "Unknown error"
   )
  );

 }

}


async function loadFeed(){

 const feed=$("feed");


 feed.innerHTML=
  '<div class="loading">Post loading...</div>';


 try{

  const postResult=
   await db
   .from("posts")
   .select("*")
   .eq("status","published")
   .order(
    "created_at",
    {ascending:false}
   )
   .limit(50);


  if(postResult.error){
   throw postResult.error;
  }


  const posts=
   postResult.data||[];


  if(!posts.length){

   feed.innerHTML=
    '<div class="card" style="text-align:center;color:#777">'+
    'এখনও কোনো Post নেই। প্রথম Post করুন।'+
    '</div>';

   return;

  }


  const ids=[
   ...new Set(
    posts
    .map(p=>p.user_id)
    .filter(Boolean)
   )
  ];


  let profiles=[];


  if(ids.length){

   const profileResult=
    await db
    .from("profiles")
    .select("*")
    .in("id",ids);


   if(!profileResult.error){

    profiles=
     profileResult.data||[];

   }

  }


  const userMap={};


  profiles.forEach(profile=>{

   userMap[profile.id]=profile;

  });


  posts.forEach(post=>{

   post.profiles=
    userMap[post.user_id]||{};

  });


  const postIds=
   posts.map(p=>p.id);


  let media=[];


  if(postIds.length){

   const mediaResult=
    await db
    .from("post_media")
    .select("*")
    .in("post_id",postIds)
    .order(
     "created_at",
     {ascending:true}
    );


   if(!mediaResult.error){

    media=
     mediaResult.data||[];

   }

  }


  const mediaMap={};


  media.forEach(m=>{

   if(!mediaMap[m.post_id]){

    mediaMap[m.post_id]=[];

   }

   mediaMap[m.post_id].push(m);

  });


  posts.forEach(post=>{

   post.media=
    mediaMap[post.id]||[];

  });


  feed.innerHTML=
   posts
   .map(renderPost)
   .join("");


 }catch(err){

  console.error(
   "FEED ERROR:",
   err
  );


  feed.innerHTML=
   '<div class="card error">'+
   'Post loading failed: '+
   escapeHTML(
    err.message||
    "Unknown error"
   )+
   '</div>';

 }

}


function renderPost(post){

 const profile=
  post.profiles||{};


 /*
  FIX:
  anonymous column-এর বদলে
  is_anonymous ব্যবহার।
 */

 const isAnonymous=
  post.is_anonymous===true;


 const displayName=
  isAnonymous
  ? "Anonymous"
  : (
   profile.display_name||
   profile.username||
   "User"
  );


 const username=
  isAnonymous
  ? ""
  : (
   profile.username
   ? "@"+profile.username
   : ""
  );


 const avatar=
  !isAnonymous &&
  profile.avatar_url

  ? `<img class="avatar"
       src="${escapeHTML(profile.avatar_url)}"
       onerror="this.style.display='none'">`

  : `<div class="avatar">
      ${
       isAnonymous
       ? "👤"
       : escapeHTML(
        String(displayName)
        .charAt(0)
        .toUpperCase()
       )
      }
     </div>`;


 const date=
  post.created_at
  ? new Date(
     post.created_at
    ).toLocaleString("bn-BD")
  : "";


 let mediaHTML="";


 if(post.media && post.media.length){

  mediaHTML=
   `<div class="mediaGrid">`+

   post.media
   .map(m=>{

    const url=
     escapeHTML(
      m.media_url||""
     );


    if(
     m.media_type==="video"||
     url.match(
      /\.(mp4|webm|ogg)(\?|$)/i
     )
    ){

     return `
      <video
       src="${url}"
       controls
       preload="metadata">
      </video>
     `;

    }


    return `
     <img
      src="${url}"
      loading="lazy"
      alt="Post image">
    `;

   })
   .join("")+

   `</div>`;

 }


 return `
 <article
  class="card post"
  id="post-${escapeHTML(post.id)}">

  <div class="postHead">

   ${avatar}

   <div>

    <div class="postUser">
     ${escapeHTML(displayName)}
    </div>

    <div class="postMeta">

     ${escapeHTML(username)}

     ${username?" · ":""}

     ${escapeHTML(date)}

     ${
      post.category
      ? " · "+escapeHTML(post.category)
      : ""
     }

    </div>

   </div>

  </div>


  ${
   post.content
   ? `<div class="postText">
       ${escapeHTML(post.content)}
      </div>`
   : ""
  }


  ${mediaHTML}


  <div class="actions">

   <button
    onclick="toggleReaction('${escapeHTML(post.id)}')">
    👍 Like
   </button>


   <div class="reactionWrap">

    <button
     onclick="toggleReactionMenu('${escapeHTML(post.id)}')">
     ❤️ React
    </button>


    <div
     id="reaction-${escapeHTML(post.id)}"
     class="reactionMenu hidden">

     <button
      onclick="react('${escapeHTML(post.id)}','like')">
      👍
     </button>

     <button
      onclick="react('${escapeHTML(post.id)}','love')">
      ❤️
     </button>

     <button
      onclick="react('${escapeHTML(post.id)}','haha')">
      😂
     </button>

     <button
      onclick="react('${escapeHTML(post.id)}','wow')">
      😮
     </button>

     <button
      onclick="react('${escapeHTML(post.id)}','sad')">
      😢
     </button>

     <button
      onclick="react('${escapeHTML(post.id)}','angry')">
      😡
     </button>

    </div>

   </div>


   <button
    onclick="focusComment('${escapeHTML(post.id)}')">
    💬 Comment
   </button>


   <button
    onclick="sharePost('${escapeHTML(post.id)}')">
    ↗️ Share
   </button>

  </div>


  <div class="commentBox">

   <input
    id="commentInput-${escapeHTML(post.id)}"
    placeholder="Comment করুন...">

   <button
    onclick="addComment('${escapeHTML(post.id)}')">
    Send
   </button>

  </div>


  <div
   id="comments-${escapeHTML(post.id)}"
   class="comments">
  </div>

 </article>
 `;

}

async function react(postId,type){

 if(!currentUser){

  toast(
   "আগে Login করুন।"
  );

  return;

 }


 try{

  const profileResult=
   await db
   .from("profiles")
   .select("id")
   .eq("id",currentUser.id)
   .limit(1);


  if(profileResult.error){
   throw profileResult.error;
  }


  if(!(profileResult.data||[]).length){

   throw new Error(
    "আপনার profile পাওয়া যায়নি।"
   );

  }


  /*
   FIX:
   reactions table-এর সঠিক column হলো
   reaction_type
  */

  const result=
   await db
   .from("reactions")
   .select("id,reaction_type")
   .eq(
    "post_id",
    postId
   )
   .eq(
    "user_id",
    currentUser.id
   )
   .limit(1);


  if(result.error){
   throw result.error;
  }


  const existing=
   (result.data||[])[0]||
   null;


  if(existing){

   if(
    existing.reaction_type===
    type
   ){

    const del=
     await db
     .from("reactions")
     .delete()
     .eq(
      "id",
      existing.id
     );


    if(del.error){
     throw del.error;
    }


   }else{

    const update=
     await db
     .from("reactions")
     .update({
      reaction_type:type
     })
     .eq(
      "id",
      existing.id
     );


    if(update.error){
     throw update.error;
    }

   }


  }else{

   /*
    FIX:
    reaction_type অবশ্যই পাঠানো হচ্ছে।
   */

   const insert=
    await db
    .from("reactions")
    .insert({
     post_id:postId,
     user_id:currentUser.id,
     reaction_type:type
    });


   if(insert.error){
    throw insert.error;
   }

  }


  const menu=
   $("reaction-"+postId);


  if(menu){

   menu.classList.add(
    "hidden"
   );

  }


  toast(
   type==="like"
   ? "👍 Like"
   : "Reaction দেওয়া হয়েছে"
  );


 }catch(err){

  console.error(
   "REACTION ERROR:",
   err
  );


  toast(
   "Reaction failed: "+
   (
    err.message||
    "Unknown error"
   )
  );

 }

}

  currentProfile=
   profile;


  const name=
   profile.display_name||
   profile.username||
   "User";


  $("profileName").textContent=
   name;


  $("profileUsername").textContent=
   profile.username
   ? "@"+profile.username
   : "";


  $("profileBio").textContent=
   profile.bio||"";


  if(profile.avatar_url){

   $("profileAvatar").innerHTML=
    `<img
      class="avatar"
      src="${escapeHTML(profile.avatar_url)}"
      style="width:90px;height:90px"
      onerror="this.style.display='none'">`;

  }else{

   $("profileAvatar").textContent=
    String(name)
    .charAt(0)
    .toUpperCase();

  }


  loadMyPosts();


 }catch(err){

  console.error(
   "PROFILE ERROR:",
   err
  );

 }

}


async function loadMyPosts(){

 const box=
  $("myPosts");


 box.innerHTML=
  '<div class="loading">Loading...</div>';


 try{

  const result=
   await db
   .from("posts")
   .select("*")
   .eq(
    "user_id",
    currentUser.id
   )
   .order(
    "created_at",
    {ascending:false}
   )
   .limit(30);


  if(result.error){
   throw result.error;
  }


  const posts=
   result.data||[];


  if(!posts.length){

   box.innerHTML=
    '<div style="text-align:center;color:#777">'+
    'আপনার কোনো Post নেই।'+
    '</div>';

   return;

  }


  const mediaResult=
   await db
   .from("post_media")
   .select("*")
   .in(
    "post_id",
    posts.map(p=>p.id)
   );


  const media=
   mediaResult.error
   ? []
   : (
     mediaResult.data||[]
    );


  const mediaMap={};


  media.forEach(m=>{

   if(!mediaMap[m.post_id]){

    mediaMap[m.post_id]=[];

   }


   mediaMap[m.post_id].push(m);

  });


  posts.forEach(post=>{

   post.profiles=
    currentProfile||{};

   post.media=
    mediaMap[post.id]||[];

  });


  box.innerHTML=
   posts
   .map(renderPost)
   .join("");


 }catch(err){

  console.error(
   "MY POSTS ERROR:",
   err
  );


  box.innerHTML=
   '<div class="error">'+
   escapeHTML(
    err.message||
    "Loading failed"
   )+
   '</div>';

 }

}

async function saveProfile(){

 if(!currentUser){
  return;
 }


 const display_name=
  $("editName").value.trim();


 const bio=
  $("editBio").value.trim();


 const avatar_url=
  $("editAvatar").value.trim();


 if(!display_name){

  toast(
   "নাম দিন।"
  );

  return;

 }


 try{

  const result=
   await db
   .from("profiles")
   .update({
    display_name:display_name,
    bio:bio,
    avatar_url:avatar_url||null
   })
   .eq(

  );


 }catch(err){

   "UPDATE PROFILE ERROR:",
   err
  );


  toast(
   "Profile update failed: "+
   (
    err.message||
    "Unknown error"
   )
  );

 }

}


let searchTimer=null;


function searchUsers(value){

 clearTimeout(
  searchTimer
 );


 const q=
  value.trim();


 const box=
  $("searchResults");


 if(!q){

  box.classList.add(
   "hidden"
  );

  box.innerHTML="";

  return;

 }


 searchTimer=
  setTimeout(
   ()=>doSearchUsers(q),
   350
  );

}


async function doSearchUsers(q){

 const box=
  $("searchResults");


 box.classList.remove(
  "hidden"
 );


 box.innerHTML=
  '<div class="loading">Searching...</div>';


 try{

  /*
   Search input নিরাপদ করার জন্য
   special character escape করা হচ্ছে।
  */

  const safeQ=
   q.replace(
    /[%_,]/g,
    ""
   );


  if(!safeQ){

   box.innerHTML=
    '<div style="text-align:center;color:#777">'+
    'Search করুন।'+
    '</div>';

   return;

  }


  const result=
   await db
   .from("profiles")
   .select(
    "id,display_name,username,avatar_url,bio"
   )
   .or(
    `username.ilike.%${safeQ}%,display_name.ilike.%${safeQ}%`
   )
   .limit(15);


  if(result.error){
   throw result.error;
  }


  const users=
   result.data||[];


  if(!users.length){

   box.innerHTML=
    '<div style="text-align:center;color:#777">'+
    'কোনো user পাওয়া যায়নি।'+
    '</div>';

   return;

  }


  box.innerHTML=
   '<div class="searchTitle">People</div>'+
   users
   .map(user=>{

    const name=
     user.display_name||
     user.username||
     "User";


    return `
     <div
      class="searchResult"
      onclick="openUser('${escapeHTML(user.id)}')">

      <div class="row">

       ${
        user.avatar_url

        ? `<img
             class="avatar"
             src="${escapeHTML(user.avatar_url)}">`

        : `<div class="avatar">
             ${escapeHTML(
              String(name)
              .charAt(0)
              .toUpperCase()
             )}
           </div>`
       }


       <div>

        <div style="font-weight:bold">
         ${escapeHTML(name)}
        </div>

        <div style="font-size:12px;color:#777">

         ${
          user.username
          ? "@"+
            escapeHTML(
             user.username
            )
          : ""
         }

        </div>

       </div>

      </div>

     </div>
    `;

   })
   .join("");


 }catch(err){

  console.error(
   "SEARCH ERROR:",
   err
  );


  box.innerHTML=
   '<div class="error">'+
   escapeHTML(
    err.message||
    "Search failed"
   )+
   '</div>';

 }

}

async function deletePost(postId){

 if(!currentUser){
  return;
 }


 if(!confirm(
  "এই Post delete করতে চান?"
  )){
  return;
 }


 try{

  await db
   .from("post_media")
   .delete()
   .eq(
    "post_id",
    postId
   );


  await db
   .from("comments")
   .delete()
   .eq(
    "post_id",
    postId
   );


  await db
   .from("reactions")
   .delete()
   .eq(
    "post_id",
    postId
   );


  const result=
   await db
   .from("posts")
   .delete()
   .eq(
    "id",
    postId
   )
   .eq(
    "user_id",
    currentUser.id
   );


  if(result.error){
   throw result.error;
  }


  toast(
   "Post deleted"
  );


  loadFeed();


 }catch(err){

  console.error(
   "DELETE ERROR:",
   err
  );


  toast(
   "Delete failed: "+
   (
    err.message||
    "Unknown error"
   )
  );

 }

}
