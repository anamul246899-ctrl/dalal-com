<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ঘুষ সাইট</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:#f0f2f5;
  color:#1c1e21;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0}
.hidden{display:none!important}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:#1877f2;
  color:white;
  height:58px;
  display:flex;
  align-items:center;
  padding:0 12px;
  box-shadow:0 2px 8px #0002;
}
.logo{
  font-size:24px;
  font-weight:bold;
  white-space:nowrap;
}
.header-search{
  margin-left:auto;
  margin-right:8px;
}
.header-search input{
  width:190px;
  border:0;
  outline:0;
  border-radius:20px;
  padding:9px 14px;
}
.icon-btn{
  background:#ffffff22;
  color:white;
  width:40px;
  height:40px;
  border-radius:50%;
  font-size:20px;
}

.container{
  max-width:720px;
  margin:auto;
  padding:12px 8px 80px;
}

.card{
  background:white;
  border-radius:12px;
  padding:14px;
  margin-bottom:10px;
  box-shadow:0 1px 3px #0001;
}

.auth{
  max-width:430px;
  margin:35px auto;
}
.auth h1{
  text-align:center;
  color:#1877f2;
  margin-bottom:5px;
}
.auth-sub{
  text-align:center;
  color:#65676b;
  margin-bottom:20px;
}
input,textarea,select{
  width:100%;
  border:1px solid #ccd0d5;
  border-radius:8px;
  padding:12px;
  outline:none;
  margin-bottom:10px;
  background:white;
}
textarea{
  min-height:90px;
  resize:vertical;
}
input:focus,textarea:focus,select:focus{
  border-color:#1877f2;
}
.primary{
  width:100%;
  padding:12px;
  background:#1877f2;
  color:white;
  border-radius:8px;
  font-weight:bold;
}
.green{
  background:#42b72a;
}
.gray{
  background:#e4e6eb;
  color:#050505;
}
.danger{
  background:#e41e3f;
  color:white;
}
.link{
  color:#1877f2;
  background:none;
  padding:8px;
  display:block;
  margin:auto;
}
.divider{
  border-top:1px solid #ddd;
  margin:16px 0;
}

.nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:100;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:center;
}
.nav button{
  flex:1;
  max-width:145px;
  padding:8px 2px;
  background:white;
  color:#65676b;
  font-size:12px;
}
.nav button.active{
  color:#1877f2;
  font-weight:bold;
}
.nav-icon{
  display:block;
  font-size:22px;
}

.post-box{
  display:flex;
  gap:10px;
  align-items:center;
}
.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
}
.fake-input{
  flex:1;
  background:#f0f2f5;
  border-radius:22px;
  padding:12px 15px;
  color:#65676b;
}

.post-head{
  display:flex;
  align-items:center;
  gap:10px;
}
.post-user{
  flex:1;
}
.post-user strong{display:block}
.post-time{
  color:#65676b;
  font-size:12px;
}
.post-text{
  white-space:pre-wrap;
  margin:12px 0;
  line-height:1.5;
}
.post-media{
  width:100%;
  max-height:550px;
  object-fit:contain;
  border-radius:8px;
  background:#000;
}
.post-actions{
  display:flex;
  border-top:1px solid #eee;
  border-bottom:1px solid #eee;
  margin-top:10px;
}
.post-actions button{
  flex:1;
  background:white;
  padding:10px 2px;
  color:#65676b;
}
.post-actions button:hover{background:#f0f2f5}
.reaction-active{
  color:#1877f2!important;
  font-weight:bold;
}

.reactions{
  position:relative;
}
.reaction-menu{
  position:absolute;
  bottom:43px;
  left:0;
  background:white;
  border-radius:25px;
  padding:6px;
  box-shadow:0 2px 12px #0003;
  display:flex;
  gap:4px;
}
.reaction-menu button{
  background:white;
  font-size:23px;
  padding:4px;
}

.comment{
  display:flex;
  gap:8px;
  margin-top:10px;
}
.comment-body{
  background:#f0f2f5;
  padding:8px 11px;
  border-radius:15px;
  flex:1;
}
.comment-name{
  font-weight:bold;
  font-size:13px;
}
.comment-text{
  font-size:14px;
  margin-top:3px;
}
.comment-form{
  display:flex;
  gap:7px;
  margin-top:10px;
}
.comment-form input{
  margin:0;
}
.comment-form button{
  width:45px;
  background:#1877f2;
  color:white;
  border-radius:8px;
}

.profile-cover{
  text-align:center;
}
.profile-big{
  width:90px;
  height:90px;
  border-radius:50%;
  object-fit:cover;
  margin:auto;
}
.profile-name{
  font-size:22px;
  font-weight:bold;
  margin:8px;
}
.bio{
  color:#65676b;
}

.media-preview{
  max-width:100%;
  max-height:300px;
  border-radius:8px;
  margin:8px 0;
}

.search-result{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  border-bottom:1px solid #eee;
}
.search-result button{
  background:none;
  text-align:left;
  flex:1;
}

.chat-layout{
  background:white;
  border-radius:12px;
  overflow:hidden;
}
.chat-top{
  padding:12px;
  border-bottom:1px solid #ddd;
  font-weight:bold;
}
.chat-users{
  max-height:230px;
  overflow:auto;
  border-bottom:1px solid #ddd;
}
.chat-user{
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  padding:10px;
  background:white;
  border-bottom:1px solid #eee;
  text-align:left;
}
.chat-window{
  height:430px;
  display:flex;
  flex-direction:column;
}
.messages{
  flex:1;
  overflow:auto;
  padding:12px;
}
.message{
  max-width:75%;
  padding:9px 12px;
  border-radius:17px;
  margin-bottom:7px;
  clear:both;
}
.mine{
  float:right;
  background:#1877f2;
  color:white;
  border-bottom-right-radius:4px;
}
.theirs{
  float:left;
  background:#e4e6eb;
  border-bottom-left-radius:4px;
}
.message-time{
  font-size:10px;
  opacity:.7;
  margin-top:3px;
}
.chat-send{
  display:flex;
  gap:7px;
  padding:8px;
  border-top:1px solid #ddd;
}
.chat-send input{
  margin:0;
}
.chat-send button{
  width:50px;
  background:#1877f2;
  color:white;
  border-radius:8px;
}

.toast{
  position:fixed;
  left:50%;
  bottom:75px;
  transform:translateX(-50%);
  background:#222;
  color:white;
  padding:10px 16px;
  border-radius:20px;
  z-index:999;
  display:none;
}
.toast.show{display:block}

.empty{
  text-align:center;
  color:#65676b;
  padding:25px;
}

label{
  display:block;
  font-weight:bold;
  margin:7px 0;
}

@media(max-width:600px){
  .header-search input{width:130px}
  .logo{font-size:21px}
  .container{padding-left:5px;padding-right:5px}
  .card{border-radius:8px}
}
</style>
</head>

<body>

<header id="header" class="hidden">
  <div class="logo">ঘুষ সাইট</div>
  <div class="header-search">
    <input id="topSearch" placeholder="Search...">
  </div>
  <button class="icon-btn" onclick="openSearch()">🔍</button>
</header>

<!-- AUTH -->
<section id="authPage">
  <div class="card auth">

    <h1>ঘুষ সাইট</h1>
    <div class="auth-sub">
      অন্যায়, ঘুষ, দালালি ও অনিয়মের বিরুদ্ধে আওয়াজ তুলুন
    </div>

    <div id="loginBox">
      <input id="loginId" placeholder="Phone Number or Gmail">
      <input id="loginPassword" type="password" placeholder="Password">

      <button class="primary" onclick="login()">Login</button>

      <button class="link" onclick="showForgot()">
        Forgot Password?
      </button>

      <div class="divider"></div>

      <button class="primary green" onclick="showSignup()">
        Create New Account
      </button>
    </div>

    <!-- SIGNUP -->
    <div id="signupBox" class="hidden">
      <h3>Create Account</h3>

      <input id="signupName" placeholder="Full Name">
      <input id="signupPhone" placeholder="Phone Number">
      <input id="signupEmail" type="email" placeholder="Gmail / Recovery Email">
      <input id="signupPassword" type="password" placeholder="Password">
      <input id="signupConfirm" type="password" placeholder="Confirm Password">

      <button class="primary green" onclick="signup()">
        Create Account
      </button>

      <button class="link" onclick="showLogin()">
        Already have an account? Login
      </button>
    </div>

    <!-- FORGOT -->
    <div id="forgotBox" class="hidden">
      <h3>Reset Password</h3>

      <input id="forgotEmail" type="email" placeholder="Your Gmail">

      <button class="primary" onclick="sendReset()">
        Send Reset Link
      </button>

      <button class="link" onclick="showLogin()">
        Back to Login
      </button>
    </div>

  </div>
</section>

<!-- APP -->
<section id="appPage" class="hidden">

  <main class="container">

    <!-- HOME -->
    <div id="homePage">

      <div class="card">
        <div class="post-box">
          <img id="miniAvatar" class="avatar">
          <div class="fake-input" onclick="openPost()">
            What's on your mind?
          </div>
        </div>
      </div>

      <div id="feed">
        <div class="empty">Post loading...</div>
      </div>

    </div>

    <!-- SEARCH -->
    <div id="searchPage" class="hidden">
      <div class="card">
        <h3>🔍 Search</h3>
        <input id="searchInput" placeholder="Search people..." oninput="searchUsers()">
        <div id="searchResults"></div>
      </div>
    </div>

    <!-- POST -->
    <div id="postPage" class="hidden">
      <div class="card">
        <h3>📝 Create Post</h3>

        <textarea id="postContent"
          placeholder="আপনার অভিযোগ বা ঘটনা লিখুন..."></textarea>

        <label>অভিযোগের ধরন</label>
        <select id="postCategory">
          <option value="">নির্বাচন করুন</option>
          <option>ঘুষ</option>
          <option>দালালি</option>
          <option>প্রতারণা</option>
          <option>চাঁদাবাজি</option>
          <option>অনিয়ম</option>
          <option>দুর্নীতি</option>
          <option>অন্যান্য</option>
        </select>

        <label>
          <input id="anonymousPost" type="checkbox" style="width:auto">
          পরিচয় গোপন রাখতে চাই
        </label>

        <label>📷 ছবি / 🎥 ভিডিও</label>
        <input id="mediaFile" type="file" accept="image/*,video/*">

        <div id="preview"></div>

        <button class="primary" onclick="createPost()">
          Publish
        </button>
      </div>
    </div>

    <!-- PROFILE -->
    <div id="profilePage" class="hidden">
      <div class="card profile-cover">
        <img id="profileAvatar" class="profile-big">
        <div id="profileName" class="profile-name"></div>
        <div id="profileBio" class="bio"></div>
        <button class="primary" style="margin-top:12px" onclick="openEditProfile()">
          Edit Profile
        </button>
        <button class="primary danger" style="margin-top:8px" onclick="logout()">
          Logout
        </button>
      </div>

      <div id="myPosts"></div>
    </div>

    <!-- EDIT PROFILE -->
    <div id="editProfilePage" class="hidden">
      <div class="card">
        <h3>Edit Profile</h3>

        <input id="editName" placeholder="Name">
        <textarea id="editBio" placeholder="Bio"></textarea>

        <label>Profile Photo</label>
        <input id="avatarFile" type="file" accept="image/*">

        <button class="primary" onclick="saveProfile()">
          Save
        </button>

        <button class="primary gray" style="margin-top:8px"
          onclick="showPage('profile')">
          Cancel
        </button>
      </div>
    </div>

    <!-- CHAT -->
    <div id="chatPage" class="hidden">

      <div class="chat-layout">

        <div class="chat-top">
          💬 Chat
        </div>

        <div class="chat-users" id="chatUsers">
          <div class="empty">Users loading...</div>
        </div>

        <div id="chatWindow" class="chat-window hidden">

          <div id="chatTitle" class="chat-top"></div>

          <div id="messages" class="messages"></div>

          <div class="chat-send">
            <input id="messageInput" placeholder="Write a message..."
              onkeydown="if(event.key==='Enter')sendMessage()">
            <button onclick="sendMessage()">➤</button>
          </div>

        </div>

      </div>
    </div>

  </main>

  <!-- BOTTOM NAV -->
  <nav class="nav">

    <button id="navHome" onclick="showPage('home')" class="active">
      <span class="nav-icon">🏠</span>
      Home
    </button>

    <button id="navSearch" onclick="showPage('search')">
      <span class="nav-icon">🔍</span>
      Search
    </button>

    <button id="navPost" onclick="showPage('post')">
      <span class="nav-icon">➕</span>
      Post
    </button>

    <button id="navChat" onclick="showPage('chat')">
      <span class="nav-icon">💬</span>
      Chat
    </button>

    <button id="navProfile" onclick="showPage('profile')">
      <span class="nav-icon">👤</span>
      Profile
    </button>

  </nav>

</section>

<div id="toast" class="toast"></div>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://klreqkbqyyiwmohlmgkh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_xlqcHTsDaMpBq4n54iMs4A_S7gKpiZc";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser = null;
let currentProfile = null;
let selectedChatUser = null;
let messageSubscription = null;


/* =========================
   HELPERS
========================= */

function $(id){
  return document.getElementById(id);
}

function toast(message){
  $("toast").textContent = message;
  $("toast").classList.add("show");

  setTimeout(()=>{
    $("toast").classList.remove("show");
  },2500);
}

function avatar(url,name="User"){
  return url ||
    "https://ui-avatars.com/api/?name="+
    encodeURIComponent(name)+"&background=random";
}

function escapeHTML(text=""){
  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function timeAgo(date){
  const diff = Math.floor(
    (Date.now()-new Date(date).getTime())/1000
  );

  if(diff<60) return "Just now";
  if(diff<3600) return Math.floor(diff/60)+"m";
  if(diff<86400) return Math.floor(diff/3600)+"h";
  return new Date(date).toLocaleDateString();
}


/* =========================
   AUTH UI
========================= */

function showLogin(){
  $("loginBox").classList.remove("hidden");
  $("signupBox").classList.add("hidden");
  $("forgotBox").classList.add("hidden");
}

function showSignup(){
  $("loginBox").classList.add("hidden");
  $("signupBox").classList.remove("hidden");
  $("forgotBox").classList.add("hidden");
}

function showForgot(){
  $("loginBox").classList.add("hidden");
  $("signupBox").classList.add("hidden");
  $("forgotBox").classList.remove("hidden");
}


/* =========================
   LOGIN
========================= */

async function login(){

  const id = $("loginId").value.trim();
  const password = $("loginPassword").value;

  if(!id || !password){
    toast("সব তথ্য দিন");
    return;
  }

  try{

    let email = id;

    /*
      Gmail হলে সরাসরি login।
      Phone হলে profiles থেকে recovery_email খোঁজা হবে।
    */

    if(!id.includes("@")){

      const {data,error} = await db.rpc(
        "get_login_email",
        {p_phone:id}
      );

      if(error) throw error;

      if(!data){
        toast("এই Phone Number দিয়ে কোনো account পাওয়া যায়নি");
        return;
      }

      email = data;
    }

    const {error} =
      await db.auth.signInWithPassword({
        email,
        password
      });

    if(error) throw error;

    toast("Login successful");

    await loadUser();

  }catch(error){

    console.error(error);

    toast(
      error.message ||
      "Login failed"
    );
  }
}


/* =========================
   SIGNUP
========================= */

async function signup(){

  const name =
    $("signupName").value.trim();

  const phone =
    $("signupPhone").value.trim();

  const email =
    $("signupEmail").value.trim();

  const password =
    $("signupPassword").value;

  const confirm =
    $("signupConfirm").value;

  if(!name || !phone || !email || !password){
    toast("সব তথ্য পূরণ করুন");
    return;
  }

  if(password !== confirm){
    toast("Password মিলছে না");
    return;
  }

  if(password.length < 6){
    toast("Password কমপক্ষে ৬ অক্ষরের দিন");
    return;
  }

  try{

    /* phone duplicate check */

    const {data:existing} =
      await db
      .from("profiles")
      .select("id")
      .eq("phone",phone)
      .maybeSingle();

    if(existing){
      toast("এই Phone Number আগে থেকেই ব্যবহার হয়েছে");
      return;
    }

    const {data,error} =
      await db.auth.signUp({
        email,
        password
      });

    if(error) throw error;

    if(!data.user){
      toast("Account তৈরি হয়েছে। Email verify করুন।");
      return;
    }

    const {error:profileError} =
      await db
      .from("profiles")
      .upsert({
        id:data.user.id,
        display_name:name,
        phone:phone,
        recovery_email:email,
        bio:"",
        avatar_url:"",
        role:"user"
      });

    if(profileError) throw profileError;

    toast(
      "Account তৈরি হয়েছে। এখন Login করুন।"
    );

    showLogin();

  }catch(error){

    console.error(error);

    toast(
      error.message ||
      "Signup failed"
    );
  }
}


/* =========================
   FORGOT PASSWORD
========================= */

async function sendReset(){

  const email =
    $("forgotEmail").value.trim();

  if(!email){
    toast("Gmail দিন");
    return;
  }

  try{

    const redirectTo =
      window.location.origin +
      window.location.pathname;

    const {error} =
      await db.auth.resetPasswordForEmail(
        email,
        {redirectTo}
      );

    if(error) throw error;

    toast(
      "Password reset link আপনার email-এ পাঠানো হয়েছে"
    );

  }catch(error){

    toast(
      error.message ||
      "Reset failed"
    );
  }
}


/* =========================
   LOAD USER
========================= */

async function loadUser(){

  const {
    data:{user}
  } = await db.auth.getUser();

  if(!user){
    currentUser=null;
    $("authPage").classList.remove("hidden");
    $("appPage").classList.add("hidden");
    $("header").classList.add("hidden");
    return;
  }

  currentUser=user;

  let {data:profile,error} =
    await db
    .from("profiles")
    .select("*")
    .eq("id",user.id)
    .maybeSingle();

  if(error){
    console.error(error);
  }

  if(!profile){

    const newProfile={
      id:user.id,
      display_name:user.email?.split("@")[0] || "User",
      phone:"",
      recovery_email:user.email,
      bio:"",
      avatar_url:"",
      role:"user"
    };

    const result =
      await db
      .from("profiles")
      .insert(newProfile)
      .select()
      .single();

    profile=result.data;
  }

  currentProfile=profile;

  $("authPage").classList.add("hidden");
  $("appPage").classList.remove("hidden");
  $("header").classList.remove("hidden");

  $("miniAvatar").src =
    avatar(
      profile.avatar_url,
      profile.display_name
    );

  await loadFeed();
}


/* =========================
   LOGOUT
========================= */

async function logout(){

  await db.auth.signOut();

  currentUser=null;
  currentProfile=null;

  if(messageSubscription){
    await db.removeChannel(messageSubscription);
    messageSubscription=null;
  }

  showLogin();

  $("appPage").classList.add("hidden");
  $("header").classList.add("hidden");
  $("authPage").classList.remove("hidden");

  toast("Logout successful");
}


/* =========================
   PAGE NAVIGATION
========================= */

function hidePages(){

  [
    "homePage",
    "searchPage",
    "postPage",
    "profilePage",
    "editProfilePage",
    "chatPage"
  ].forEach(id=>{
    $(id).classList.add("hidden");
  });

  document
    .querySelectorAll(".nav button")
    .forEach(btn=>{
      btn.classList.remove("active");
    });
}

async function showPage(page){

  hidePages();

  if(page==="home"){
    $("homePage").classList.remove("hidden");
    $("navHome").classList.add("active");
    await loadFeed();
  }

  if(page==="search"){
    $("searchPage").classList.remove("hidden");
    $("navSearch").classList.add("active");
  }

  if(page==="post"){
    $("postPage").classList.remove("hidden");
    $("navPost").classList.add("active");
  }

  if(page==="chat"){
    $("chatPage").classList.remove("hidden");
    $("navChat").classList.add("active");
    await loadChatUsers();
  }

  if(page==="profile"){
    $("profilePage").classList.remove("hidden");
    $("navProfile").classList.add("active");
    await loadProfilePage();
  }
}

/* =========================
   CREATE POST
========================= */

$("mediaFile").addEventListener("change",function(){

  const file=this.files[0];

  if(!file){
    $("preview").innerHTML="";
    return;
  }

  const url=URL.createObjectURL(file);

  if(file.type.startsWith("image/")){
    $("preview").innerHTML=
      `<img class="media-preview" src="${url}">`;
  }else if(file.type.startsWith("video/")){
    $("preview").innerHTML=
      `<video class="media-preview" src="${url}" controls></video>`;
  }
});


async function createPost(){

  const content =
    $("postContent").value.trim();

  const category =
    $("postCategory").value;

  const anonymous =
    $("anonymousPost").checked;

  const file =
    $("mediaFile").files[0];

  if(!content && !file){
    toast("কিছু লিখুন অথবা ছবি/ভিডিও দিন");
    return;
  }

  try{

    let media_url=null;
    let media_type=null;

    if(file){

      const ext =
        file.name.split(".").pop();

      const path =
        `posts/${currentUser.id}/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;

      const {error:uploadError} =
        await db.storage
        .from("media")
        .upload(path,file,{
          upsert:false
        });

      if(uploadError) throw uploadError;

      const {data:urlData} =
        db.storage
        .from("media")
        .getPublicUrl(path);

      media_url=urlData.publicUrl;

      media_type =
        file.type.startsWith("video/")
        ? "video"
        : "image";
    }

    const finalContent =
      category
      ? `【${category}】\n${content}`
      : content;

    const {error} =
      await db
      .from("posts")
      .insert({
        user_id:currentUser.id,
        content:finalContent,
        media_url,
        media_type,
        status:"published",
        is_anonymous:anonymous
      });

    if(error) throw error;

    $("postContent").value="";
    $("postCategory").value="";
    $("anonymousPost").checked=false;
    $("mediaFile").value="";
    $("preview").innerHTML="";

    toast(
      "Post প্রকাশ হয়েছে"
    );

    await showPage("home");

  }catch(error){

    console.error(error);

    toast(
      error.message ||
      "Post করা যায়নি"
    );
  }
}


/* =========================
   FEED
========================= */

async function loadFeed(){

  const feed=$("feed");

  feed.innerHTML=
    `<div class="empty">Post loading...</div>`;

  const {data:posts,error} =
    await db
    .from("posts")
    .select(`
      *,
      profiles:user_id(
        id,
        display_name,
        avatar_url
      )
    `)
    .order("created_at",{ascending:false});

  if(error){

    console.error(error);

    feed.innerHTML=
      `<div class="empty">Post loading failed</div>`;

    return;
  }

  if(!posts || !posts.length){

    feed.innerHTML=
      `<div class="card empty">
        এখনো কোনো Post নেই।
      </div>`;

    return;
  }

  feed.innerHTML="";

  for(const post of posts){

    feed.insertAdjacentHTML(
      "beforeend",
      await postHTML(post)
    );
  }
}


/* =========================
   POST HTML
========================= */

async function postHTML(post){

  const anonymous =
    post.is_anonymous === true;

  const profile =
    post.profiles;

  const name =
    anonymous
    ? "গোপন পরিচয়"
    : (profile?.display_name || "User");

  const avatarUrl =
    anonymous
    ? "https://ui-avatars.com/api/?name=%E2%80%A2%E2%80%A2%E2%80%A2"
    : avatar(
        profile?.avatar_url,
        name
      );

  const {data:reactions} =
    await db
    .from("reactions")
    .select("reaction_type,user_id")
    .eq("post_id",post.id);

  const counts={};

  (reactions||[]).forEach(r=>{
    counts[r.reaction_type] =
      (counts[r.reaction_type]||0)+1;
  });

  const myReaction =
    reactions?.find(
      r=>r.user_id===currentUser?.id
    )?.reaction_type;

  const {data:comments} =
    await db
    .from("comments")
    .select(`
      *,
      profiles:user_id(
        display_name,
        avatar_url
      )
    `)
    .eq("post_id",post.id)
    .order("created_at",{ascending:true});

  let media="";

  if(post.media_url){

    if(post.media_type==="video"){

      media=
        `<video class="post-media"
          src="${post.media_url}"
          controls
          preload="metadata"></video>`;

    }else{

      media=
        `<img class="post-media"
          src="${post.media_url}"
          loading="lazy">`;
    }
  }

  const commentsHTML =
    (comments||[])
    .map(c=>{

      const cName =
        c.profiles?.display_name ||
        "User";

      return `
        <div class="comment">
          <img class="avatar"
            src="${avatar(
              c.profiles?.avatar_url,
              cName
            )}">
          <div class="comment-body">
            <div class="comment-name">
              ${escapeHTML(cName)}
            </div>
            <div class="comment-text">
              ${escapeHTML(c.content)}
            </div>
          </div>
        </div>
      `;
    })
    .join("");

  const totalReactions =
    reactions?.length || 0;

  return `
  <article class="card">

    <div class="post-head">

      <img class="avatar"
        src="${avatarUrl}">

      <div class="post-user">

        <strong>
          ${escapeHTML(name)}
        </strong>

        <div class="post-time">
          ${timeAgo(post.created_at)}
        </div>

      </div>

      ${
        post.user_id===currentUser?.id
        ? `<button class="gray"
            style="padding:7px 10px;border-radius:7px"
            onclick="deletePost('${post.id}')">
            🗑️
          </button>`
        : ""
      }

    </div>

    <div class="post-text">
      ${escapeHTML(post.content || "")}
    </div>

    ${media}

    <div style="margin-top:8px;color:#65676b;font-size:13px">
      ${totalReactions} reactions
      · ${(comments||[]).length} comments
    </div>

    <div class="post-actions">

      <div class="reactions">

        <button
          class="${myReaction?'reaction-active':''}"
          onclick="toggleReactionMenu('${post.id}')">
          👍 ${myReaction || "Like"}
        </button>

        <div id="reaction-${post.id}"
          class="reaction-menu hidden">

          <button onclick="react('${post.id}','Like')">👍</button>
          <button onclick="react('${post.id}','Love')">❤️</button>
          <button onclick="react('${post.id}','Haha')">😂</button>
          <button onclick="react('${post.id}','Wow')">😮</button>
          <button onclick="react('${post.id}','Sad')">😢</button>
          <button onclick="react('${post.id}','Angry')">😡</button>

        </div>

      </div>

      <button onclick="focusComment('${post.id}')">
        💬 Comment
      </button>

      <button onclick="sharePost('${post.id}')">
        ↗ Share
      </button>

    </div>

    <div id="comments-${post.id}">
      ${commentsHTML}
    </div>

    <div class="comment-form">

      <input
        id="comment-${post.id}"
        placeholder="Write a comment...">

      <button onclick="addComment('${post.id}')">
        ➤
      </button>

    </div>

  </article>
  `;
}


/* =========================
   REACTIONS
========================= */

function toggleReactionMenu(id){

  const menu=$("reaction-"+id);

  menu.classList.toggle("hidden");
}

async function react(postId,type){

  try{

    const {data:existing} =
      await db
      .from("reactions")
      .select("id,reaction_type")
      .eq("post_id",postId)
      .eq("user_id",currentUser.id)
      .maybeSingle();

    if(existing){

      if(existing.reaction_type===type){

        await db
          .from("reactions")
          .delete()
          .eq("id",existing.id);

      }else{

        await db
          .from("reactions")
          .update({
            reaction_type:type
          })
          .eq("id",existing.id);
      }

    }else{

      await db
        .from("reactions")
        .insert({
          post_id:postId,
          user_id:currentUser.id,
          reaction_type:type
        });
    }

    await loadFeed();

  }catch(error){

    console.error(error);
    toast("Reaction করা যায়নি");
  }
}


/* =========================
   COMMENTS
========================= */

function focusComment(id){
  const input=$("comment-"+id);
  if(input){
    input.focus();
  }
}

async function addComment(postId){

  const input=$("comment-"+postId);
  const text=input.value.trim();

  if(!text) return;

  try{

    const {error} =
      await db
      .from("comments")
      .insert({
        post_id:postId,
        user_id:currentUser.id,
        content:text
      });

    if(error) throw error;

    input.value="";

    await loadFeed();

  }catch(error){

    console.error(error);

    toast(
      error.message ||
      "Comment করা যায়নি"
    );
  }
}


/* =========================
   DELETE POST
========================= */

async function deletePost(id){

  if(!confirm("এই Post delete করবেন?")){
    return;
  }

  const {error} =
    await db
    .from("posts")
    .delete()
    .eq("id",id)
    .eq("user_id",currentUser.id);

  if(error){
    toast(error.message);
    return;
  }

  toast("Post deleted");

  await loadFeed();
}


/* =========================
   SHARE
========================= */

async function sharePost(id){

  const url =
    window.location.origin+
    window.location.pathname+
    "?post="+id;

  if(navigator.share){

    await navigator.share({
      title:"ঘুষ সাইট",
      text:"ঘুষ সাইটের একটি Post",
      url
    });

  }else{

    await navigator.clipboard.writeText(url);

    toast("Post link copied");
  }
}

async function saveProfile(){

  const name =
    $("editName").value.trim();

  const bio =
    $("editBio").value.trim();

  const file =
    $("avatarFile").files[0];

  if(!name){

    toast("Name দিন");
    return;
  }

  try{

    let avatar_url =
      currentProfile.avatar_url || "";

    if(file){

      const ext =
        file.name.split(".").pop();

      const path =
        `avatars/${currentUser.id}.${ext}`;

      const {error} =
        await db.storage
        .from("media")
        .upload(
          path,
          file,
          {upsert:true}
        );

      if(error) throw error;

      const {data:urlData} =
        db.storage
        .from("media")
        .getPublicUrl(path);

      avatar_url =
        urlData.publicUrl+
        "?v="+Date.now();
    }

    const {data,error} =
      await db
      .from("profiles")
      .update({
        display_name:name,
        bio,
        avatar_url
      })
      .eq("id",currentUser.id)
      .select()
      .single();

    if(error) throw error;

    currentProfile=data;

    $("avatarFile").value="";

    toast("Profile updated");

    await showPage("profile");

  }catch(error){

    console.error(error);

    toast(
      error.message ||
      "Profile update failed"
    );
  }
}

/* =========================
   START CHAT
========================= */

async function startChat(userId){

  if(userId===currentUser.id) return;

  const {data:user,error} =
    await db
    .from("profiles")
    .select("id,display_name,avatar_url")
    .eq("id",userId)
    .single();

  if(error){

    toast("User পাওয়া যায়নি");
    return;
  }

  selectedChatUser=user;

  $("chatWindow").classList.remove("hidden");

  $("chatTitle").innerHTML =
    `<div style="display:flex;align-items:center;gap:8px">
      <img class="avatar"
        src="${avatar(user.avatar_url,user.display_name)}">
      ${escapeHTML(user.display_name)}
    </div>`;

  await loadMessages();

  subscribeMessages();
}


/* =========================
   LOAD MESSAGES
========================= */

async function loadMessages(){

  if(!selectedChatUser) return;

  const {data,error} =
    await db
    .from("messages")
    .select("*")
    .or(
      `and(sender_id.eq.${currentUser.id},receiver_id.eq.${selectedChatUser.id}),and(sender_id.eq.${selectedChatUser.id},receiver_id.eq.${currentUser.id})`
    )
    .order("created_at",{ascending:true});

  if(error){

    console.error(error);

    $("messages").innerHTML=
      `<div class="empty">
        Messages loading failed
      </div>`;

    return;
  }

  const box=$("messages");

  box.innerHTML =
    (data||[]).map(message=>{

      const mine =
        message.sender_id===currentUser.id;

      return `
        <div class="message ${mine?'mine':'theirs'}">

          ${escapeHTML(message.content || "")}

          <div class="message-time">
            ${new Date(
              message.created_at
            ).toLocaleTimeString([],{
              hour:"2-digit",
              minute:"2-digit"
            })}

            ${
              mine
              ? (message.is_read ? " ✓✓" : " ✓")
              : ""
            }
          </div>

        </div>
      `;

    }).join("");

  box.scrollTop=box.scrollHeight;

  /* mark received messages read */

  await db
    .from("messages")
    .update({is_read:true})
    .eq("sender_id",selectedChatUser.id)
    .eq("receiver_id",currentUser.id)
    .eq("is_read",false);
}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage(){

  if(!selectedChatUser) return;

  const input=$("messageInput");

  const text=input.value.trim();

  if(!text) return;

  try{

    const {error} =
      await db
      .from("messages")
      .insert({
        sender_id:currentUser.id,
        receiver_id:selectedChatUser.id,
        content:text,
        is_read:false
      });

    if(error) throw error;

    input.value="";

    await loadMessages();

  }catch(error){

    console.error(error);

    toast(
      error.message ||
      "Message পাঠানো যায়নি"
    );
  }
}


/* =========================
   REALTIME CHAT
========================= */

function subscribeMessages(){

  if(messageSubscription){

    db.removeChannel(
      messageSubscription
    );

    messageSubscription=null;
  }

  messageSubscription =
    db
    .channel(
      "chat-"+currentUser.id+
      "-"+selectedChatUser.id
    )
    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"messages"
      },
      async payload=>{

        if(!selectedChatUser) return;

        const row =
          payload.new || payload.old;

        if(
          row.sender_id===currentUser.id &&
          row.receiver_id===selectedChatUser.id
          ||
          row.sender_id===selectedChatUser.id &&
          row.receiver_id===currentUser.id
        ){

          await loadMessages();
        }
      }
    )
    .subscribe();
}
