<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PASSTIME</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f0f2f5;
  color:#222;
}

header{
  background:#1877f2;
  color:#fff;
  padding:14px;
  position:sticky;
  top:0;
  z-index:100;
}

.header-inner{
  max-width:700px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:24px;
  font-weight:bold;
}

button{
  border:0;
  border-radius:8px;
  padding:10px 14px;
  cursor:pointer;
  font-size:15px;
}

.logout{
  background:#fff;
  color:#1877f2;
}

.container{
  max-width:700px;
  margin:20px auto;
  padding:0 10px;
}

.card{
  background:#fff;
  border-radius:12px;
  padding:15px;
  margin-bottom:15px;
  box-shadow:0 1px 4px rgba(0,0,0,.12);
}

h2,h3{
  margin-top:0;
}

input,textarea{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:8px;
  margin-bottom:10px;
  font-size:15px;
}

textarea{
  min-height:90px;
  resize:vertical;
}

.primary{
  width:100%;
  background:#1877f2;
  color:#fff;
}

.secondary{
  background:#e4e6eb;
}

.danger{
  background:#ffe5e5;
  color:#d00;
}

.link{
  background:none;
  color:#1877f2;
  padding:5px;
}

.hidden{
  display:none!important;
}

.tabs{
  display:flex;
  gap:8px;
  margin-bottom:15px;
}

.tabs button{
  flex:1;
}

.active{
  background:#1877f2;
  color:#fff;
}

.status{
  padding:10px;
  border-radius:8px;
  margin-bottom:10px;
  background:#f0f2f5;
}

.success{
  background:#dff6e4;
  color:#08752a;
}

.error{
  background:#ffe1e1;
  color:#a00;
}

.preview{
  width:100%;
  max-height:500px;
  object-fit:contain;
  border-radius:10px;
  margin-top:10px;
}

.post-time{
  color:#777;
  font-size:13px;
}

.actions{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  border-top:1px solid #eee;
  margin-top:10px;
  padding-top:10px;
}

.actions button{
  background:#f0f2f5;
  flex:1;
  min-width:75px;
}

.reactions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:10px;
  font-size:14px;
}

.reactions span{
  background:#f0f2f5;
  padding:6px 9px;
  border-radius:15px;
}

.comments{
  margin-top:10px;
  border-top:1px solid #eee;
  padding-top:10px;
}

.comment{
  background:#f0f2f5;
  border-radius:10px;
  padding:8px 10px;
  margin-bottom:7px;
}

.comment small{
  color:#777;
}

.comment-row{
  display:flex;
  gap:6px;
}

.comment-row input{
  margin:0;
}

.comment-row button{
  white-space:nowrap;
}

.empty{
  text-align:center;
  color:#777;
  padding:30px;
}

.file-label{
  display:inline-block;
  background:#e4e6eb;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer;
  margin-bottom:10px;
}

#fileInput{
  display:none;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:1000;
  padding:15px;
}

.modal-box{
  background:#fff;
  width:100%;
  max-width:430px;
  max-height:90vh;
  overflow:auto;
  border-radius:15px;
  padding:20px;
}

.close{
  float:right;
  background:#eee;
}

@media(max-width:500px){
  .container{
    margin-top:10px;
  }

  .logo{
    font-size:20px;
  }

  button{
    padding:9px 10px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="logo">
      PASSTIME
    </div>

    <button
      id="logoutBtn"
      class="logout hidden"
      onclick="logout()">
      Logout
    </button>

  </div>
</header>


<div class="container">

  <!-- LOGIN / REGISTRATION -->

  <div id="authArea" class="card">

    <h2>Login to PASSTIME</h2>

    <div id="authMessage"></div>

    <div class="tabs">

      <button
        id="loginTab"
        class="active"
        onclick="showAuth('login')">
        Login
      </button>

      <button
        id="signupTab"
        onclick="showAuth('signup')">
        Create Account
      </button>

    </div>


    <!-- LOGIN -->

    <div id="loginForm">

      <input
        id="loginPhone"
        type="tel"
        placeholder="Phone Number (+880...)"
        autocomplete="tel">

      <input
        id="loginPassword"
        type="password"
        placeholder="Password"
        autocomplete="current-password">

      <button
        class="primary"
        onclick="login()">
        Login
      </button>

      <br><br>

      <button
        class="link"
        onclick="showForgot()">
        Forgot Password?
      </button>

    </div>


    <!-- CREATE ACCOUNT -->

    <div id="signupForm" class="hidden">

      <input
        id="signupPhone"
        type="tel"
        placeholder="Phone Number (+880...)"
        autocomplete="tel">

      <input
        id="signupEmail"
        type="email"
        placeholder="Recovery Email"
        autocomplete="email">

      <input
        id="signupPassword"
        type="password"
        placeholder="Password (minimum 6 characters)"
        autocomplete="new-password">

      <input
        id="signupConfirm"
        type="password"
        placeholder="Confirm Password"
        autocomplete="new-password">

      <button
        class="primary"
        onclick="signup()">
        Create Account
      </button>

    </div>

  </div>


  <!-- MAIN APP -->

  <div id="appArea" class="hidden">

    <!-- CREATE POST -->

    <div class="card">

      <h3>Create Post</h3>

      <textarea
        id="postText"
        placeholder="What's on your mind?">
      </textarea>

      <label class="file-label">

        📷 Photo / 🎥 Video

        <input
          id="fileInput"
          type="file"
          accept="image/*,video/*"
          onchange="previewFile()">

      </label>

      <div id="filePreview"></div>

      <br>

      <button
        class="primary"
        onclick="createPost()">
        Publish
      </button>

    </div>


    <!-- FEED -->

    <div class="card">

      <h3>Posts</h3>

      <div id="feed">

        <div class="empty">
          Post loading...
        </div>

      </div>

    </div>

  </div>

</div>


<!-- FORGOT PASSWORD MODAL -->

<div
  id="forgotModal"
  class="modal hidden">

  <div class="modal-box">

    <button
      class="close"
      onclick="closeForgot()">
      ✕
    </button>

    <h2>Forgot Password</h2>

    <p>
      আপনার Recovery Email দিন।
    </p>

    <input
      id="forgotEmail"
      type="email"
      placeholder="Recovery Email">

    <button
      class="primary"
      onclick="sendReset()">
      Send Reset Link
    </button>

    <div id="forgotMessage"></div>

  </div>

</div>


<!-- NEW PASSWORD MODAL -->

<div
  id="resetModal"
  class="modal hidden">

  <div class="modal-box">

    <h2>Set New Password</h2>

    <input
      id="newPassword"
      type="password"
      placeholder="New Password">

    <input
      id="newPasswordConfirm"
      type="password"
      placeholder="Confirm New Password">

    <button
      class="primary"
      onclick="updatePassword()">
      Update Password
    </button>

    <div id="resetMessage"></div>

  </div>

</div>


<script>

/* =========================================
   SUPABASE CONFIG
========================================= */

const SUPABASE_URL =
"https://klreqkbqyyiwmohlmgkh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_xlqcHTsDaMpBq4n54iMs4A_S7gKpiZc";

const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser = null;


/* =========================================
   HELPER
========================================= */

function normalizePhone(phone){

  return phone
    .trim()
    .replace(/[\s\-()]/g,"");

}


function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function showMessage(id,text,type="error"){

  const el =
    document.getElementById(id);

  el.innerHTML =
    `<div class="status ${type}">
      ${escapeHtml(text)}
    </div>`;

}


/* =========================================
   AUTH TAB
========================================= */

function showAuth(type){

  document
    .getElementById("loginForm")
    .classList.toggle(
      "hidden",
      type !== "login"
    );

  document
    .getElementById("signupForm")
    .classList.toggle(
      "hidden",
      type !== "signup"
    );

  document
    .getElementById("loginTab")
    .classList.toggle(
      "active",
      type === "login"
    );

  document
    .getElementById("signupTab")
    .classList.toggle(
      "active",
      type === "signup"
    );

  document
    .getElementById("authMessage")
    .innerHTML = "";

}


/* =========================================
   CREATE ACCOUNT
========================================= */

async function signup(){

  const phone =
    normalizePhone(
      document.getElementById("signupPhone").value
    );

  const email =
    document.getElementById("signupEmail")
      .value
      .trim()
      .toLowerCase();

  const password =
    document.getElementById("signupPassword")
      .value;

  const confirm =
    document.getElementById("signupConfirm")
      .value;


  if(!phone){

    showMessage(
      "authMessage",
      "Phone Number দিন।"
    );

    return;
  }


  if(phone.length < 6){

    showMessage(
      "authMessage",
      "সঠিক Phone Number দিন।"
    );

    return;
  }


  if(!email){

    showMessage(
      "authMessage",
      "Recovery Email দিন।"
    );

    return;
  }


  if(password.length < 6){

    showMessage(
      "authMessage",
      "Password কমপক্ষে ৬ অক্ষরের হতে হবে।"
    );

    return;
  }


  if(password !== confirm){

    showMessage(
      "authMessage",
      "দুইটি Password একই নয়।"
    );

    return;
  }


  showMessage(
    "authMessage",
    "Account তৈরি হচ্ছে...",
    "success"
  );


  try{

    /* Check duplicate phone */

    const {data:existing,error:checkError}
      = await db
      .from("profiles")
      .select("id")
      .eq("phone",phone)
      .maybeSingle();


    if(checkError){

      throw checkError;

    }


    if(existing){

      showMessage(
        "authMessage",
        "এই Phone Number দিয়ে Account আগে থেকেই আছে।"
      );

      return;
    }


    /* Create Auth Account */

    const {data,error}
      = await db.auth.signUp({

        email:email,

        password:password

      });


    if(error){

      throw error;

    }


    if(!data.user){

      throw new Error(
        "Account তৈরি করা যায়নি।"
      );

    }


    /*
      Email confirmation OFF থাকলে
      session পাওয়া যাবে।
    */

    if(data.session){

      const {error:profileError}
        = await db
        .from("profiles")
        .insert({

          id:data.user.id,

          phone:phone,

          recovery_email:email

        });


      if(profileError){

        throw profileError;

      }


      showMessage(
        "authMessage",
        "Account সফলভাবে তৈরি হয়েছে।",
        "success"
      );


      await loadUser();


    }else{

      showMessage(
        "authMessage",
        "Account তৈরি হয়েছে। Supabase-এ Confirm Email OFF আছে কিনা দেখুন।"
      );

    }


  }catch(error){

    console.error(error);

    showMessage(
      "authMessage",
      signupError(error)
    );

  }

}


/* =========================================
   SIGNUP ERROR
========================================= */

function signupError(error){

  const msg =
    String(error?.message || error);


  if(
    msg.toLowerCase()
      .includes("already registered")
  ){

    return "এই Recovery Email দিয়ে Account আগে থেকেই আছে।";

  }


  if(
    msg.toLowerCase()
      .includes("invalid email")
  ){

    return "সঠিক Recovery Email দিন।";

  }


  return msg;

}


/* =========================================
   LOGIN
========================================= */

async function login(){

  const phone =
    normalizePhone(
      document.getElementById("loginPhone").value
    );

  const password =
    document.getElementById("loginPassword")
      .value;


  if(!phone || !password){

    showMessage(
      "authMessage",
      "Phone Number এবং Password দিন।"
    );

    return;
  }


  showMessage(
    "authMessage",
    "Login হচ্ছে...",
    "success"
  );


  try{

    /*
      Phone থেকে Recovery Email খোঁজা
    */

    const {data:email,error:lookupError}
      = await db.rpc(
        "get_login_email",
        {
          p_phone:phone
        }
      );


    if(lookupError){

      throw lookupError;

    }


    if(!email){

      showMessage(
        "authMessage",
        "এই Phone Number দিয়ে কোনো Account পাওয়া যায়নি।"
      );

      return;
    }


    /*
      Email + Password দিয়ে
      Supabase authentication
    */

    const {error}
      = await db.auth.signInWithPassword({

        email:email,

        password:password

      });


    if(error){

      throw error;

    }


    showMessage(
      "authMessage",
      "Login সফল হয়েছে।",
      "success"
    );


    await loadUser();


  }catch(error){

    console.error(error);

    showMessage(
      "authMessage",
      "Phone Number অথবা Password ভুল।"
    );

  }

}


/* =========================================
   LOGOUT
========================================= */

async function logout(){

  await db.auth.signOut();

  currentUser = null;

  document
    .getElementById("authArea")
    .classList.remove("hidden");

  document
    .getElementById("appArea")
    .classList.add("hidden");

  document
    .getElementById("logoutBtn")
    .classList.add("hidden");

  showAuth("login");

}


/* =========================================
   LOAD USER
========================================= */

async function loadUser(){

  const {data}
    = await db.auth.getSession();

  currentUser =
    data.session?.user || null;


  if(currentUser){

    document
      .getElementById("authArea")
      .classList.add("hidden");

    document
      .getElementById("appArea")
      .classList.remove("hidden");

    document
      .getElementById("logoutBtn")
      .classList.remove("hidden");

    await loadFeed();

  }else{

    document
      .getElementById("authArea")
      .classList.remove("hidden");

    document
      .getElementById("appArea")
      .classList.add("hidden");

    document
      .getElementById("logoutBtn")
      .classList.add("hidden");

  }

}


/* =========================================
   FORGOT PASSWORD
========================================= */

function showForgot(){

  document
    .getElementById("forgotModal")
    .classList.remove("hidden");

}


function closeForgot(){

  document
    .getElementById("forgotModal")
    .classList.add("hidden");

}


async function sendReset(){

  const email =
    document
      .getElementById("forgotEmail")
      .value
      .trim()
      .toLowerCase();


  if(!email){

    showMessage(
      "forgotMessage",
      "Recovery Email দিন।"
    );

    return;
  }


  try{

    const {error}
      = await db.auth
      .resetPasswordForEmail(
        email,
        {
          redirectTo:
            window.location.origin +
            window.location.pathname
        }
      );


    if(error){

      throw error;

    }


    showMessage(
      "forgotMessage",
      "Password reset link আপনার Recovery Email-এ পাঠানো হয়েছে।",
      "success"
    );


  }catch(error){

    console.error(error);

    showMessage(
      "forgotMessage",
      "Reset link পাঠানো যায়নি: " +
      error.message
    );

  }

}


/* =========================================
   UPDATE PASSWORD
========================================= */

async function updatePassword(){

  const password =
    document
      .getElementById("newPassword")
      .value;

  const confirm =
    document
      .getElementById("newPasswordConfirm")
      .value;


  if(password.length < 6){

    showMessage(
      "resetMessage",
      "Password কমপক্ষে ৬ অক্ষরের হতে হবে।"
    );

    return;
  }


  if(password !== confirm){

    showMessage(
      "resetMessage",
      "Password দুটি একই নয়।"
    );

    return;
  }


  try{

    const {error}
      = await db.auth.updateUser({

        password:password

      });


    if(error){

      throw error;

    }


    showMessage(
      "resetMessage",
      "Password সফলভাবে পরিবর্তন হয়েছে।",
      "success"
    );


    setTimeout(()=>{

      document
        .getElementById("resetModal")
        .classList.add("hidden");

    },1500);


  }catch(error){

    showMessage(
      "resetMessage",
      error.message
    );

  }

}


/* =========================================
   FILE PREVIEW
========================================= */

function previewFile(){

  const file =
    document
      .getElementById("fileInput")
      .files[0];

  const preview =
    document.getElementById("filePreview");


  preview.innerHTML = "";


  if(!file){

    return;
  }


  const url =
    URL.createObjectURL(file);


  if(file.type.startsWith("image/")){

    preview.innerHTML =
      `<img
        class="preview"
        src="${url}">
      `;

  }else if(file.type.startsWith("video/")){

    preview.innerHTML =
      `<video
        class="preview"
        controls
        src="${url}">
      </video>`;

  }

}


/* =========================================
   CREATE POST
========================================= */

async function createPost(){

  if(!currentUser){

    showAuth("login");

    return;
  }


  const content =
    document
      .getElementById("postText")
      .value
      .trim();

  const file =
    document
      .getElementById("fileInput")
      .files[0];


  if(!content && !file){

    alert(
      "কিছু লিখুন অথবা Photo/Video দিন।"
    );

    return;
  }


  try{

    let media_url = null;

    let media_type = null;


    /* Upload Photo / Video */

    if(file){

      const extension =
        file.name
          .split(".")
          .pop()
          .toLowerCase();


      const fileName =
        currentUser.id +
        "_" +
        Date.now() +
        "." +
        extension;


      const filePath =
        "posts/" + fileName;


      const {error:uploadError}
        = await db.storage
        .from("complaint-media")
        .upload(
          filePath,
          file,
          {
            upsert:false
          }
        );


      if(uploadError){

        throw uploadError;

      }


      const {data:urlData}
        = db.storage
        .from("complaint-media")
        .getPublicUrl(
          filePath
        );


      media_url =
        urlData.publicUrl;


      media_type =
        file.type.startsWith("video/")
        ? "video"
        : "image";

    }


    /* Insert Post */

    const {error}
      = await db
      .from("posts")
      .insert({

        user_id:currentUser.id,

        content:content,

        media_url:media_url,

        media_type:media_type

      });


    if(error){

      throw error;

    }


    document
      .getElementById("postText")
      .value = "";


    document
      .getElementById("fileInput")
      .value = "";


    document
      .getElementById("filePreview")
      .innerHTML = "";


    await loadFeed();


  }catch(error){

    console.error(error);

    alert(
      "Post করা যায়নি: " +
      error.message
    );

  }

}


/* =========================================
   LOAD FEED
========================================= */

async function loadFeed(){

  const feed =
    document.getElementById("feed");


  feed.innerHTML =
    `<div class="empty">
      Post loading...
    </div>`;


  try{

    const {data:posts,error}
      = await db
      .from("posts")
      .select("*")
      .order(
        "created_at",
        {ascending:false}
      );


    if(error){

      throw error;

    }


    if(!posts || posts.length===0){

      feed.innerHTML =
        `<div class="empty">
          এখনো কোনো Post নেই।
        </div>`;

      return;
    }


    feed.innerHTML = "";


    for(const post of posts){

      await renderPost(
        post,
        feed
      );

    }


  }catch(error){

    console.error(error);

    feed.innerHTML =
      `<div class="status error">
        Feed load করা যায়নি:
        ${escapeHtml(error.message)}
      </div>`;

  }

}


/* =========================================
   RENDER POST
========================================= */

async function renderPost(
  post,
  feed
){

  const div =
    document.createElement("div");

  div.className = "card";


  let media = "";


  if(post.media_type === "image"){

    media =
      `<img
        class="preview"
        src="${escapeHtml(post.media_url)}"
        loading="lazy">`;

  }


  if(post.media_type === "video"){

    media =
      `<video
        class="preview"
        controls
        preload="metadata"
        src="${escapeHtml(post.media_url)}">
      </video>`;

  }


  const time =
    new Date(post.created_at)
      .toLocaleString("bn-BD");


  div.innerHTML = `

    <div>

      <strong>PASSTIME User</strong>

      <div class="post-time">
        ${time}
      </div>

    </div>

    ${
      post.content
      ?
      `<p>${escapeHtml(post.content)}</p>`
      :
      ""
    }

    ${media}

    <div id="reaction_${post.id}">
      Loading reactions...
    </div>

    <div class="actions">

      <button
        onclick="reactPost(${post.id},'like')">
        👍 Like
      </button>

      <button
        onclick="reactPost(${post.id},'love')">
        ❤️ Love
      </button>

      <button
        onclick="reactPost(${post.id},'haha')">
        😂 Haha
      </button>

      <button
        onclick="reactPost(${post.id},'wow')">
        😮 Wow
      </button>

      <button
        onclick="reactPost(${post.id},'sad')">
        😢 Sad
      </button>

      <button
        onclick="reactPost(${post.id},'angry')">
        😡 Angry
      </button>

      ${
        currentUser &&
        currentUser.id === post.user_id
        ?
        `<button
          class="danger"
          onclick="deletePost(${post.id})">
          🗑️ Delete
        </button>`
        :
        ""
      }

    </div>

    <div class="comments">

      <div id="comments_${post.id}">
        Loading comments...
      </div>

      ${
        currentUser
        ?
        `
        <div class="comment-row">

          <input
            id="commentInput_${post.id}"
            placeholder="Write a comment...">

          <button
            class="primary"
            onclick="addComment(${post.id})">
            Send
          </button>

        </div>
        `
        :
        ""
      }

    </div>

  `;


  feed.appendChild(div);


  await loadReactions(post.id);

  await loadComments(post.id);

}


/* =========================================
   REACTIONS
========================================= */

async function loadReactions(postId){

  const box =
    document.getElementById(
      "reaction_" + postId
    );


  const {data,error}
    = await db
    .from("reactions")
    .select("reaction_type")
    .eq("post_id",postId);


  if(error){

    box.innerHTML = "";

    return;
  }


  const counts = {};


  (data || []).forEach(r=>{

    counts[r.reaction_type] =
      (counts[r.reaction_type] || 0) + 1;

  });


  box.innerHTML =
    `<div class="reactions">

      ${Object.entries(counts)
        .map(
          ([type,count]) =>
          `<span>
            ${reactionEmoji(type)}
            ${count}
          </span>`
        )
        .join("")}

    </div>`;

}


function reactionEmoji(type){

  const map = {

    like:"👍",

    love:"❤️",

    haha:"😂",

    wow:"😮",

    sad:"😢",

    angry:"😡"

  };

  return map[type] || "👍";

}


async function reactPost(
  postId,
  type
){

  if(!currentUser){

    showAuth("login");

    return;
  }


  try{

    const {data:existing,error:findError}
      = await db
      .from("reactions")
      .select("id,reaction_type")
      .eq("post_id",postId)
      .eq("user_id",currentUser.id)
      .maybeSingle();


    if(findError){

      throw findError;

    }


    if(existing){

      if(existing.reaction_type === type){

        const {error}
          = await db
          .from("reactions")
          .delete()
          .eq("id",existing.id);

        if(error){

          throw error;

        }

      }else{

        const {error}
          = await db
          .from("reactions")
          .update({
            reaction_type:type
          })
          .eq("id",existing.id);

        if(error){

          throw error;

        }

      }

    }else{

      const {error}
        = await db
        .from("reactions")
        .insert({

          post_id:postId,

          user_id:currentUser.id,

          reaction_type:type

        });


      if(error){

        throw error;

      }

    }


    await loadReactions(postId);


  }catch(error){

    console.error(error);

    alert(
      "Reaction করা যায়নি: " +
      error.message
    );

  }

}


/* =========================================
   COMMENTS
========================================= */

async function loadComments(postId){

  const box =
    document.getElementById(
      "comments_" + postId
    );


  const {data,error}
    = await db
    .from("comments")
    .select("*")
    .eq("post_id",postId)
    .order(
      "created_at",
      {ascending:true}
    );


  if(error){

    box.innerHTML = "";

    return;
  }


  if(!data || data.length===0){

    box.innerHTML =
      `<div class="post-time">
        No comments yet.
      </div>`;

    return;
  }


  box.innerHTML =
    data.map(comment=>{

      const time =
        new Date(comment.created_at)
          .toLocaleString("bn-BD");


      return `

        <div class="comment">

          <strong>PASSTIME User</strong>

          <div>
            ${escapeHtml(comment.content)}
          </div>

          <small>
            ${time}
          </small>

          ${
            currentUser &&
            currentUser.id === comment.user_id
            ?
            `
            <br>

            <button
              class="link"
              onclick="deleteComment(
                ${comment.id},
                ${postId}
              )">
              Delete
            </button>
            `
            :
            ""
          }

        </div>

      `;

    }).join("");

}


async function addComment(postId){

  if(!currentUser){

    showAuth("login");

    return;
  }


  const input =
    document.getElementById(
      "commentInput_" + postId
    );


  const content =
    input.value.trim();


  if(!content){

    return;
  }


  try{

    const {error}
      = await db
      .from("comments")
      .insert({

        post_id:postId,

        user_id:currentUser.id,

        content:content

      });


    if(error){

      throw error;

    }


    input.value = "";


    await loadComments(postId);


  }catch(error){

    console.error(error);

    alert(
      "Comment করা যায়নি: " +
      error.message
    );

  }

}


async function deleteComment(
  id,
  postId
){

  if(!currentUser){

    return;
  }


  if(!confirm(
    "Comment delete করবেন?"
  )){

    return;
  }


  const {error}
    = await db
    .from("comments")
    .delete()
    .eq("id",id)
    .eq("user_id",currentUser.id);


  if(error){

    alert(error.message);

    return;
  }


  await loadComments(postId);

}


/* =========================================
   DELETE POST
========================================= */

async function deletePost(postId){

  if(!currentUser){

    return;
  }


  if(!confirm(
    "এই Post delete করবেন?"
  )){

    return;
  }


  try{

    const {data:post,error:findError}
      = await db
      .from("posts")
      .select("media_url")
      .eq("id",postId)
      .eq("user_id",currentUser.id)
      .maybeSingle();


    if(findError){

      throw findError;

    }


    const {error}
      = await db
      .from("posts")
      .delete()
      .eq("id",postId)
      .eq("user_id",currentUser.id);


    if(error){

      throw error;

    }


    /*
      Storage media delete
    */

    if(post?.media_url){

      try{

        const marker =
          "/complaint-media/";

        const index =
          post.media_url.indexOf(marker);


        if(index !== -1){

          const path =
            post.media_url.substring(
              index + marker.length
            );


          await db.storage
            .from("complaint-media")
            .remove([path]);

        }

      }catch(storageError){

        console.log(
          "Storage delete:",
          storageError
        );

      }

    }


    await loadFeed();


  }catch(error){

    console.error(error);

    alert(
      "Post delete করা যায়নি: " +
      error.message
    );

  }

}


/* =========================================
   AUTH STATE
========================================= */

db.auth.onAuthStateChange(
  async (event,session)=>{

    currentUser =
      session?.user || null;


    if(currentUser){

      document
        .getElementById("authArea")
        .classList.add("hidden");

      document
        .getElementById("appArea")
        .classList.remove("hidden");

      document
        .getElementById("logoutBtn")
        .classList.remove("hidden");

      await loadFeed();

    }else{

      document
        .getElementById("authArea")
        .classList.remove("hidden");

      document
        .getElementById("appArea")
        .classList.add("hidden");

      document
        .getElementById("logoutBtn")
        .classList.add("hidden");

    }

  }
);


/* =========================================
   INITIALIZE
========================================= */

async function init(){

  const {data}
    = await db.auth.getSession();


  currentUser =
    data.session?.user || null;


  /*
    Password recovery link থেকে এলে
    New Password window খুলবে।
  */

  if(
    window.location.hash
      .includes("type=recovery")
  ){

    document
      .getElementById("resetModal")
      .classList.remove("hidden");

  }


  if(currentUser){

    await loadUser();

  }

}


init();
