<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dalal.com — অন্যায়ের বিরুদ্ধে আওয়াজ তুলুন</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
}

body{
  background:#f2fff6;
  color:#173b24;
}

header{
  background:#087f3e;
  color:white;
  padding:18px;
}

.logo{
  max-width:1000px;
  margin:auto;
  font-size:28px;
  font-weight:bold;
}

.hero{
  background:linear-gradient(135deg,#087f3e,#12a85a);
  color:white;
  text-align:center;
  padding:55px 20px;
}

.hero h1{
  font-size:34px;
  margin-bottom:10px;
}

.hero p{
  font-size:17px;
}

.container{
  max-width:850px;
  margin:30px auto;
  padding:0 15px;
}

.card{
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 5px 25px rgba(0,0,0,.08);
  margin-bottom:25px;
}

h2{
  color:#087f3e;
  margin-bottom:15px;
}

.notice{
  background:#eaf9ef;
  padding:14px;
  border-left:5px solid #087f3e;
  margin-bottom:20px;
  border-radius:6px;
}

label{
  display:block;
  font-weight:bold;
  margin:15px 0 7px;
}

input,select,textarea{
  width:100%;
  padding:13px;
  border:1px solid #c8ddd0;
  border-radius:8px;
  font-size:15px;
}

textarea{
  min-height:150px;
  resize:vertical;
}

.anonymous{
  background:#f3fff6;
  padding:14px;
  border-radius:8px;
  margin-top:18px;
  display:flex;
  gap:10px;
  align-items:center;
}

.anonymous input{
  width:auto;
}

.anonymous label{
  margin:0;
  font-weight:normal;
}

.upload{
  border:2px dashed #a5cdb3;
  padding:18px;
  border-radius:8px;
  text-align:center;
}

.upload input{
  border:0;
}

.upload p{
  margin-top:10px;
  font-size:14px;
}

button{
  width:100%;
  background:#087f3e;
  color:white;
  border:0;
  padding:15px;
  margin-top:22px;
  border-radius:9px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  background:#8aa995;
}

#message{
  display:none;
  margin-top:18px;
  padding:14px;
  border-radius:8px;
  text-align:center;
  font-weight:bold;
}

.success{
  background:#e5f8eb;
  color:#087f3e;
}

.error{
  background:#ffe8e8;
  color:#b00020;
}

/* Published complaints */

.complaints-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.refresh-btn{
  width:auto;
  margin:0;
  padding:9px 14px;
  font-size:14px;
}

.complaint{
  border:1px solid #d7eadc;
  border-radius:12px;
  padding:18px;
  margin-top:15px;
  background:#fbfffc;
}

.complaint h3{
  color:#087f3e;
  margin-bottom:10px;
}

.badge{
  display:inline-block;
  background:#e5f8eb;
  color:#087f3e;
  padding:5px 10px;
  border-radius:20px;
  font-size:13px;
  margin-bottom:10px;
}

.complaint p{
  line-height:1.7;
  margin-top:8px;
}

.empty{
  text-align:center;
  padding:25px;
  color:#66756b;
}

.loading{
  text-align:center;
  padding:25px;
}

footer{
  margin-top:40px;
  background:#063f21;
  color:white;
  text-align:center;
  padding:30px 15px;
}

@media(max-width:600px){

  .hero h1{
    font-size:27px;
  }

  .card{
    padding:18px;
  }

  .complaints-title{
    align-items:flex-start;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">🌿 Dalal.com</div>
</header>

<section class="hero">
  <h1>অন্যায়ের বিরুদ্ধে আওয়াজ তুলুন</h1>
  <p>ঘুষ, দালালি, প্রতারণা ও অনিয়মের অভিযোগ জানান।</p>
</section>

<div class="container">

<!-- অভিযোগ জমা -->

<div class="card">

<h2>📝 অভিযোগ জমা দিন</h2>

<div class="notice">
🔒 পরিচয় গোপন রাখতে চাইলে নিচের অপশনটি চালু রাখুন।
</div>

<form id="complaintForm">

<label>অভিযোগের ধরন *</label>

<select id="category" required>
<option value="">নির্বাচন করুন</option>
<option value="ঘুষ">ঘুষ</option>
<option value="দালালি">দালালি</option>
<option value="প্রতারণা">প্রতারণা</option>
<option value="চাঁদাবাজি">চাঁদাবাজি</option>
<option value="অনিয়ম">অনিয়ম</option>
<option value="অন্যান্য">অন্যান্য</option>
</select>

<label>অভিযোগের শিরোনাম *</label>

<input
id="title"
type="text"
placeholder="যেমন: চাকরি দেওয়ার নামে টাকা দাবি"
required
>

<label>বিস্তারিত অভিযোগ *</label>

<textarea
id="description"
placeholder="ঘটনাটি বিস্তারিত লিখুন..."
required
></textarea>

<label>আপনার নাম</label>

<input
id="name"
type="text"
placeholder="নাম না চাইলে খালি রাখুন"
>

<label>মোবাইল নম্বর</label>

<input
id="phone"
type="tel"
placeholder="01XXXXXXXXX"
>

<div class="anonymous">

<input
id="anonymous"
type="checkbox"
checked
>

<label for="anonymous">
🔒 আমার পরিচয় গোপন রাখুন
</label>

</div>

<label>📷 ছবি / 🎥 ভিডিও</label>

<div class="upload">

<input
id="media"
type="file"
accept="image/*,video/*"
multiple
>

<p>প্রতিটি ফাইল সর্বোচ্চ 50 MB।</p>

</div>

<button id="submitBtn" type="submit">
🚀 অভিযোগ জমা দিন
</button>

<div id="message"></div>

</form>

</div>


<!-- Published অভিযোগ -->

<div class="card">

<div class="complaints-title">

<h2>📋 প্রকাশিত অভিযোগ</h2>

<button
class="refresh-btn"
onclick="loadPublishedComplaints()"
>
🔄 Refresh
</button>

</div>

<div id="complaintsList">

<div class="loading">
⏳ অভিযোগগুলো লোড হচ্ছে...
</div>

</div>

</div>

</div>


<footer>

<p>🌿 Dalal.com</p>
<p>অন্যায়ের বিরুদ্ধে আওয়াজ</p>
<p>© 2026 Dalal.com</p>

</footer>


<script>

const SUPABASE_URL =
"https://klreqkbqyyiwmohlmgkh.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_xlqcHTsDaMpBq4n54iMs4A_S7gKpiZc";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


const form =
document.getElementById("complaintForm");

const submitBtn =
document.getElementById("submitBtn");

const message =
document.getElementById("message");

const complaintsList =
document.getElementById("complaintsList");


function showMessage(text,type){

  message.textContent = text;

  message.className = type;

  message.style.display = "block";

  window.scrollTo({
    top: message.getBoundingClientRect().top +
        window.scrollY -
        120,
    behavior:"smooth"
  });
}


/* অভিযোগ জমা */

form.addEventListener("submit", async function(e){

  e.preventDefault();

  message.style.display = "none";

  submitBtn.disabled = true;

  submitBtn.textContent = "⏳ জমা হচ্ছে...";

  try{

    const category =
    document.getElementById("category").value.trim();

    const title =
    document.getElementById("title").value.trim();

    const description =
    document.getElementById("description").value.trim();

    const name =
    document.getElementById("name").value.trim();

    const phone =
    document.getElementById("phone").value.trim();

    const anonymous =
    document.getElementById("anonymous").checked;

    const files =
    document.getElementById("media").files;


    for(let i=0;i<files.length;i++){

      if(files[i].size > 50 * 1024 * 1024){

        throw new Error(
          "একটি ফাইল 50 MB-এর বেশি হতে পারবে না।"
        );

      }

    }


    const complaintData = {

      category:category,

      title:title,

      description:description,

      name:anonymous
        ? null
        : (name || null),

      phone:anonymous
        ? null
        : (phone || null),

      is_anonymous:anonymous

    };


    const {error:insertError} =
    await supabaseClient
      .from("complaints")
      .insert(complaintData);


    if(insertError){

      throw insertError;

    }


    showMessage(
      "✅ আপনার অভিযোগ সফলভাবে জমা হয়েছে। Admin যাচাই করার পর এটি প্রকাশ করা হবে।",
      "success"
    );


    form.reset();

    document.getElementById("anonymous").checked = true;


  }catch(error){

    console.error("Complaint Error:",error);

    showMessage(
      "❌ অভিযোগ জমা দেওয়া যায়নি: " +
      error.message,
      "error"
    );

  }


  submitBtn.disabled = false;

  submitBtn.textContent =
    "🚀 অভিযোগ জমা দিন";

});


/* Published অভিযোগ লোড */

async function loadPublishedComplaints(){

  complaintsList.innerHTML =
  '<div class="loading">⏳ অভিযোগগুলো লোড হচ্ছে...</div>';


  try{

    const {data,error} =
    await supabaseClient
      .from("complaints")
      .select("category,title,description,is_anonymous,created_at")
      .eq("status","published")
      .order("created_at",{ascending:false});


    if(error){

      throw error;

    }


    if(!data || data.length === 0){

      complaintsList.innerHTML =
      '<div class="empty">📭 এখনো কোনো প্রকাশিত অভিযোগ নেই।</div>';

      return;

    }


    complaintsList.innerHTML = "";


    data.forEach(function(complaint){

      const item =
      document.createElement("div");

      item.className = "complaint";


      const title =
      document.createElement("h3");

      title.textContent =
      complaint.title || "শিরোনাম নেই";


      const badge =
      document.createElement("span");

      badge.className = "badge";

      badge.textContent =
      complaint.category || "অন্যান্য";


      const description =
      document.createElement("p");

      description.textContent =
      complaint.description || "";


      const privacy =
      document.createElement("p");

      privacy.textContent =
      "🔒 পরিচয়: গোপন";


      item.appendChild(title);

      item.appendChild(badge);

      item.appendChild(description);

      item.appendChild(privacy);


      complaintsList.appendChild(item);

    });


  }catch(error){

    console.error("Load Error:",error);

    complaintsList.innerHTML =
    '<div class="empty">❌ প্রকাশিত অভিযোগ লোড করা যাচ্ছে না।</div>';

  }

}


/* পেজ খোলার সঙ্গে সঙ্গে Published অভিযোগ লোড */

loadPublishedComplaints();

</script>

</body>
</html>
