<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PASSTIME</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f0f2f5;
 color:#222
}
header{
 background:#16a34a;
 color:#fff;
 height:60px;
 padding:0 15px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 position:sticky;
 top:0;
 z-index:50
}
.logo{font-size:26px;font-weight:bold}
button{
 border:0;
 border-radius:8px;
 padding:9px 13px;
 cursor:pointer;
 font-size:14px
}
.login{
 background:#fff;
 color:#16a34a;
 font-weight:bold
}
.logout{
 background:#dc2626;
 color:#fff
}
.container{
 width:100%;
 max-width:680px;
 margin:18px auto;
 padding:0 10px
}
.card{
 background:#fff;
 border-radius:12px;
 margin-bottom:15px;
 padding:15px;
 box-shadow:0 1px 4px #0002
}
.user{
 color:#555;
 font-size:14px
}
.create{
 display:flex;
 gap:10px;
 align-items:center
}
.create input{
 flex:1;
 padding:12px;
 border-radius:25px;
 border:1px solid #ddd;
 outline:none
}
.media-buttons{
 display:flex;
 gap:8px;
 margin-top:12px
}
.media-buttons button{
 flex:1;
 background:#f3f4f6
}
.post-head{
 display:flex;
 justify-content:space-between;
 align-items:center
}
.post-user{
 font-weight:bold;
 color:#111
}
.post-date{
 font-size:11px;
 color:#888
}
.post-text{
 white-space:pre-wrap;
 margin:13px 0
}
.post-media{
 width:100%;
 max-height:500px;
 object-fit:contain;
 border-radius:10px;
 background:#111;
 margin-top:5px
}
.reactions{
 display:flex;
 flex-wrap:wrap;
 gap:5px;
 margin-top:10px
}
.reactions button{
 background:#f3f4f6;
 padding:7px 9px
}
.actions{
 border-top:1px solid #eee;
 margin-top:12px;
 padding-top:8px;
 display:flex;
 justify-content:space-around
}
.actions button{
 background:#fff;
 color:#555
}
.comments{
 margin-top:12px;
 border-top:1px solid #eee;
 padding-top:10px
}
.comment{
 background:#f3f4f6;
 border-radius:10px;
 padding:8px 10px;
 margin:6px 0;
 font-size:14px
}
.comment-input{
 display:flex;
 gap:6px;
 margin-top:8px
}
.comment-input input{
 flex:1;
 padding:9px;
 border:1px solid #ddd;
 border-radius:20px
}
.modal{
 display:none;
 position:fixed;
 inset:0;
 background:#0009;
 z-index:100;
 align-items:center;
 justify-content:center;
 padding:15px;
 overflow:auto
}
.modal-box{
 width:100%;
 max-width:430px;
 background:#fff;
 border-radius:15px;
 padding:20px;
 position:relative
}
.close{
 position:absolute;
 right:10px;
 top:10px;
 border-radius:50%;
 background:#eee
}
.modal h2{
 text-align:center;
 color:#16a34a;
 margin-top:5px
}
.modal input,.modal select,.modal textarea{
 width:100%;
 padding:11px;
 margin:6px 0;
 border:1px solid #ccc;
 border-radius:8px;
 font-size:15px
}
.primary{
 width:100%;
 background:#16a34a;
 color:white;
 margin-top:7px
}
.secondary{
 width:100%;
 background:#e5e7eb;
 margin-top:7px
}
.tabs{
 display:flex;
 gap:5px;
 margin-bottom:10px
}
.tabs button{
 flex:1;
 background:#e5e7eb
}
.tabs .active{
 background:#16a34a;
 color:#fff
}
.phone-row{
 display:flex;
 gap:5px
}
.phone-row select{width:40%}
.phone-row input{width:60%}
.hidden{display:none}
.msg{
 text-align:center;
 font-size:14px;
 margin:8px 0
}
.file-name{
 font-size:12px;
 color:#666;
 margin-top:5px
}
.empty{
 text-align:center;
 color:#777;
 padding:25px
}
@media(max-width:500px){
 .logo{font-size:22px}
 .actions button{font-size:12px}
 .reactions button{font-size:12px}
}
</style>
</head>

<body>

<header>
 <div class="logo">PASSTIME</div>
 <div id="accountArea">
  <button class="login" onclick="openLogin()">Login</button>
 </div>
</header>

<div class="container">

 <div class="card">
  <div id="userStatus" class="user">
   আপনি এখনো Login করেননি।
  </div>
 </div>

 <!-- CREATE POST -->
 <div class="card">

  <div class="create">
   <input
    id="quickPost"
    placeholder="What's on your mind?"
    onclick="requireLogin()"
    readonly
   >
  </div>

  <div class="media-buttons">
   <button onclick="openPostBox('photo')">📷 Photo</button>

 </div>

  <div class="card empty">Post loading...</div>

<!-- LOGIN -->

   <option value="+974">🇶🇦 +974</option>

   <option value="+968">🇴🇲 +968</option>
   <option value="+973">🇧🇭 +973</option>

   <option value="+65">🇸🇬 +65</option>

</div>


<!-- FORGOT -->

<div id="forgotArea" class="hidden">

 <input id="resetEmail"
  type="email"
  placeholder="Your Email">

  Send Reset Link
 </button>

  Back to Login
 </button>

</div>

</div>
</div>



<!-- POST MODAL -->

<div id="postModal" class="modal">
<div class="modal-box">

<button class="close" onclick="closePostBox()">×</button>

<h2>Create Post</h2>

<textarea
 id="postText"
 rows="5"
 placeholder="What's on your mind?"
></textarea>

<input
 id="mediaFile"
 type="file"
 accept="image/*,video/*"
 onchange="showFileName()"
>

<div id="fileName" class="file-name"></div>

<button class="primary" onclick="publishPost()">
 Publish
</button>

<button class="secondary" onclick="closePostBox()">
 Cancel
</button>

<div id="postMsg" class="msg"></div>

</div>
</div>



<script>

/* =====================================
   SUPABASE
===================================== */

const SUPABASE_URL =
"https://klreqkbqyyiwmohlmgkh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_xlqcHTsDaMpBq4n54iMs4A_S7gKpiZc";

const db =
supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);


/* =====================================
   AUTH
===================================== */

function openLogin(){
 document.getElementById("loginModal").style.display="flex";
}

function closeLogin(){
 document.getElementById("loginModal").style.display="none";
}

function emailMode(){

 document.getElementById("emailArea").classList.remove("hidden");
 document.getElementById("phoneArea").classList.add("hidden");
 document.getElementById("forgotArea").classList.add("hidden");

 document.getElementById("emailTab").classList.add("active");
 document.getElementById("phoneTab").classList.remove("active");

}

function phoneMode(){

 document.getElementById("emailArea").classList.add("hidden");
 document.getElementById("phoneArea").classList.remove("hidden");
 document.getElementById("forgotArea").classList.add("hidden");

 document.getElementById("emailTab").classList.remove("active");
 document.getElementById("phoneTab").classList.add("active");

}

function forgotMode(){

 document.getElementById("emailArea").classList.add("hidden");
 document.getElementById("phoneArea").classList.add("hidden");
 document.getElementById("forgotArea").classList.remove("hidden");

}


async function loginEmail(){

 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;

 if(!email || !password){
  return showLoginMsg("Email ও Password দিন।");
 }

 showLoginMsg("Login হচ্ছে...");

 const {error}=await db.auth.signInWithPassword({
  email,
  password
 });

 if(error){
  showLoginMsg("Login failed: "+error.message);
  return;
 }

 showLoginMsg("Login successful ✅");

 setTimeout(closeLogin,700);
}


async function signupEmail(){

 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;

 if(!email || !password){
  return showLoginMsg("Email ও Password দিন।");
 }

 if(password.length<6){
  return showLoginMsg("Password কমপক্ষে 6 অক্ষরের হতে হবে।");
 }

 showLoginMsg("Account তৈরি হচ্ছে...");

 const {data,error}=await db.auth.signUp({
  email,
  password
 });

 if(error){
  showLoginMsg("Signup failed: "+error.message);
  return;
 }

 if(!data.session){
  showLoginMsg(
   "Account তৈরি হয়েছে। Email verification করুন।"
  );
 }else{
  showLoginMsg("Account তৈরি হয়েছে ✅");
 }
}


async function resetPassword(){

 const email=document.getElementById("resetEmail").value.trim();

 if(!email){
  return showLoginMsg("Email দিন।");
 }

 const redirectUrl=window.location.origin+
 window.location.pathname;

 const {error}=await db.auth.resetPasswordForEmail(
  email,
  {redirectTo:redirectUrl}
 );

 if(error){
  showLoginMsg("Reset failed: "+error.message);
  return;
 }

 showLoginMsg(
  "Password reset link Email-এ পাঠানো হয়েছে ✅"
 );
}


function fullPhone(){

 let phone=document.getElementById("phone").value.trim();

 phone=phone.replace(/[\s\-()]/g,"");

 if(phone.startsWith("+")) return phone;

 return document.getElementById("countryCode").value+phone;
}


async function sendOTP(){

 const phone=fullPhone();

 if(phone.length<8){
  return showLoginMsg("সঠিক Phone Number দিন।");
 }

 showLoginMsg("OTP পাঠানো হচ্ছে...");

 const {error}=await db.auth.signInWithOtp({
  phone:phone,
  options:{
   shouldCreateUser:true
  }
 });

 if(error){
  showLoginMsg("OTP failed: "+error.message);
  return;
 }

 document.getElementById("otpArea")
 .classList.remove("hidden");

 showLoginMsg("OTP পাঠানো হয়েছে 📱");
}


async function verifyOTP(){

 const phone=fullPhone();

 const token=document.getElementById("otp").value.trim();

 if(!token){
  return showLoginMsg("OTP দিন।");
 }

 showLoginMsg("OTP যাচাই হচ্ছে...");

 const {error}=await db.auth.verifyOtp({
  phone,
  token,
  type:"sms"
 });

 if(error){
  showLoginMsg("OTP failed: "+error.message);
  return;
 }

 showLoginMsg("Phone Login successful ✅");

 setTimeout(closeLogin,700);
}


async function logout(){

 await db.auth.signOut();

 updateUser(null);

 loadFeed();
}


async function getUser(){

 const {
  data:{session}
 }=await db.auth.getSession();

 return session?.user || null;
}


function updateUser(user){

 const area=document.getElementById("accountArea");
 const status=document.getElementById("userStatus");

 if(user){

  const identity=user.email || user.phone || "User";

  area.innerHTML=
  `<button class="logout" onclick="logout()">Logout</button>`;

  status.innerHTML=
  `আপনি Login করেছেন ✅<br><b>${escapeHTML(identity)}</b>`;

 }else{

  area.innerHTML=
  `<button class="login" onclick="openLogin()">Login</button>`;

  status.innerText="আপনি এখনো Login করেননি।";
 }
}


db.auth.onAuthStateChange(
 (_event,session)=>{
  updateUser(session?.user||null);
  loadFeed();
 }
);


/* =====================================
   POST
===================================== */

function openPostBox(type){

 requireLogin(async function(){

  document.getElementById("postModal").style.display="flex";

  const file=document.getElementById("mediaFile");

  if(type==="photo"){
   file.accept="image/*";
  }

  if(type==="video"){
   file.accept="video/*";
  }

 });

}


function closePostBox(){
 document.getElementById("postModal").style.display="none";
}


function showFileName(){

 const file=document.getElementById("mediaFile").files[0];

 document.getElementById("fileName").innerText=
 file ? "Selected: "+file.name : "";

}


async function publishPost(){

 const user=await getUser();

 if(!user){
  closePostBox();
  openLogin();
  return;
 }

 const text=
 document.getElementById("postText").value.trim();

 const file=
 document.getElementById("mediaFile").files[0];

 if(!text && !file){
  document.getElementById("postMsg").innerText=
  "Post বা Photo/Video দিন।";
  return;
 }

 document.getElementById("postMsg").innerText=
 "Publishing...";

 let media_url=null;
 let media_type=null;

 if(file){

  if(file.size>50*1024*1024){
   document.getElementById("postMsg").innerText=
   "File সর্বোচ্চ 50MB হতে পারবে।";
   return;
  }

  media_type=
   file.type.startsWith("video/")
   ? "video"
   : "image";

  const ext=file.name.split(".").pop();

  const path=
   user.id+"/"+Date.now()+"."+ext;

  const {error:uploadError}=
   await db.storage
   .from("complaint-media")
   .upload(path,file,{
    upsert:false
   });

  if(uploadError){

   document.getElementById("postMsg").innerText=
   "Upload failed: "+uploadError.message;

   return;
  }

  const {data:urlData}=
   db.storage
   .from("complaint-media")
   .getPublicUrl(path);

  media_url=urlData.publicUrl;
 }


 const {error}=
 await db.from("posts").insert({

  user_id:user.id,

  content:text,

  media_url:media_url,

  media_type:media_type

 });


 if(error){

  document.getElementById("postMsg").innerText=
  "Post failed: "+error.message;

  return;
 }


 document.getElementById("postMsg").innerText=
 "Published ✅";

 document.getElementById("postText").value="";
 document.getElementById("mediaFile").value="";
 document.getElementById("fileName").innerText="";

 setTimeout(()=>{

  closePostBox();
  loadFeed();

 },700);

}


/* =====================================
   FEED
===================================== */

async function loadFeed(){

 const feed=document.getElementById("feed");

 const {data:posts,error}=
 await db.from("posts")
 .select("*")
 .order("created_at",{ascending:false});


 if(error){

  feed.innerHTML=
  `<div class="card empty">
   Feed load failed.<br>${escapeHTML(error.message)}
  </div>`;

  return;
 }


 if(!posts || posts.length===0){

  feed.innerHTML=
  `<div class="card empty">
   এখনো কোনো Post নেই।
  </div>`;

  return;
 }


 let html="";

 for(const post of posts){

  html+=await renderPost(post);

 }

 feed.innerHTML=html;

}


async function renderPost(post){

 const reactions=
 await getReactionCounts(post.id);

 const comments=
 await getComments(post.id);

 const identity=
 post.user_id
 ? "PASSTIME User"
 : "User";


 let media="";

 if(post.media_url){

  if(post.media_type==="video"){

   media=
   `<video class="post-media"
    controls
    src="${escapeAttr(post.media_url)}">
   </video>`;

  }else{

   media=
   `<img class="post-media"
    src="${escapeAttr(post.media_url)}"
    alt="Post image">`;

  }

 }


 let commentHTML="";

 comments.forEach(c=>{

  commentHTML+=
  `<div class="comment">
   <b>User</b><br>
   ${escapeHTML(c.content)}
  </div>`;

 });


 return `
 <div class="card">

  <div class="post-head">

   <div class="post-user">
    ${identity}
   </div>

   <div class="post-date">
    ${formatDate(post.created_at)}
   </div>
