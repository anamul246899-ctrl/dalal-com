<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ঘুষ সাইট</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:#f0f2f5;
  color:#1c1e21;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0}
.header{
  position:sticky;
  top:0;
  z-index:100;
  background:#1877f2;
  color:white;
  height:58px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 12px;
  box-shadow:0 1px 4px #999;
}
.logo{
  font-size:23px;
  font-weight:bold;
  white-space:nowrap;
}
.searchBox{
  flex:1;
  display:flex;
  max-width:600px;
}
.searchBox input{
  width:100%;
  border:0;
  outline:0;
  border-radius:20px 0 0 20px;
  padding:10px 14px;
  background:#fff;
}
.searchBox button{
  background:#fff;
  color:#1877f2;
  padding:0 15px;
  border-radius:0 20px 20px 0;
}
.container{
  max-width:700px;
  margin:15px auto 80px;
  padding:0 10px;
}
.card{
  background:white;
  border-radius:10px;
  padding:15px;
  margin-bottom:12px;
  box-shadow:0 1px 3px #ddd;
}
.hidden{display:none!important}
.center{text-align:center}
.primary{
  background:#1877f2;
  color:white;
  padding:11px 18px;
  border-radius:7px;
  width:100%;
  margin-top:8px;
}
.secondary{
  background:#e4e6eb;
  color:#111;
  padding:10px 15px;
  border-radius:7px;
}
.danger{
  background:#e41e3f;
  color:white;
  padding:8px 12px;
  border-radius:6px;
}
input,textarea,select{
  width:100%;
  padding:12px;
  margin:6px 0;
  border:1px solid #ccd0d5;
  border-radius:7px;
  outline:none;
}
textarea{
  min-height:100px;
  resize:vertical;
}
.auth{
  max-width:420px;
  margin:45px auto;
  padding:15px;
}
.auth h1{
  color:#1877f2;
  text-align:center;
  font-size:34px;
}
.authBox{
  background:white;
  padding:20px;
  border-radius:10px;
  box-shadow:0 2px 10px #ccc;
}
.link{
  color:#1877f2;
  cursor:pointer;
  text-align:center;
  display:block;
  margin:12px;
}
.avatar{
  width:45px;
  height:45px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd;
}
.postHead{
  display:flex;
  gap:10px;
  align-items:center;
}
.postName{font-weight:bold}
.small{
  color:#65676b;
  font-size:13px;
}
.postText{
  white-space:pre-wrap;
  margin:14px 0;
  line-height:1.5;
}
.mediaGrid{
  display:grid;
  gap:4px;
  margin-top:10px;
}
.mediaGrid.one{grid-template-columns:1fr}
.mediaGrid.two{grid-template-columns:1fr 1fr}
.mediaGrid.three,
.mediaGrid.four{
  grid-template-columns:1fr 1fr;
}
.mediaGrid img,
.mediaGrid video{
  width:100%;
  max-height:500px;
  object-fit:cover;
  border-radius:7px;
  background:#111;
}
.actions{
  display:flex;
  gap:5px;
  border-top:1px solid #ddd;
  border-bottom:1px solid #ddd;
  margin-top:10px;
  padding:5px 0;
}
.actions button{
  flex:1;
  background:white;
  padding:9px 5px;
  border-radius:6px;
}
.actions button:hover{background:#f0f2f5}
.reactionMenu{
  display:flex;
  gap:4px;
  flex-wrap:wrap;
  padding:7px;
  background:#f0f2f5;
  border-radius:8px;
  margin-top:5px;
}
.reactionMenu button{
  background:white;
  padding:7px 9px;
  border-radius:20px;
}
.comment{
  display:flex;
  gap:8px;
  margin-top:9px;
}
.commentBubble{
  background:#f0f2f5;
  border-radius:15px;
  padding:8px 12px;
  flex:1;
}
.commentInput{
  display:flex;
  gap:5px;
  margin-top:10px;
}
.commentInput input{margin:0}
.commentInput button{
  background:#1877f2;
  color:white;
  padding:0 15px;
  border-radius:7px;
}
.bottomNav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  height:60px;
  display:flex;
  justify-content:center;
  box-shadow:0 -2px 8px #ccc;
  z-index:90;
}
.bottomNav button{
  flex:1;
  max-width:140px;
  background:white;
  color:#555;
}
.bottomNav button.active{color:#1877f2}
.preview{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
  margin-top:10px;
}
.previewItem{
  position:relative;
}
.previewItem img,
.previewItem video{
  width:100%;
  height:180px;
  object-fit:cover;
  border-radius:7px;
}
.removePreview{
  position:absolute;
  right:5px;
  top:5px;
  background:#e41e3f;
  color:white;
  border-radius:50%;
  width:28px;
  height:28px;
}
.profileCover{
  background:#1877f2;
  height:130px;
  border-radius:10px 10px 0 0;
}
.profileInfo{
  text-align:center;
  margin-top:-45px;
}
.profileInfo .avatar{
  width:90px;
  height:90px;
  border:4px solid white;
  margin:auto;
}
.userRow{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  border-bottom:1px solid #eee;
  cursor:pointer;
}
.userRow:hover{background:#f0f2f5}
.chatMessages{
  height:400px;
  overflow-y:auto;
  background:#f0f2f5;
  padding:10px;
}
.msg{
  max-width:75%;
  padding:9px 12px;
  margin:5px 0;
  border-radius:15px;
  clear:both;
}
.msg.mine{
  float:right;
  background:#1877f2;
  color:white;
}
.msg.other{
  float:left;
  background:white;
}
.toast{
  position:fixed;
  bottom:75px;
  left:50%;
  transform:translateX(-50%);
  background:#222;
  color:white;
  padding:12px 18px;
  border-radius:8px;
  z-index:999;
}
.status{
  padding:10px;
  background:#fff3cd;
  border-radius:7px;
  margin:8px 0;
}
@media(max-width:600px){
  .header{height:54px}
  .logo{font-size:18px}
  .container{margin-top:10px}
  .card{border-radius:7px}
}
</style>
</head>

<body>

<div id="authPage" class="auth">
  <h1>ঘুষ সাইট</h1>

  <div class="authBox" id="loginBox">
    <h2>Login</h2>

    <input id="loginId"
      placeholder="Phone Number or Gmail / Email"
      autocomplete="username">

    <input id="loginPassword"
      type="password"
      placeholder="Password"
      autocomplete="current-password">

    <button class="primary" onclick="login()">Login</button>

    <span class="link" onclick="showForgot()">Forgot Password?</span>
    <span class="link" onclick="showSignup()">Create New Account</span>

    <div id="loginMsg"></div>
  </div>

  <div class="authBox hidden" id="signupBox">
    <h2>Create Account</h2>

    <input id="signupName" placeholder="Your Name">
    <input id="signupPhone" placeholder="Phone Number">
    <input id="signupEmail" placeholder="Gmail / Email">
    <input id="signupPassword" type="password" placeholder="Password">
    <input id="signupConfirm" type="password" placeholder="Confirm Password">

    <button class="primary" onclick="signup()">Create Account</button>

    <span class="link" onclick="showLogin()">Already have an account? Login</span>

    <div id="signupMsg"></div>
  </div>

  <div class="authBox hidden" id="forgotBox">
    <h2>Forgot Password</h2>

    <p class="small">
      আপনার Email অথবা Phone Number দিন।
    </p>

    <input id="forgotId"
      placeholder="Phone Number or Gmail / Email">

    <button class="primary" onclick="sendReset()">Send Reset</button>

    <div id="forgotMsg"></div>

    <span class="link" onclick="showLogin()">Back to Login</span>
  </div>

  <div class="authBox hidden" id="resetBox">
    <h2>নতুন Password দিন</h2>

    <input id="newPassword" type="password" placeholder="New Password">
    <input id="confirmNewPassword" type="password" placeholder="Confirm New Password">

    <button class="primary" onclick="updatePassword()">Update Password</button>

    <div id="resetMsg"></div>
  </div>
</div>


<div id="app" class="hidden">

  <header class="header">
    <div class="logo">ঘুষ সাইট</div>

    <div class="searchBox">
      <input id="quickSearch"
        placeholder="Search people..."
        onkeydown="if(event.key==='Enter') quickSearchUser()">
      <button onclick="quickSearchUser()">🔍</button>
    </div>
  </header>


  <main class="container">

    <!-- HOME -->
    <section id="homePage">
      <div class="card">
        <div style="display:flex;gap:10px;align-items:center">
          <img id="homeAvatar" class="avatar">
          <button class="secondary"
            style="flex:1;text-align:left"
            onclick="showPage('postPage')">
            What's on your mind?
          </button>
        </div>
      </div>

      <div id="feed">
        <div class="card center">Post loading...</div>
      </div>
    </section>


    <!-- SEARCH -->
    <section id="searchPage" class="hidden">
      <div class="card">
        <h2>🔍 Search</h2>
        <input id="searchInput" placeholder="নাম দিয়ে Search করুন">
        <button class="primary" onclick="searchUsers()">Search</button>
      </div>

      <div id="searchResults"></div>
    </section>


    <!-- POST -->
    <section id="postPage" class="hidden">
      <div class="card">
        <h2>📝 Create Post</h2>

        <textarea id="postContent"
          placeholder="আপনার কথা লিখুন..."></textarea>

        <select id="postCategory">
          <option value="সাধারণ">সাধারণ</option>
          <option value="ঘুষ">ঘুষ</option>
          <option value="দালালি">দালালি</option>
          <option value="প্রতারণা">প্রতারণা</option>
          <option value="অনিয়ম">অনিয়ম</option>
          <option value="দুর্নীতি">দুর্নীতি</option>
          <option value="অভিযোগ">অভিযোগ</option>
          <option value="অন্যান্য">অন্যান্য</option>
        </select>

        <label style="display:block;margin:10px 0">
          <input id="anonymousPost"
            type="checkbox"
            style="width:auto">
          পরিচয় গোপন রাখুন
        </label>

        <input id="mediaFile"
          type="file"
          accept="image/*,video/*"
          multiple
          onchange="previewMedia()">

        <div id="mediaPreview" class="preview"></div>

        <button class="primary" onclick="createPost()">
          Publish
        </button>
      </div>
    </section>


    <!-- PROFILE -->
    <section id="profilePage" class="hidden">
      <div id="profileContent"></div>
    </section>


    <!-- EDIT PROFILE -->
    <section id="editPage" class="hidden">
      <div class="card">
        <h2>✏️ Edit Profile</h2>

        <input id="editName" placeholder="Name">
        <textarea id="editBio" placeholder="Bio"></textarea>
        <input id="editAvatar" placeholder="Avatar Image URL">

        <button class="primary" onclick="saveProfile()">
          Save
        </button>
      </div>
    </section>


    <!-- CHAT -->
    <section id="chatPage" class="hidden">
      <div class="card">
        <h2>💬 Chat</h2>

        <div id="chatUsers"></div>
      </div>

      <div id="chatBox" class="card hidden">
        <h3 id="chatTitle"></h3>

        <div id="chatMessages" class="chatMessages"></div>

        <div style="display:flex;gap:5px;margin-top:8px">
          <input id="messageInput"
            placeholder="Message..."
            style="margin:0"
            onkeydown="if(event.key==='Enter') sendMessage()">

          <button
            onclick="sendMessage()"
            style="background:#1877f2;color:white;padding:0 15px;border-radius:7px">
            Send
          </button>
        </div>
      </div>
    </section>

  </main>


  <nav class="bottomNav">
    <button onclick="showPage('homePage')">🏠<br>Home</button>
    <button onclick="showPage('searchPage')">🔍<br>Search</button>
    <button onclick="showPage('postPage')">➕<br>Post</button>
    <button onclick="showPage('chatPage');loadChatUsers()">💬<br>Chat</button>
    <button onclick="showPage('profilePage');loadProfilePage()">👤<br>Profile</button>
  </nav>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://klreqkbqyyiwmohlmgkh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_xlqcHTsDaMpBq4n54iMs4A_S7gKpiZc";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


let currentUser = null;
let currentProfile = null;
let selectedChatUser = null;
let messageChannel = null;


/* =========================
   HELPERS
========================= */

function $(id){
  return document.getElementById(id);
}

function toast(message){
  const old = document.querySelector(".toast");
  if(old) old.remove();

  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = message;
  document.body.appendChild(t);

  setTimeout(()=>t.remove(),3000);
}

function escapeHTML(text){
  if(text === null || text === undefined) return "";

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function avatarURL(profile){
  if(profile && profile.avatar_url)
    return profile.avatar_url;

  const name =
    profile && profile.display_name
    ? profile.display_name
    : "User";

  return "https://ui-avatars.com/api/?name="
    + encodeURIComponent(name)
    + "&background=1877f2&color=fff";
}


/* =========================
   AUTH UI
========================= */

function hideAuthBoxes(){
  $("loginBox").classList.add("hidden");
  $("signupBox").classList.add("hidden");
  $("forgotBox").classList.add("hidden");
  $("resetBox").classList.add("hidden");
}

function showLogin(){
  hideAuthBoxes();
  $("loginBox").classList.remove("hidden");
}

function showSignup(){
  hideAuthBoxes();
  $("signupBox").classList.remove("hidden");
}

function showForgot(){
  hideAuthBoxes();
  $("forgotBox").classList.remove("hidden");
}

function showReset(){
  hideAuthBoxes();
  $("resetBox").classList.remove("hidden");
}


/* =========================
   LOGIN
========================= */

async function login(){

  const id = $("loginId").value.trim();
  const password = $("loginPassword").value;

  if(!id || !password){
    $("loginMsg").innerHTML =
      '<div class="status">সব তথ্য পূরণ করুন।</div>';
    return;
  }

  $("loginMsg").innerHTML =
    '<div class="status">Login হচ্ছে...</div>';

  try{

    let email = id;

    /*
      Email না হলে Phone থেকে
      account email বের করার চেষ্টা।
    */

    if(!id.includes("@")){

      const {data,error} =
        await db.rpc("get_login_email",{
          p_phone:id
        });

      if(error){
        $("loginMsg").innerHTML =
          '<div class="status">Phone login setup পাওয়া যায়নি। Email দিয়ে চেষ্টা করুন।</div>';
        return;
      }

      email = data;

      if(!email){
        $("loginMsg").innerHTML =
          '<div class="status">Account পাওয়া যায়নি।</div>';
        return;
      }
    }

    const {error} =
      await db.auth.signInWithPassword({
        email:email,
        password:password
      });

    if(error){
      $("loginMsg").innerHTML =
        '<div class="status">'
        + escapeHTML(error.message)
        + '</div>';
      return;
    }

    toast("Login successful");

  }catch(err){

    $("loginMsg").innerHTML =
      '<div class="status">'
      + escapeHTML(err.message)
      + '</div>';
  }
}


/* =========================
   SIGNUP
========================= */

async function signup(){

  const name =
    $("signupName").value.trim();

  const phone =
    $("signupPhone").value.trim();

  const email =
    $("signupEmail").value.trim();

  const password =
    $("signupPassword").value;

  const confirm =
    $("signupConfirm").value;

  if(!name || !phone || !email || !password){
    $("signupMsg").innerHTML =
      '<div class="status">সব তথ্য পূরণ করুন।</div>';
    return;
  }

  if(password !== confirm){
    $("signupMsg").innerHTML =
      '<div class="status">Password মিলছে না।</div>';
    return;
  }

  if(password.length < 6){
    $("signupMsg").innerHTML =
      '<div class="status">Password কমপক্ষে ৬ অক্ষরের দিন।</div>';
    return;
  }

  $("signupMsg").innerHTML =
    '<div class="status">Account তৈরি হচ্ছে...</div>';

  try{

    const check =
      await db
      .from("profiles")
      .select("id")
      .eq("phone",phone)
      .maybeSingle();

    if(check.data){
      $("signupMsg").innerHTML =
        '<div class="status">এই Phone Number দিয়ে Account আছে।</div>';
      return;
    }

    const {data,error} =
      await db.auth.signUp({
        email:email,
        password:password
      });

    if(error){
      $("signupMsg").innerHTML =
        '<div class="status">'
        + escapeHTML(error.message)
        + '</div>';
      return;
    }

    if(!data.user){
      $("signupMsg").innerHTML =
        '<div class="status">Account তৈরি হয়েছে। Email verification প্রয়োজন হতে পারে।</div>';
      return;
    }

    const profileData = {
      id:data.user.id,
      display_name:name,
      phone:phone,
      bio:"",
      avatar_url:"",
      role:"user"
    };

    const profile =
      await db
      .from("profiles")
      .upsert(profileData);

    if(profile.error){
      $("signupMsg").innerHTML =
        '<div class="status">Account হয়েছে, কিন্তু Profile save হয়নি: '
        + escapeHTML(profile.error.message)
        + '</div>';
      return;
    }

    toast("Account created");

    $("signupMsg").innerHTML =
      '<div class="status">Account সফলভাবে তৈরি হয়েছে। Login করুন।</div>';

    setTimeout(showLogin,1200);

  }catch(err){

    $("signupMsg").innerHTML =
      '<div class="status">'
      + escapeHTML(err.message)
      + '</div>';
  }
}


/* =========================
   FORGOT PASSWORD
========================= */

async function sendReset(){

  const id =
    $("forgotId").value.trim();

  if(!id){
    $("forgotMsg").innerHTML =
      '<div class="status">Phone অথবা Email দিন।</div>';
    return;
  }

  $("forgotMsg").innerHTML =
    '<div class="status">Checking...</div>';

  try{

    let email = id;

    /*
      Email হলে সরাসরি।
      Phone হলে get_login_email RPC দিয়ে
      account email বের করা হবে।
    */

    if(!id.includes("@")){

      const {data,error} =
        await db.rpc("get_login_email",{
          p_phone:id
        });

      if(error || !data){

        $("forgotMsg").innerHTML =
          '<div class="status">'
          + "এই Phone Number-এর Account পাওয়া যায়নি।"
          + '</div>';

        return;
      }

      email = data;
    }

    const {error} =
      await db.auth.resetPasswordForEmail(
        email,
        {
          redirectTo:
            window.location.href
        }
      );

    if(error){

      $("forgotMsg").innerHTML =
        '<div class="status">'
        + escapeHTML(error.message)
        + '</div>';

      return;
    }

    $("forgotMsg").innerHTML =
      '<div class="status">'
      + "Password reset link আপনার Email-এ পাঠানো হয়েছে।"
      + '</div>';

  }catch(err){

    $("forgotMsg").innerHTML =
      '<div class="status">'
      + escapeHTML(err.message)
      + '</div>';
  }
}


/* =========================
   PASSWORD UPDATE
========================= */

async function updatePassword(){

  const password =
    $("newPassword").value;

  const confirm =
    $("confirmNewPassword").value;

  if(!password || !confirm){
    $("resetMsg").innerHTML =
      '<div class="status">দুই জায়গায় Password দিন।</div>';
    return;
  }

  if(password !== confirm){
    $("resetMsg").innerHTML =
      '<div class="status">Password মিলছে না।</div>';
    return;
  }

  if(password.length < 6){
    $("resetMsg").innerHTML =
      '<div class="status">Password কমপক্ষে ৬ অক্ষরের দিন।</div>';
    return;
  }

  const {error} =
    await db.auth.updateUser({
      password:password
    });

  if(error){

    $("resetMsg").innerHTML =
      '<div class="status">'
      + escapeHTML(error.message)
      + '</div>';

    return;
  }

  toast("Password updated");

  $("resetMsg").innerHTML =
    '<div class="status">Password সফলভাবে পরিবর্তন হয়েছে।</div>';

  setTimeout(showLogin,1200);
}


/* =========================
   SESSION
========================= */

async function loadUser(){

  const {data} =
    await db.auth.getSession();

  if(data.session){

    currentUser =
      data.session.user;

    await loadProfile();

    openApp();

  }else{

    openAuth();
  }
}

async function loadProfile(){

  if(!currentUser) return;

  const {data,error} =
    await db
    .from("profiles")
    .select("*")
    .eq("id",currentUser.id)
    .maybeSingle();

  if(data){

    currentProfile = data;

  }else{

    const newProfile = {
      id:currentUser.id,
      display_name:
        currentUser.email
        ? currentUser.email.split("@")[0]
        : "User",
      phone:"",
      bio:"",
      avatar_url:"",
      role:"user"
    };

    const result =
      await db
      .from("profiles")
      .upsert(newProfile)
      .select()
      .single();

    if(result.data)
      currentProfile = result.data;
  }
}

/* =========================
   MEDIA PREVIEW
========================= */

function previewMedia(){

  const input =
    $("mediaFile");

  const preview =
    $("mediaPreview");

  preview.innerHTML = "";

  if(!input.files || !input.files.length)
    return;

  Array.from(input.files).forEach(
    (file,index)=>{

      const item =
        document.createElement("div");

      item.className =
        "previewItem";

      const remove =
        document.createElement("button");

      remove.className =
        "removePreview";

      remove.textContent = "×";

      remove.onclick = ()=>{
        removeSelectedFile(index);
      };

      if(file.type.startsWith("image/")){

        const img =
          document.createElement("img");

        img.src =
          URL.createObjectURL(file);

        item.appendChild(img);

      }else if(file.type.startsWith("video/")){

        const video =
          document.createElement("video");

        video.src =
          URL.createObjectURL(file);

        video.controls = true;

        item.appendChild(video);
      }

      item.appendChild(remove);

      preview.appendChild(item);
    }
  );
}


/*
  FileList সরাসরি edit করা যায় না।
  তাই preview remove-এর জন্য DataTransfer ব্যবহার।
*/

function removeSelectedFile(index){

  const input =
    $("mediaFile");

  const dt =
    new DataTransfer();

  Array.from(input.files).forEach(
    (file,i)=>{
      if(i !== index)
        dt.items.add(file);
    }
  );

  input.files = dt.files;

  previewMedia();
}


/* =========================
   CREATE POST
========================= */

async function createPost(){

  if(!currentUser){
    toast("আগে Login করুন");
    return;
  }

  const content =
    $("postContent").value.trim();

  const category =
    $("postCategory").value;

  const anonymous =
    $("anonymousPost").checked;

  const files =
    Array.from($("mediaFile").files || []);

  if(!content && files.length === 0){

    toast("কিছু লিখুন অথবা ছবি/ভিডিও দিন");

    return;
  }

  try{

    toast("Post তৈরি হচ্ছে...");

    /*
      প্রথমে Post তৈরি।
    */

    const {data:post,error:postError} =
      await db
      .from("posts")
      .insert({
        user_id:currentUser.id,
        content:content,
        media_url:null,
        media_type:null,
        status:"published",
        is_anonymous:anonymous,
        category:category
      })
      .select()
      .single();

    if(postError){

      toast(postError.message);

      return;
    }


    /*
      সব Media Upload
    */

    let firstMediaURL = null;
    let firstMediaType = null;

    for(let i=0;i<files.length;i++){

      const file = files[i];

      const ext =
        file.name.split(".").pop();

      const path =
        "posts/"
        + currentUser.id
        + "/"
        + Date.now()
        + "_"
        + i
        + "."
        + ext;

      const upload =
        await db.storage
        .from("media")
        .upload(path,file,{
          upsert:false
        });

      if(upload.error){

        console.log(upload.error);

        continue;
      }

      const publicURL =
        db.storage
        .from("media")
        .getPublicUrl(path)
        .data.publicUrl;

      const mediaType =
        file.type.startsWith("video/")
        ? "video"
        : "image";

      if(i === 0){

        firstMediaURL =
          publicURL;

        firstMediaType =
          mediaType;
      }

      /*
        Multiple media table
      */

      const mediaInsert =
        await db
        .from("post_media")
        .insert({
          post_id:post.id,
          media_url:publicURL,
          media_type:mediaType
        });

      if(mediaInsert.error)
        console.log(
          "post_media error:",
          mediaInsert.error
        );
    }


    /*
      Existing posts table-এর
      প্রথম media-ও save করছি।
    */

    if(firstMediaURL){

      await db
      .from("posts")
      .update({
        media_url:firstMediaURL,
        media_type:firstMediaType
      })
      .eq("id",post.id);
    }


    $("postContent").value = "";
    $("mediaFile").value = "";
    $("mediaPreview").innerHTML = "";
    $("anonymousPost").checked = false;

    toast("Post Published");

    showPage("homePage");

  }catch(err){

    toast(err.message);
  }
}


/* =========================
   GET POST MEDIA
========================= */

async function getMedia(post){

  let media = [];

  try{

    const {data,error} =
      await db
      .from("post_media")
      .select("*")
      .eq("post_id",post.id)
      .order("created_at",{ascending:true});

    if(!error && data)
      media = data;

  }catch(e){
    console.log(e);
  }


  /*
    পুরোনো post হলে posts.media_url
    থেকেও দেখাবে।
  */

  if(media.length === 0 && post.media_url){

    media.push({
      media_url:post.media_url,
      media_type:post.media_type || "image"
    });
  }

  return media;
}

/* =========================
   POST HTML
========================= */

async function postHTML(post){

  const profile =
    post.profiles || {};

  const media =
    await getMedia(post);

  const anonymous =
    post.is_anonymous === true;

  const name =
    anonymous
    ? "Anonymous"
    : (profile.display_name || "User");

  const avatar =
    anonymous
    ? "https://ui-avatars.com/api/?name=A&background=777&color=fff"
    : avatarURL(profile);


  /*
    Reactions
  */

  let reactionCount = 0;

  const reactions =
    await db
    .from("reactions")
    .select("*",{
      count:"exact",
      head:true
    })
    .eq("post_id",post.id);

  if(reactions.count)
    reactionCount = reactions.count;


  /*
    Comments
  */

  const comments =
    await db
    .from("comments")
    .select(`
      id,
      content,
      created_at,
      user_id,
      profiles:user_id(
        display_name,
        avatar_url
      )
    `)
    .eq("post_id",post.id)
    .order("created_at",{ascending:true})
    .limit(20);


  let mediaHTML = "";

  if(media.length){

    const cls =
      media.length === 1
      ? "one"
      : media.length === 2
      ? "two"
      : media.length === 3
      ? "three"
      : "four";

    mediaHTML =
      `<div class="mediaGrid ${cls}">`;

    media.forEach(m=>{

      if(m.media_type === "video"){

        mediaHTML +=
          `<video controls preload="metadata">
             <source src="${escapeHTML(m.media_url)}">
           </video>`;

      }else{

        mediaHTML +=
          `<img src="${escapeHTML(m.media_url)}"
                loading="lazy"
                onclick="window.open('${escapeHTML(m.media_url)}','_blank')">`;
      }

    });

    mediaHTML += "</div>";
  }


  let commentsHTML = "";

  if(comments.data){

    comments.data.forEach(c=>{

      const cp =
        c.profiles || {};

      commentsHTML +=
        `<div class="comment">
          <img class="avatar"
               style="width:32px;height:32px"
               src="${escapeHTML(avatarURL(cp))}">
          <div class="commentBubble">
            <b>${escapeHTML(cp.display_name || "User")}</b><br>
            ${escapeHTML(c.content)}
          </div>
        </div>`;
    });
  }


  const own =
    currentUser &&
    post.user_id === currentUser.id;

  const admin =
    currentProfile &&
    currentProfile.role === "admin";


  return `
  <article class="card" id="post-${escapeHTML(post.id)}">

    <div class="postHead">

      <img class="avatar"
           src="${escapeHTML(avatar)}">

      <div style="flex:1">
        <div class="postName">
          ${escapeHTML(name)}
        </div>

        <div class="small">
          ${escapeHTML(post.category || "সাধারণ")}
          · ${formatDate(post.created_at)}
        </div>
      </div>

      ${
        own || admin
        ? `<button
             class="danger"
             onclick="deletePost('${escapeHTML(post.id)}')">
             Delete
           </button>`
        : ""
      }

    </div>


    ${
      post.content
      ? `<div class="postText">
           ${escapeHTML(post.content)}
         </div>`
      : ""
    }

    ${mediaHTML}


    <div class="actions">

      <button onclick="toggleReaction('${escapeHTML(post.id)}')">
        👍 Like
      </button>

      <button onclick="toggleReactionMenu('${escapeHTML(post.id)}')">
        ❤️ React
      </button>

      <button onclick="focusComment('${escapeHTML(post.id)}')">
        💬 Comment
      </button>

      <button onclick="sharePost('${escapeHTML(post.id)}')">
        ↗️ Share
      </button>

    </div>


    <div id="reaction-${escapeHTML(post.id)}"
         class="reactionMenu hidden">

      <button onclick="react('${escapeHTML(post.id)}','like')">
        👍 Like
      </button>

      <button onclick="react('${escapeHTML(post.id)}','love')">
        ❤️ Love
      </button>

      <button onclick="react('${escapeHTML(post.id)}','haha')">
        😂 Haha
      </button>

      <button onclick="react('${escapeHTML(post.id)}','wow')">
        😮 Wow
      </button>

      <button onclick="react('${escapeHTML(post.id)}','sad')">
        😢 Sad
      </button>

      <button onclick="react('${escapeHTML(post.id)}','angry')">
        😡 Angry
      </button>

    </div>


    <div class="small" style="margin-top:8px">
      👍 ${reactionCount} reactions
    </div>


    <div id="comments-${escapeHTML(post.id)}">
      ${commentsHTML}
    </div>


    <div class="commentInput">

      <input
        id="comment-${escapeHTML(post.id)}"
        placeholder="Write a comment...">

      <button
        onclick="addComment('${escapeHTML(post.id)}')">
        Send
      </button>

    </div>

  </article>`;
}


function formatDate(date){

  if(!date) return "";

  try{

    return new Date(date)
      .toLocaleString("bn-BD",{
        dateStyle:"medium",
        timeStyle:"short"
      });

  }catch(e){

    return "";
  }
}

   REACTION
========================= */

function toggleReactionMenu(postId){

  const el =
    $("reaction-"+postId);

  if(el)
    el.classList.toggle("hidden");
}


async function toggleReaction(postId){

  await react(postId,"like");
}


async function react(postId,type){

  if(!currentUser){
    toast("Login করুন");
    return;
  }

  try{

    const existing =
      await db
      .from("reactions")
      .select("id,reaction_type")
      .eq("post_id",postId)
      .eq("user_id",currentUser.id)
      .maybeSingle();

    if(existing.data){

      if(existing.data.reaction_type === type){

        await db
        .from("reactions")
        .delete()
        .eq("id",existing.data.id);

      }else{

        await db
        .from("reactions")
        .update({
          reaction_type:type
        })
        .eq("id",existing.data.id);
      }

    }else{

      await db
      .from("reactions")
      .insert({
        post_id:postId,
        user_id:currentUser.id,
        reaction_type:type
      });
    }

    loadFeed();

  }catch(err){

    toast(err.message);
  }
}

  const input =

  const content =

      post_id:postId,

      content:content

  input.value = "";

/* =========================
   DELETE POST
========================= */

async function deletePost(postId){

  if(!currentUser)
    return;

  if(!confirm("এই Post Delete করবেন?"))
    return;

  try{

    let query =
      db
      .from("posts")
      .delete()
      .eq("id",postId);

    /*
      UI থেকে owner/admin উভয়কে
      allow করা হচ্ছে।
      Database RLS-এ admin policy থাকাও
      প্রয়োজন।
    */

    if(
      !currentProfile ||
      currentProfile.role !== "admin"
    ){
      query =
        query.eq("user_id",currentUser.id);
    }

    const {error} =
      await query;

    if(error){

      toast(error.message);

      return;
    }

    toast("Post deleted");

    loadFeed();

  }catch(err){

    toast(err.message);
  }
}

async function sharePost(postId){

  const url =
    window.location.origin +
    window.location.pathname +
    "#post-" +
    postId;

  try{

    if(navigator.share){

      await navigator.share({
        title:"ঘুষ সাইট",
        text:"এই Post টি দেখুন",
        url:url
      });

    }else{

      await navigator.clipboard.writeText(url);

      toast("Post link copied");
    }

  }catch(e){
    console.log(e);
  }
}

   START CHAT
========================= */

async function startChat(userId){

  const {data:user} =
    await db
    .from("profiles")
    .select("*")
    .eq("id",userId)
    .maybeSingle();

  if(!user)
    return;

  selectedChatUser = user;

  $("chatTitle").textContent =
    "💬 " + user.display_name;

  $("chatBox").classList.remove("hidden");

  await loadMessages();

  subscribeMessages();
}


/* =========================
   LOAD MESSAGES
========================= */

async function loadMessages(){

  if(!selectedChatUser)
    return;

  const box =
    $("chatMessages");

  const {data,error} =
    await db
    .from("messages")
    .select("*")
    .or(
      "and(sender_id.eq."+currentUser.id+
      ",receiver_id.eq."+selectedChatUser.id+"),"+
      "and(sender_id.eq."+selectedChatUser.id+
      ",receiver_id.eq."+currentUser.id+")"
    )
    .order("created_at",{ascending:true});

  if(error){

    box.innerHTML =
      '<div class="status">'
      + escapeHTML(error.message)
      + '</div>';

    return;
  }

  box.innerHTML = "";

  data.forEach(msg=>{

    const mine =
      msg.sender_id === currentUser.id;

    const div =
      document.createElement("div");

    div.className =
      "msg " + (mine ? "mine" : "other");

    div.textContent =
      msg.content;

    box.appendChild(div);
  });

  box.scrollTop =
    box.scrollHeight;
}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage(){

  if(!selectedChatUser)
    return;

  const input =
    $("messageInput");

  const content =
    input.value.trim();

  if(!content)
    return;

  const {error} =
    await db
    .from("messages")
    .insert({
      sender_id:currentUser.id,
      receiver_id:selectedChatUser.id,
      content:content
    });

  if(error){

    toast(error.message);

    return;
  }

  input.value = "";

  await loadMessages();
}


/* =========================
   REALTIME CHAT
========================= */

function subscribeMessages(){

  if(messageChannel){

    db.removeChannel(
      messageChannel
    );
  }

  messageChannel =
    db
    .channel("messages-"+currentUser.id)
    .on(
      "postgres_changes",
      {
        event:"INSERT",
        schema:"public",
        table:"messages"
      },
      payload=>{

        const msg =
          payload.new;

        if(
          msg.sender_id === currentUser.id ||
          msg.receiver_id === currentUser.id
        ){

          loadMessages();
        }
      }
    )
    .subscribe();
}


/* =========================
   LOGOUT
========================= */

async function logout(){

  await db.auth.signOut();

  currentUser = null;
  currentProfile = null;

  openAuth();

  showLogin();

  toast("Logged out");
}


/* =========================
   INITIAL
========================= */

loadUser();

</script>
