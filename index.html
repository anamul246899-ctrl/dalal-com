// =====================================================
// HELPERS
// =====================================================

function normalizePhone(phone){

 return String(phone || "")
  .trim()
  .replace(/[\s\-()]/g,"");
}


function escapeHtml(str){

 return String(str || "")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}


function showMessage(msg){

 const el =
  document.getElementById("message");

 el.innerText = msg;
 el.style.display = "block";

 setTimeout(()=>{
  el.style.display = "none";
 },3000);
}

async function signup(){

 const name =
  document.getElementById("signupName")
  .value.trim();

 const phone =
  normalizePhone(
   document.getElementById("signupPhone").value
  );

 const email =
  document.getElementById("signupEmail")
  .value.trim()
  .toLowerCase();

 const password =
  document.getElementById("signupPassword")
  .value;

 const confirm =
  document.getElementById("signupConfirm")
  .value;

 if(!name){
  showMessage(T[language].enterName);
  return;
 }

 if(!phone || !email || !password){
  showMessage("Please fill all required fields.");
  return;
 }

 if(password !== confirm){
  showMessage(T[language].passwordMismatch);
  return;
 }

 try{

  const {data:existing,error:checkError} =
   await db
    .from("profiles")
    .select("id")
    .eq("phone",phone)
    .maybeSingle();

  if(checkError) throw checkError;

  if(existing){
   showMessage(
    "This Phone Number is already registered."
   );
   return;
  }

  const {data,error} =
   await db.auth.signUp({
    email:email,
    password:password
   });

  if(error) throw error;

  if(data.user){

   if(data.session){

    const {error:pError} =
     await db
      .from("profiles")
      .upsert({
       id:data.user.id,
       display_name:name,
       phone:phone,
       recovery_email:email,
       role:"user"
      });

    if(pError) throw pError;

    showMessage(
     T[language].accountCreated
    );

    await loadUser();

   }else{

    showMessage(
     "Account created. Please confirm your email, then login."
    );
   }
  }

 }catch(err){

  console.error(err);

  showMessage(
   err.message || "Signup failed."
  );
 }
}


// =====================================================
// LOGIN
// PHONE OR EMAIL
// =====================================================

async function login(){

 const input =
  document.getElementById("loginPhone")
  .value.trim();

 const password =
  document.getElementById("loginPassword")
  .value;

 if(!input || !password){

  showMessage(
   "Please enter Phone Number or Gmail and Password."
  );

  return;
 }

 try{

  let email = "";

  // =========================
  // EMAIL / GMAIL
  // =========================

  if(input.includes("@")){

   email =
    input
     .trim()
     .toLowerCase();

  }

  // =========================
  // PHONE
  // =========================

  else{

   const phone =
    normalizePhone(input);

   const {data:profile,error:pError} =
    await db
     .from("profiles")
     .select("recovery_email")
     .eq("phone",phone)
     .maybeSingle();

   if(pError){

    console.error(pError);

    showMessage(
     "Login error. Please try again."
    );

    return;
   }

   if(!profile || !profile.recovery_email){

    showMessage(
     "No account found with this Phone Number."
    );

    return;
   }

   email =
    profile.recovery_email
     .trim()
     .toLowerCase();
  }


  // =========================
  // SUPABASE AUTH
  // =========================

  const {data,error} =
   await db.auth.signInWithPassword({
    email:email,
    password:password
   });

  if(error){

   console.error(error);

   showMessage(
    T[language].loginError
   );

   return;
  }

  if(data.user){

   showMessage(
    T[language].loggedIn
   );

   await loadUser();
  }

 }catch(err){

  console.error(err);

  showMessage(
   T[language].loginError
  );
 }
}

// LOGOUT
// =====================================================

async function logout(){

 await db.auth.signOut();

 currentUser=null;
 currentProfile=null;

 showMessage(
  T[language].loggedOut
 );

 showAuth();
}


// =====================================================
// LOAD USER
// =====================================================

async function loadUser(){

 const {data:{user}} =
  await db.auth.getUser();

 if(!user){

  showAuth();
  return;
 }

 currentUser=user;

 let {data:profile,error} =
  await db
   .from("profiles")
   .select("*")
   .eq("id",user.id)
   .maybeSingle();

 if(error){
  console.error(error);
 }

 if(!profile){

  const {data:newProfile,error:newError} =
   await db
    .from("profiles")
    .insert({
     id:user.id,
     display_name:"PASSTIME User",
     recovery_email:user.email || "",
     role:"user"
    })
    .select()
    .single();

  if(newError){

   console.error(newError);

  }else{

   profile=newProfile;
  }
 }

 currentProfile=profile;

 showApp();

 updateMyProfile();

 await loadFeed();
}

async function saveProfile(){

 if(!currentUser) return;

 const name =
  document.getElementById("editName")
  .value.trim();

 const bio =
  document.getElementById("editBio")
  .value.trim();

 const file =
  document.getElementById("profilePhoto")
  .files[0];

 if(!name){

  showMessage(
   T[language].enterName
  );

  return;
 }

 let avatar_url =
  currentProfile?.avatar_url || null;

 try{

  if(file){

   const ext =
    file.name.split(".").pop();

   const filePath =
    currentUser.id+
    "/avatar_"+Date.now()+
    "."+ext;

   const {error:uploadError} =
    await db.storage
     .from("profile-media")
     .upload(
      filePath,
      file,
      {
       upsert:true,
       contentType:file.type
      }
     );

   if(uploadError)
    throw uploadError;

   const {data:urlData} =
    db.storage
     .from("profile-media")
     .getPublicUrl(filePath);

   avatar_url =
    urlData.publicUrl;
  }


  const {data,error} =
   await db
    .from("profiles")
    .update({
     display_name:name,
     bio:bio,
     avatar_url:avatar_url
    })
    .eq("id",currentUser.id)
    .select()
    .single();

  if(error) throw error;

  currentProfile=data;

  updateMyProfile();

  closeEditProfile();

  showMessage(
   T[language].profileSaved
  );

  await loadFeed();

 }catch(err){

  console.error(err);

  showMessage(
   err.message ||
   "Profile update failed."
  );
 }
}

// =====================================================
// FILE PREVIEW
// =====================================================

function previewFile(){

 const file =
  document.getElementById("mediaFile")
  .files[0];

 const preview =
  document.getElementById("preview");

 preview.innerHTML="";

 if(!file) return;

 const url =
  URL.createObjectURL(file);

 if(file.type.startsWith("image/")){

  preview.innerHTML =
   `<img class="media" src="${url}">`;

 }else if(file.type.startsWith("video/")){

  preview.innerHTML =
   `<video class="media"
           src="${url}"
           controls></video>`;
 }
}


// =====================================================
// CREATE POST
// =====================================================

async function createPost(){

 if(!currentUser){

  showAuth();
  return;
 }

 const text =
  document.getElementById("postText")
  .value.trim();

 const file =
  document.getElementById("mediaFile")
  .files[0];

 if(!text && !file){

  showMessage(
   "Write something or select a photo/video."
  );

  return;
 }

 try{

  let media_url=null;
  let media_type=null;

  if(file){

   const ext =
    file.name.split(".").pop();

   const path =
    "posts/"+
    currentUser.id+
    "_"+
    Date.now()+
    "."+
    ext;

   const {error:uploadError} =
    await db.storage
     .from("complaint-media")
     .upload(
      path,
      file,
      {
       upsert:false,
       contentType:file.type
      }
     );

   if(uploadError)
    throw uploadError;

   const {data:urlData} =
    db.storage
     .from("complaint-media")
     .getPublicUrl(path);

   media_url =
    urlData.publicUrl;

   media_type =
    file.type.startsWith("video/")
    ? "video"
    : "image";
  }


  const {error} =
   await db
    .from("posts")
    .insert({
     user_id:currentUser.id,
     content:text,
     media_url:media_url,
     media_type:media_type
    });

  if(error) throw error;

  document.getElementById("postText")
   .value="";

  document.getElementById("mediaFile")
   .value="";

  document.getElementById("preview")
   .innerHTML="";

  await loadFeed();

 }catch(err){

  console.error(err);

  showMessage(
   err.message ||
   "Post failed."
  );
 }
}


// =====================================================
// PROFILES MAP

   .from("profiles")
   .select(

// =====================================================
// LOAD FEED
// =====================================================

async function loadFeed(){

 const feed =
  document.getElementById("feed");

 feed.innerHTML =
  T[language].loading;

 const {data:posts,error} =
  await db
   .from("posts")
   .select("*")
   .order(
    "created_at",
    {ascending:false}
   );

 if(error){

  feed.innerHTML =
   escapeHtml(error.message);

  return;
 }

 if(!posts || posts.length===0){

  feed.innerHTML =
   `<div class="center">
     ${T[language].noPosts}
    </div>`;

  return;
 }

 const profiles =
  await getProfiles();

 feed.innerHTML="";

 for(const post of posts){

  await renderPost(
   post,
   profiles,
   feed
  );
 }
}


// =====================================================
// RENDER POST
// =====================================================

async function renderPost(
 post,
 profiles,
 container
){

 const profile =
  profiles[post.user_id] ||
  {
   display_name:"PASSTIME User",
   avatar_url:null
  };

 let avatar =
  profile.avatar_url;

 if(!avatar){

  avatar =
   "https://ui-avatars.com/api/?name="+
   encodeURIComponent(
    profile.display_name
   )+
   "&background=1877f2&color=fff";
 }

 const card =
  document.createElement("div");

 card.className="card";

 let media="";

 if(post.media_url){

  if(post.media_type==="video"){

   media =
    `<video class="media"
            src="${escapeHtml(post.media_url)}"
            controls></video>`;

  }else{

   media =
    `<img class="media"
          src="${escapeHtml(post.media_url)}">`;
  }
 }

 const own =
  post.user_id ===
  currentUser?.id;


 card.innerHTML = `

  <div class="post-user"
       onclick="openUserProfile('${post.user_id}')">

   <img
    class="avatar small"
    src="${escapeHtml(avatar)}">

   <div class="post-user-info">

    <b>
     ${escapeHtml(
      profile.display_name
     )}
    </b>

    <small>
     ${new Date(
      post.created_at
     ).toLocaleString()}
    </small>

   </div>

  </div>

  <div>
   ${escapeHtml(post.content || "")}
  </div>

  ${media}

  <div
   class="reaction-count"
   id="reaction-count-${post.id}">
  </div>

  <div class="actions">

   <button onclick="reactPost(${post.id},'Like')">
    👍 Like
   </button>

   <button onclick="reactPost(${post.id},'Love')">
    ❤️ Love
   </button>

   <button onclick="reactPost(${post.id},'Haha')">
    😂 Haha
   </button>

   <button onclick="reactPost(${post.id},'Wow')">
    😮 Wow
   </button>

   <button onclick="reactPost(${post.id},'Sad')">
    😢 Sad
   </button>

   <button onclick="reactPost(${post.id},'Angry')">
    😡 Angry
   </button>

  </div>

  <div id="comments-${post.id}">
  </div>

  <div
   style="display:flex;gap:5px;margin-top:8px">

   <input
    id="comment-input-${post.id}"
    placeholder="${T[language].commentPlaceholder}"
    style="margin:0">

   <button
    class="blue"
    onclick="addComment(${post.id})">

    ${T[language].comment}

   </button>

  </div>

  ${
   own
   ?
   `<button
     class="red"
     style="margin-top:10px;width:100%"
     onclick="deletePost(${post.id})">

     🗑️ ${T[language].delete}

    </button>`
   :""
  }

 `;

 container.appendChild(card);

 await loadReactions(post.id);

 await loadComments(post.id);
}


// =====================================================
// REACTIONS
// =====================================================

async function loadReactions(postId){

 const {data,error} =
  await db
   .from("reactions")
   .select(
    "reaction_type,user_id"
   )
   .eq("post_id",postId);

 if(error) return;

 const counts={};

 (data || []).forEach(r=>{

  counts[r.reaction_type] =
   (counts[r.reaction_type] || 0)+1;
 });

 let html="";

 Object.keys(counts).forEach(k=>{

  html +=
   `${reactionEmoji(k)} ${k}: ${counts[k]} &nbsp;`;
 });

 const el =
  document.getElementById(
   "reaction-count-"+postId
  );

 if(el)
  el.innerHTML=html;
}


function reactionEmoji(type){

 const e={
  Like:"👍",
  Love:"❤️",
  Haha:"😂",
  Wow:"😮",
  Sad:"😢",
  Angry:"😡"
 };

 return e[type] || "";
}


async function reactPost(
 postId,
 type
){

 if(!currentUser) return;

 try{

  const {data:old} =
   await db
    .from("reactions")
    .select(
     "id,reaction_type"
    )
    .eq(
     "post_id",
     postId
    )
    .eq(
     "user_id",
     currentUser.id
    )
    .maybeSingle();

  if(old){

   if(old.reaction_type === type){

    await db
     .from("reactions")
     .delete()
     .eq("id",old.id);

   }else{

    await db
     .from("reactions")
     .update({
      reaction_type:type
     })
     .eq("id",old.id);
   }

  }else{

   await db
    .from("reactions")
    .insert({
     post_id:postId,
     user_id:currentUser.id,
     reaction_type:type
    });
  }

  await loadReactions(postId);

 }catch(err){

  console.error(err);
 }
}


// =====================================================
// COMMENTS
// =====================================================

async function loadComments(postId){

 const box =
  document.getElementById(
   "comments-"+postId
  );

 if(!box) return;

 const {data,error} =
  await db
   .from("comments")
   .select("*")
   .eq("post_id",postId)
   .order(
    "created_at",
    {ascending:true}
   );

 if(error) return;

 const profiles =
  await getProfiles();

 box.innerHTML="";

 (data || []).forEach(comment=>{

  const p =
   profiles[comment.user_id] ||
   {
    display_name:"PASSTIME User"
   };

  const own =
   comment.user_id ===
   currentUser?.id;

  const div =
   document.createElement("div");

  div.className="comment";

  div.innerHTML = `

   <div class="comment-top">

    <b>
     ${escapeHtml(
      p.display_name
     )}
    </b>

    ${
     own
     ?
     `<button
       class="red"
       style="padding:3px 7px"
       onclick="deleteComment(
        ${comment.id},
        ${postId}
       )">
       ×
      </button>`
     :""
    }

   </div>

   <div>
    ${escapeHtml(
     comment.content
    )}
   </div>

   <small>
    ${new Date(
     comment.created_at
    ).toLocaleString()}
   </small>

  `;

  box.appendChild(div);
 });
}


async function addComment(postId){

 if(!currentUser) return;

 const input =
  document.getElementById(
   "comment-input-"+postId
  );

 const text =
  input.value.trim();

 if(!text) return;

 const {error} =
  await db
   .from("comments")
   .insert({
    post_id:postId,
    user_id:currentUser.id,
    content:text
   });

 if(error){

  showMessage(error.message);
  return;
 }

 input.value="";

 await loadComments(postId);
}


async function deleteComment(
 commentId,
 postId
){

 const {error} =
  await db
   .from("comments")
   .delete()
   .eq("id",commentId)
   .eq(
    "user_id",
    currentUser.id
   );

 if(error){

  showMessage(error.message);
  return;
 }

 await loadComments(postId);
}


// =====================================================
// DELETE POST
// =====================================================

async function deletePost(postId){

 if(!confirm(
  T[language].deleteConfirm
 )) return;

 const {error} =
  await db
   .from("posts")
   .delete()
   .eq("id",postId)
   .eq(
    "user_id",
    currentUser.id
   );

 if(error){

  showMessage(error.message);
  return;
 }

 await loadFeed();
}


// =====================================================
// USER PROFILE
// =====================================================

async function openUserProfile(
 userId
){

 const {data:profile,error} =
  await db
   .from("profiles")
   .select("*")
   .eq("id",userId)
   .maybeSingle();

 if(error || !profile){

  showMessage(
   "Profile not found."
  );

  return;
 }

 document.getElementById("appSection")
  .classList.add("hidden");

 document.getElementById("profileViewSection")
  .classList.remove("hidden");

 document.getElementById("viewName")
  .innerText =
   profile.display_name ||
   "PASSTIME User";

 document.getElementById("viewBio")
  .innerText =
   profile.bio ||
   T[language].noBio;

 document.getElementById("viewAvatar")
  .src =
   profile.avatar_url ||
   "https://ui-avatars.com/api/?name="+
   encodeURIComponent(
    profile.display_name ||
    "PASSTIME"
   )+
   "&background=1877f2&color=fff";


 const {data:posts} =
  await db
   .from("posts")
   .select("*")
   .eq("user_id",userId)
   .order(
    "created_at",
    {ascending:false}
   );

 const box =
  document.getElementById(
   "profilePosts"
  );

 box.innerHTML="";

 if(!posts || posts.length===0){

  box.innerHTML =
   `<p class="center">
     ${T[language].noPosts}
    </p>`;

  return;
 }

 const profiles =
  await getProfiles();

 for(const post of posts){

  await renderPost(
   post,
   profiles,
   box
  );
 }
}


function closeProfileView(){

 document.getElementById(
  "profileViewSection"
 )
 .classList.add("hidden");

 document.getElementById(
  "appSection"
 )
 .classList.remove("hidden");
}

// AUTH STATE
// =====================================================

db.auth.onAuthStateChange(
 async(event,session)=>{

  if(session){

   currentUser =
    session.user;

   if(event ===
      "PASSWORD_RECOVERY"){

    document.getElementById(
     "authSection"
    ).classList.add("hidden");

    document.getElementById(
     "passwordSection"
    ).classList.remove("hidden");

   }else{

    await loadUser();
   }

  }else{

   currentUser=null;
   currentProfile=null;

   showAuth();
  }
 }
);
