<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PASSTIME</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f0f2f5;
  color:#1c1e21
}

header{
  position:sticky;
  top:0;
  z-index:100;
  height:60px;
  background:#1877f2;
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
  box-shadow:0 2px 5px #0003
}

.logo{
  font-size:25px;
  font-weight:bold
}

.header-right{
  display:flex;
  align-items:center;
  gap:7px
}

header button{
  border:0;
  border-radius:8px;
  padding:8px 12px;
  font-weight:bold;
  cursor:pointer
}

.lang{
  border:0;
  border-radius:7px;
  padding:7px
}

.container{
  width:100%;
  max-width:720px;
  margin:18px auto;
  padding:0 10px
}

.card{
  background:white;
  border-radius:12px;
  padding:15px;
  margin-bottom:15px;
  box-shadow:0 1px 4px #0002
}

input,textarea,select{
  width:100%;
  border:1px solid #ccd0d5;
  border-radius:8px;
  padding:12px;
  font-size:15px;
  margin:6px 0 10px;
  outline:none
}

input:focus,textarea:focus{
  border-color:#1877f2
}

textarea{
  min-height:90px;
  resize:vertical
}

label{
  display:block;
  font-weight:bold;
  margin-top:8px
}

button{cursor:pointer}

.blue{background:#1877f2;color:white}
.green{background:#42b72a;color:white}
.gray{background:#e4e6eb;color:#050505}
.red{background:#e41e3f;color:white}

.full{width:100%}

.hidden{
  display:none!important
}

#message{
  position:fixed;
  top:70px;
  left:50%;
  transform:translateX(-50%);
  background:#222;
  color:white;
  padding:11px 18px;
  border-radius:8px;
  z-index:1000;
  display:none;
  max-width:90%;
  text-align:center
}

.profile-head{text-align:center}

.avatar{
  width:95px;
  height:95px;
  object-fit:cover;
  border-radius:50%;
  display:block;
  margin:5px auto 10px;
  background:#ddd;
  border:3px solid white;
  box-shadow:0 1px 5px #0004
}

.avatar-small{
  width:45px;
  height:45px;
  border-radius:50%;
  object-fit:cover
}

.home-nav{
  display:flex;
  justify-content:space-around;
  gap:5px;
  background:white;
  border-radius:10px;
  padding:7px;
  margin-bottom:15px;
  box-shadow:0 1px 3px #0002
}

.home-nav button{
  flex:1;
  background:white;
  border:0;
  padding:10px 5px;
  border-radius:8px;
  font-weight:bold
}

.home-nav button:hover{
  background:#e4e6eb
}

.create-top{
  display:flex;
  align-items:center;
  gap:10px
}

.create-top img{
  width:45px;
  height:45px;
  border-radius:50%;
  object-fit:cover
}

.create-text{
  flex:1;
  background:#f0f2f5;
  border-radius:25px;
  padding:12px 15px;
  cursor:pointer
}

.post-header{
  display:flex;
  align-items:center;
  gap:10px
}

.post-user{flex:1}

.post-user b{
  display:block
}

.post-user small{
  color:#65676b
}

.post-content{
  margin-top:12px;
  white-space:pre-wrap;
  word-break:break-word
}

.media{
  width:100%;
  max-height:520px;
  object-fit:contain;
  background:#000;
  border-radius:8px;
  margin-top:12px
}

.reaction-summary{
  color:#65676b;
  font-size:14px;
  padding:8px 0
}

.reaction-buttons{
  display:flex;
  gap:4px;
  flex-wrap:wrap;
  border-top:1px solid #ddd;
  border-bottom:1px solid #ddd;
  padding:7px 0
}

.reaction-buttons button{
  flex:1;
  min-width:65px;
  background:#f0f2f5;
  border:0;
  border-radius:7px;
  padding:9px 4px;
  font-size:13px
}

.reaction-buttons button:hover{
  background:#d8dadf
}

.comment-box{
  display:flex;
  gap:5px;
  margin-top:9px
}

.comment-box input{
  margin:0
}

.comment-box button{
  border:0;
  border-radius:8px;
  padding:0 13px
}

.comment{
  background:#f0f2f5;
  border-radius:12px;
  padding:8px 11px;
  margin-top:7px
}

.comment-head{
  display:flex;
  justify-content:space-between;
  align-items:center
}

.comment small{
  color:#65676b
}

.search-box{
  display:flex;
  gap:5px
}

.search-box input{margin:0}

.profile-post-title{
  font-size:19px;
  font-weight:bold;
  margin-bottom:10px
}

#preview img,
#preview video{
  width:100%;
  max-height:400px;
  object-fit:contain;
  border-radius:8px;
  margin-top:8px
}

.center{
  text-align:center;
  padding:20px;
  color:#65676b
}

.user-result{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  border-bottom:1px solid #ddd;
  cursor:pointer
}

.user-result:hover{
  background:#f0f2f5
}

.post-menu{
  background:#e4e6eb;
  border:0;
  border-radius:50%;
  width:35px;
  height:35px;
  font-size:20px
}

.delete-btn{
  border:0;
  background:#ffe5e5;
  color:#d00;
  padding:6px 9px;
  border-radius:7px
}

@media(max-width:600px){
  header{
    height:55px;
    padding:0 9px
  }

  .logo{font-size:21px}

  header button{
    padding:7px 8px;
    font-size:12px
  }

  .container{
    margin:10px auto
  }

  .reaction-buttons button{
    min-width:55px;
    font-size:12px
  }
}
</style>
</head>

<body>

<div id="message"></div>

<header>

<div class="logo">PASSTIME</div>

<div class="header-right">

<select id="languageSelect"
class="lang"
onchange="changeLanguage(this.value)">
<option value="en">English</option>
<option value="bn">বাংলা</option>
</select>

<button id="headerProfileBtn"
class="gray hidden"
onclick="openMyProfile()">
Profile
</button>

<button id="logoutBtn"
class="red hidden"
onclick="logout()">
Logout
</button>

</div>
</header>


<!-- LOGIN -->

<div id="authSection" class="container">

<div class="card">

<h2 id="loginTitle">Login</h2>

<label id="loginLabel">
Phone Number or Gmail
</label>

<input
id="loginPhone"
type="text"
placeholder="Phone Number or Gmail"
autocomplete="username">

<label>Password</label>

<input
id="loginPassword"
type="password"
placeholder="Password"
autocomplete="current-password">

<button
class="blue full"
style="padding:12px;border:0;border-radius:8px"
onclick="login()">
Login
</button>

<button
class="green full"
style="padding:12px;border:0;border-radius:8px;margin-top:8px"
onclick="showSignup()">
Create Account
</button>

<button
class="gray full"
style="padding:12px;border:0;border-radius:8px;margin-top:8px"
onclick="showForgot()">
Forgot Password?
</button>

</div>


<!-- SIGNUP -->

<div id="signupBox" class="card hidden">

<h2>Create Account</h2>

<label>Name</label>

<input id="signupName"
type="text"
placeholder="Your name">

<label>Phone Number</label>

<input id="signupPhone"
type="tel"
placeholder="Phone Number">

<label>Gmail / Recovery Email</label>

<input id="signupEmail"
type="email"
placeholder="Gmail / Email">

<label>Password</label>

<input id="signupPassword"
type="password"
placeholder="Password">

<label>Confirm Password</label>

<input id="signupConfirm"
type="password"
placeholder="Confirm Password">

<button
class="green full"
style="padding:12px;border:0;border-radius:8px"
onclick="signup()">
Create Account
</button>

<button
class="gray full"
style="padding:12px;border:0;border-radius:8px;margin-top:8px"
onclick="hideSignup()">
Back to Login
</button>

</div>

</div>


<!-- FORGOT -->

<div id="forgotSection" class="container hidden">

<div class="card">

<h2>Forgot Password</h2>

<p>Enter your Gmail / Recovery Email.</p>

<input
id="forgotEmail"
type="email"
placeholder="Gmail / Email">

<button
class="blue full"
style="padding:12px;border:0;border-radius:8px"
onclick="sendReset()">
Send Reset Link
</button>

<button
class="gray full"
style="padding:12px;border:0;border-radius:8px;margin-top:8px"
onclick="closeForgot()">
Back
</button>

</div>
</div>


<!-- NEW PASSWORD -->

<div id="passwordSection" class="container hidden">

<div class="card">

<h2>New Password</h2>

<input
id="newPassword"
type="password"
placeholder="New Password">

<button
class="blue full"
style="padding:12px;border:0;border-radius:8px"
onclick="updatePassword()">
Update Password
</button>

</div>
</div>


<!-- APP -->

<div id="appSection" class="container hidden">

<div class="home-nav">

<button onclick="showHome()">🏠 Home</button>

<button onclick="openMyProfile()">👤 Profile</button>

<button onclick="focusCreatePost()">➕ Post</button>

</div>


<!-- SEARCH -->

<div class="card">

<div class="search-box">

<input
id="searchInput"
placeholder="Search people or posts..."
onkeydown="if(event.key==='Enter')searchContent()">

<button
class="blue"
onclick="searchContent()">
🔍
</button>

</div>

<div id="searchResults"></div>

</div>


<!-- MY PROFILE -->

<div id="myProfileCard" class="card">

<div class="profile-head">

<img id="myAvatar"
class="avatar"
src="">

<h2 id="myName">PASSTIME User</h2>

<p id="myBio">No bio</p>

<button
class="blue"
style="border:0;border-radius:8px;padding:10px 15px"
onclick="editProfile()">
Edit Profile
</button>

</div>
</div>


<!-- CREATE POST -->

<div id="createPostCard" class="card">

<div class="create-top">

<img id="createAvatar" src="">

<div
class="create-text"
onclick="document.getElementById('postText').focus()">
What's on your mind?
</div>

</div>

<textarea
id="postText"
placeholder="What's on your mind?"></textarea>

<label>📷 Photo / 🎥 Video</label>

<input
id="mediaFile"
type="file"
accept="image/*,video/*"
onchange="previewFile()">

<div id="preview"></div>

<button
class="blue full"
style="border:0;border-radius:8px;padding:12px;margin-top:8px"
onclick="createPost()">
Publish
</button>

</div>


<!-- FEED -->

<div class="card">

<h3>📰 News Feed</h3>

<div id="feed">Loading...</div>

</div>

</div>


<!-- OTHER PROFILE -->

<div id="profileViewSection" class="container hidden">

<div class="card">

<button
class="gray"
style="border:0;border-radius:8px;padding:9px 13px"
onclick="showHome()">
← Back
</button>

<div class="profile-head">

<img id="viewAvatar"
class="avatar"
src="">

<h2 id="viewName"></h2>

<p id="viewBio"></p>

</div>
</div>

<div class="card">

<div class="profile-post-title">
📰 Posts
</div>

<div id="profilePosts"></div>

</div>

</div>


<!-- EDIT PROFILE -->

<div id="editProfileSection" class="container hidden">

<div class="card">

<button
class="gray"
style="border:0;border-radius:8px;padding:9px 13px"
onclick="showHome()">
← Back
</button>

<h2>Edit Profile</h2>

<label>Name</label>

<input id="editName">

<label>Bio</label>

<textarea
id="editBio"
placeholder="Write something about yourself"></textarea>

<label>Profile Photo</label>

<input
id="profilePhoto"
type="file"
accept="image/*">

<button
class="blue full"
style="border:0;border-radius:8px;padding:12px"
onclick="saveProfile()">
Save Profile
</button>

</div>
</div>


<script>

/* =========================
SUPABASE
========================= */

const SUPABASE_URL =
"https://klreqkbqyyiwmohlmgkh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_xlqcHTsDaMpBq4n54iMs4A_S7gKpiZc";

const db=supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let currentUser=null;
let currentProfile=null;

let language=
localStorage.getItem("passtime_language")||"en";


/* =========================
LANGUAGE
========================= */

const LANG={

en:{
login:"Login",
phone:"Phone Number or Gmail",
password:"Password",
create:"Create Account",
forgot:"Forgot Password?",
publish:"Publish",
noPosts:"No posts yet.",
loading:"Loading...",
comment:"Comment",
delete:"Delete",
noBio:"No bio",
saved:"Profile saved.",
loggedIn:"Login successful.",
loggedOut:"Logged out.",
wrong:"Phone Number or Gmail / Password is incorrect.",
phoneNotFound:"No account found with this Phone Number."
},

bn:{
login:"Login",
phone:"Phone Number or Gmail",
password:"Password",
create:"Create Account",
forgot:"Forgot Password?",
publish:"Publish",
noPosts:"এখনো কোনো পোস্ট নেই।",
loading:"লোড হচ্ছে...",
comment:"Comment",
delete:"Delete",
noBio:"No bio",
saved:"Profile saved.",
loggedIn:"Login successful.",
loggedOut:"Logged out.",
wrong:"Phone Number or Gmail / Password is incorrect.",
phoneNotFound:"এই Phone Number দিয়ে কোনো account পাওয়া যায়নি।"
}

};


function changeLanguage(value){

language=value;

localStorage.setItem(
"passtime_language",
value
);

applyLanguage();

}


function applyLanguage(){

const t=LANG[language];

document.getElementById("loginTitle").innerText=t.login;

document.getElementById("loginLabel").innerText=t.phone;

document.getElementById("loginPhone").placeholder=t.phone;

document.getElementById("loginPassword").placeholder=t.password;

}


document.getElementById("languageSelect").value=language;

applyLanguage();


/* =========================
HELPERS
========================= */

function normalizePhone(phone){

return String(phone||"")
.trim()
.replace(/[\s\-()]/g,"");

}


function escapeHtml(text){

return String(text||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function avatarUrl(profile){

if(profile&&profile.avatar_url)
return profile.avatar_url;

const name=
profile?.display_name||
"PASSTIME";

return "https://ui-avatars.com/api/?name="+
encodeURIComponent(name)+
"&background=1877f2&color=fff";

}


function showMessage(text){

const box=document.getElementById("message");

box.innerText=text;

box.style.display="block";

clearTimeout(window.messageTimer);

window.messageTimer=setTimeout(()=>{
box.style.display="none";
},3000);

}


/* =========================
SCREEN
========================= */

function hideAllScreens(){

[
"authSection",
"forgotSection",
"passwordSection",
"appSection",
"profileViewSection",
"editProfileSection"
].forEach(id=>{
document.getElementById(id)
.classList.add("hidden");
});

}


function showAuth(){

hideAllScreens();

document.getElementById("authSection")
.classList.remove("hidden");

document.getElementById("logoutBtn")
.classList.add("hidden");

document.getElementById("headerProfileBtn")
.classList.add("hidden");

}


function showHome(){

hideAllScreens();

document.getElementById("appSection")
.classList.remove("hidden");

document.getElementById("logoutBtn")
.classList.remove("hidden");

document.getElementById("headerProfileBtn")
.classList.remove("hidden");

}


function showForgot(){

hideAllScreens();

document.getElementById("forgotSection")
.classList.remove("hidden");

}


function closeForgot(){

showAuth();

}


function showSignup(){

document.getElementById("signupBox")
.classList.remove("hidden");

}


function hideSignup(){

document.getElementById("signupBox")
.classList.add("hidden");

}


/* =========================
SIGNUP
========================= */

async function signup(){

const name=document.getElementById("signupName").value.trim();

const phone=normalizePhone(
document.getElementById("signupPhone").value
);

const email=document.getElementById("signupEmail").value
.trim()
.toLowerCase();

const password=document.getElementById("signupPassword").value;

const confirm=document.getElementById("signupConfirm").value;


if(!name){
showMessage("Please enter your name.");
return;
}

if(!phone){
showMessage("Please enter Phone Number.");
return;
}

if(!email){
showMessage("Please enter Gmail / Email.");
return;
}

if(password.length<6){
showMessage("Password must be at least 6 characters.");
return;
}

if(password!==confirm){
showMessage("Passwords do not match.");
return;
}


try{

const {data:existing,error:checkError}=await db
.from("profiles")
.select("id")
.eq("phone",phone)
.maybeSingle();

if(checkError) throw checkError;

if(existing){
showMessage("This Phone Number is already registered.");
return;
}


const {data,error}=await db.auth.signUp({
email:email,
password:password
});

if(error) throw error;

if(!data.user){
showMessage("Account could not be created.");
return;
}


if(!data.session){

showMessage(
"Account created. Please confirm your email, then login."
);

return;

}


const {error:profileError}=await db
.from("profiles")
.upsert({
id:data.user.id,
display_name:name,
phone:phone,
recovery_email:email,
role:"user"
});

if(profileError) throw profileError;


showMessage("Account created successfully.");

await loadUser();

}catch(error){

console.error(error);

showMessage(
error.message||"Signup failed."
);

}

}


/* =========================
LOGIN
========================= */

async function login(){

const input=document
.getElementById("loginPhone")
.value.trim();

const password=document
.getElementById("loginPassword")
.value;

if(!input||!password){

showMessage(
"Please enter Phone Number or Gmail and Password."
);

return;
}


try{

let email="";


if(input.includes("@")){

email=input.toLowerCase();

}else{

const phone=normalizePhone(input);

const {data,error}=await db.rpc(
"get_login_email",
{
p_phone:phone
}
);

if(error){

console.error(error);

showMessage(
"Phone Number login error."
);

return;
}

if(!data){

showMessage(
LANG[language].phoneNotFound
);

return;
}

email=String(data).trim().toLowerCase();

}


const {data,error}=await db.auth.signInWithPassword({
email:email,
password:password
});


if(error){

console.error(error);

showMessage(LANG[language].wrong);

return;
}


if(data.user){

currentUser=data.user;

showMessage(LANG[language].loggedIn);

await loadUser();

}

}catch(error){

console.error(error);

showMessage(
LANG[language].wrong
);

}

}


/* =========================
LOAD USER
========================= */

async function loadUser(){

const {
data:{user}
}=await db.auth.getUser();


if(!user){

currentUser=null;
currentProfile=null;

showAuth();

return;
}


currentUser=user;


let {data:profile,error}=await db
.from("profiles")
.select("*")
.eq("id",user.id)
.maybeSingle();


if(error)
console.error(error);


if(!profile){

const {data:newProfile,error:newError}=await db
.from("profiles")
.insert({
id:user.id,
display_name:user.email?.split("@")[0]||"PASSTIME User",
phone:"",
recovery_email:user.email||"",
role:"user"
})
.select()
.single();

if(!newError)
profile=newProfile;

}


currentProfile=profile;

updateMyProfile();

showHome();

await loadFeed();

}


/* =========================
PROFILE UI
========================= */

function updateMyProfile(){

if(!currentProfile)return;

const name=
currentProfile.display_name||
"PASSTIME User";

const avatar=avatarUrl(currentProfile);

document.getElementById("myName").innerText=name;

document.getElementById("myBio").innerText=
currentProfile.bio||
LANG[language].noBio;

document.getElementById("myAvatar").src=avatar;

document.getElementById("createAvatar").src=avatar;

}


function openMyProfile(){

if(!currentProfile)return;

showHome();

document.getElementById("myProfileCard")
.scrollIntoView({
behavior:"smooth"
});

}


function editProfile(){

if(!currentProfile)return;

hideAllScreens();

document.getElementById("editProfileSection")
.classList.remove("hidden");

document.getElementById("editName").value=
currentProfile.display_name||"";

document.getElementById("editBio").value=
currentProfile.bio||"";

}


/* =========================
SAVE PROFILE
========================= */

async function saveProfile(){

if(!currentUser)return;

const name=document.getElementById("editName")
.value.trim();

const bio=document.getElementById("editBio")
.value.trim();

if(!name){

showMessage("Name is required.");

return;
}


try{

let avatar_url=currentProfile?.avatar_url||null;

const file=document.getElementById("profilePhoto")
.files[0];


if(file){

const ext=file.name.split(".").pop();

const path=
"avatars/"+currentUser.id+"."+ext;

const {error:uploadError}=await db.storage
.from("media")
.upload(path,file,{
upsert:true,
contentType:file.type
});

if(uploadError)throw uploadError;

const {data}=db.storage
.from("media")
.getPublicUrl(path);

avatar_url=data.publicUrl;

}


const {data,error}=await db
.from("profiles")
.update({
display_name:name,
bio:bio,
avatar_url:avatar_url
})
.eq("id",currentUser.id)
.select()
.single();

if(error)throw error;

currentProfile=data;

updateMyProfile();

showMessage(LANG[language].saved);

showHome();

}catch(error){

console.error(error);

showMessage(
error.message||"Profile update failed."
);

}

}


/* =========================
POST PREVIEW
========================= */

function previewFile(){

const file=document.getElementById("mediaFile")
.files[0];

const preview=document.getElementById("preview");

preview.innerHTML="";

if(!file)return;

const url=URL.createObjectURL(file);

if(file.type.startsWith("image/")){

const img=document.createElement("img");

img.src=url;

preview.appendChild(img);

}else if(file.type.startsWith("video/")){

const video=document.createElement("video");

video.src=url;

video.controls=true;

preview.appendChild(video);

}

}


/* =========================
CREATE POST
========================= */

async function createPost(){

if(!currentUser){

showMessage("Please login first.");

return;
}


const text=document
.getElementById("postText")
.value.trim();

const file=document
.getElementById("mediaFile")
.files[0];


if(!text&&!file){

showMessage("Write something or select a photo/video.");

return;
}


try{

let media_url=null;
let media_type=null;


if(file){

const ext=file.name.split(".").pop();

const filename=
Date.now()+"-"+Math.random()
.toString(36)
.substring(2)+
"."+
ext;

const path=
"posts/"+currentUser.id+"/"+filename;


const {error:uploadError}=await db.storage
.from("media")
.upload(path,file,{
contentType:file.type
});

if(uploadError)throw uploadError;


const {data}=db.storage
.from("media")
.getPublicUrl(path);

media_url=data.publicUrl;

media_type=
file.type.startsWith("image/")
?"image":
"video";

}


const {error}=await db
.from("posts")
.insert({
user_id:currentUser.id,
content:text,
media_url:media_url,
media_type:media_type
});

if(error)throw error;


document.getElementById("postText").value="";

document.getElementById("mediaFile").value="";

document.getElementById("preview").innerHTML="";

showMessage("Post published successfully.");

await loadFeed();

}catch(error){

console.error(error);

showMessage(
error.message||"Post failed."
);

}

}


/* =========================
LOAD FEED
========================= */

async function loadFeed(){

const feed=document.getElementById("feed");

feed.innerHTML=
"<div class='center'>Loading...</div>";


const {data:posts,error}=await db
.from("posts")
.select(`
*,
profiles:user_id(
id,
display_name,
avatar_url
)
`)
.order("created_at",{ascending:false})
.limit(50);


if(error){

console.error(error);

feed.innerHTML=
"<div class='center'>Could not load posts.</div>";

return;
}


if(!posts||posts.length===0){

feed.innerHTML=
"<div class='center'>"+
LANG[language].noPosts+
"</div>";

return;
}


feed.innerHTML="";

for(const post of posts){

feed.appendChild(
await createPostElement(post)
);

}

}


/* =========================
POST ELEMENT
========================= */

async function createPostElement(post){

const div=document.createElement("div");

div.className="card";

const profile=post.profiles||{};

const avatar=avatarUrl(profile);

const name=
profile.display_name||
"PASSTIME User";


let media="";

if(post.media_url){

if(post.media_type==="video"){

media=
`<video class="media" controls playsinline src="${escapeHtml(post.media_url)}"></video>`;

}else{

media=
`<img class="media" src="${escapeHtml(post.media_url)}" loading="lazy">`;

}

}


const time=post.created_at?
new Date(post.created_at).toLocaleString():
"";


let deleteButton="";

if(currentUser&&post.user_id===currentUser.id){

deleteButton=
`<button class="delete-btn"
onclick="deletePost('${post.id}')">
Delete
</button>`;

}


div.innerHTML=`

<div class="post-header">

<img
class="avatar-small"
src="${escapeHtml(avatar)}">

<div class="post-user">

<b
style="cursor:pointer"
onclick="openUserProfile('${post.user_id}')">
${escapeHtml(name)}
</b>

<small>${escapeHtml(time)}</small>

</div>

${deleteButton}

</div>

${post.content?
`<div class="post-content">
${escapeHtml(post.content)}
</div>`:""}

${media}

<div id="summary-${post.id}"
class="reaction-summary">
Loading reactions...
</div>

<div class="reaction-buttons">

<button onclick="reactPost('${post.id}','Like')">
👍 Like
</button>

<button onclick="reactPost('${post.id}','Love')">
❤️ Love
</button>

<button onclick="reactPost('${post.id}','Haha')">
😂 Haha
</button>

<button onclick="reactPost('${post.id}','Wow')">
😮 Wow
</button>

<button onclick="reactPost('${post.id}','Sad')">
😢 Sad
</button>

<button onclick="reactPost('${post.id}','Angry')">
😡 Angry
</button>

</div>

<div class="comment-box">

<input
id="comment-${post.id}"
placeholder="Write a comment...">

<button
class="blue"
onclick="addComment('${post.id}')">
Comment
</button>

</div>

<div id="comments-${post.id}">
</div>
`;


loadReactions(post.id);

loadComments(post.id);


return div;

}


/* =========================
REACTIONS
========================= */

async function reactPost(postId,type){

if(!currentUser){

showMessage("Please login first.");

return;
}


try{

const {data:old}=await db
.from("reactions")
.select("id,reaction_type")
.eq("post_id",postId)
.eq("user_id",currentUser.id)
.maybeSingle();


if(old){

if(old.reaction_type===type){

await db
.from("reactions")
.delete()
.eq("id",old.id);

}else{

await db
.from("reactions")
.update({
reaction_type:type
})
.eq("id",old.id);

}

}else{

await db
.from("reactions")
.insert({
post_id:postId,
user_id:currentUser.id,
reaction_type:type
});

}


await loadReactions(postId);

}catch(error){

console.error(error);

showMessage(
error.message||"Reaction failed."
);

}

}


/* =========================
REACTION SUMMARY
========================= */

async function loadReactions(postId){

const {data,error}=await db
.from("reactions")
.select("reaction_type,user_id")
.eq("post_id",postId);


if(error){

console.error(error);

return;
}


const counts={};

(data||[]).forEach(r=>{

counts[r.reaction_type]=
(counts[r.reaction_type]||0)+1;

});


const total=(data||[]).length;

const summary=document
.getElementById("summary-"+postId);

if(!summary)return;


if(!total){

summary.innerText="";

return;
}


summary.innerText=
"👍 "+(counts.Like||0)+
"  ❤️ "+(counts.Love||0)+
"  😂 "+(counts.Haha||0)+
"  😮 "+(counts.Wow||0)+
"  😢 "+(counts.Sad||0)+
"  😡 "+(counts.Angry||0)+
" • "+total+" reactions";

}


/* =========================
COMMENTS
========================= */

async function addComment(postId){

if(!currentUser){

showMessage("Please login first.");

return;
}


const input=document
.getElementById("comment-"+postId);

const text=input.value.trim();

if(!text)return;


try{

const {error}=await db
.from("comments")
.insert({
post_id:postId,
user_id:currentUser.id,
content:text
});

if(error)throw error;

input.value="";

await loadComments(postId);

}catch(error){

console.error(error);

showMessage(
error.message||"Comment failed."
);

}

}


async function loadComments(postId){

const box=document
.getElementById("comments-"+postId);

if(!box)return;


const {data:comments,error}=await db
.from("comments")
.select(`
*,
profiles:user_id(
id,
display_name,
avatar_url
)
`)
.eq("post_id",postId)
.order("created_at",{ascending:true});


if(error){

console.error(error);

return;
}


box.innerHTML="";


(comments||[]).forEach(comment=>{

const profile=comment.profiles||{};

const name=
profile.display_name||
"User";


const div=document.createElement("div");

div.className="comment";

let del="";

if(currentUser&&comment.user_id===currentUser.id){

del=
`<button
class="delete-btn"
onclick="deleteComment('${comment.id}','${postId}')">
Delete
</button>`;

}


div.innerHTML=`

<div class="comment-head">

<b>${escapeHtml(name)}</b>

${del}

</div>

<div>
${escapeHtml(comment.content)}
</div>

<small>
${comment.created_at?
new Date(comment.created_at).toLocaleString():
""}
</small>
`;

box.appendChild(div);

});

}


/* =========================
DELETE COMMENT
========================= */

async function deleteComment(commentId,postId){

if(!currentUser)return;

if(!confirm("Delete this comment?"))return;


const {error}=await db
.from("comments")
.delete()
.eq("id",commentId)
.eq("user_id",currentUser.id);


if(error){

console.error(error);

showMessage(error.message);

return;

}

await loadComments(postId);

}


/* =========================
DELETE POST
========================= */

async function deletePost(postId){

if(!currentUser)return;

if(!confirm("Delete this post?"))return;


const {error}=await db
.from("posts")
.delete()
.eq("id",postId)
.eq("user_id",currentUser.id);


if(error){

console.error(error);

showMessage(error.message);

return;

}


showMessage("Post deleted.");

await loadFeed();

}


/* =========================
SEARCH
========================= */

async function searchContent(){

const q=document
.getElementById("searchInput")
.value.trim();


const box=document
.getElementById("searchResults");


if(!q){

box.innerHTML="";

return;

}


box.innerHTML=
"<div class='center'>Searching...</div>";


const {data:users,error:userError}=await db
.from("profiles")
.select("id,display_name,avatar_url,bio")
.ilike("display_name","%"+q+"%")
.limit(10);


if(userError){

console.error(userError);

box.innerHTML=
"<div class='center'>Search failed.</div>";

return;

}


box.innerHTML="";


if(users&&users.length){

const title=document.createElement("h4");

title.innerText="People";

box.appendChild(title);


users.forEach(user=>{

const div=document.createElement("div");

div.className="user-result";

div.innerHTML=`

<img
class="avatar-small"
src="${escapeHtml(avatarUrl(user))}">

<div>

<b>${escapeHtml(user.display_name)}</b>

<div style="color:#65676b">
${escapeHtml(user.bio||"")}
</div>

</div>
`;

div.onclick=()=>{
openUserProfile(user.id);
};

box.appendChild(div);

});

}else{

box.innerHTML=
"<div class='center'>No people found.</div>";

}

}


/* =========================
OTHER PROFILE
========================= */

async function openUserProfile(userId){

const {data:profile,error}=await db
.from("profiles")
.select("*")
.eq("id",userId)
.maybeSingle();


if(error||!profile){

showMessage("Profile not found.");

return;

}


hideAllScreens();

document.getElementById("profileViewSection")
.classList.remove("hidden");

document.getElementById("viewAvatar").src=
avatarUrl(profile);

document.getElementById("viewName").innerText=
profile.display_name||"PASSTIME User";

document.getElementById("viewBio").innerText=
profile.bio||"No bio";


await loadProfilePosts(userId);

}


async function loadProfilePosts(userId){

const box=document
.getElementById("profilePosts");

box.innerHTML=
"<div class='center'>Loading...</div>";


const {data:posts,error}=await db
.from("posts")
.select(`
*,
profiles:user_id(
id,
display_name,
avatar_url
)
`)
.eq("user_id",userId)
.order("created_at",{ascending:false});


if(error){

console.error(error);

box.innerHTML=
"<div class='center'>Could not load posts.</div>";

return;

}


if(!posts||!posts.length){

box.innerHTML=
"<div class='center'>No posts yet.</div>";

return;

}


box.innerHTML="";


for(const post of posts){

box.appendChild(
await createPostElement(post)
);

}

}

FOCUS POST
========================= */

function focusCreatePost(){

showHome();

setTimeout(()=>{

document.getElementById("createPostCard")
.scrollIntoView({
behavior:"smooth"
});

document.getElementById("postText").focus();

},100);

}


/* =========================
LOGOUT
========================= */

async function logout(){

try{

await db.auth.signOut();

}catch(error){

console.error(error);

}

currentUser=null;

currentProfile=null;

showAuth();

showMessage(
LANG[language].loggedOut
);

}


/* =========================
FORGOT PASSWORD
========================= */

async function sendReset(){

const email=document
.getElementById("forgotEmail")
.value.trim()
.toLowerCase();


if(!email){

showMessage("Please enter your Gmail / Email.");

return;
}


try{

const redirectTo=
window.location.origin+
window.location.pathname;


const {error}=await db.auth
.resetPasswordForEmail(
email,
{
redirectTo:redirectTo
}
);


if(error)throw error;


showMessage(
"Password reset link has been sent to your email."
);


}catch(error){

console.error(error);

showMessage(
error.message||"Reset email failed."
);

}

}


/* =========================
PASSWORD UPDATE
========================= */

async function updatePassword(){

const password=document
.getElementById("newPassword")
.value;


if(password.length<6){

showMessage(
"Password must be at least 6 characters."
);

return;

}


try{

const {error}=await db.auth
.updateUser({
password:password
});


if(error)throw error;


showMessage(
"Password updated successfully."
);

await db.auth.signOut();

showAuth();


}catch(error){

console.error(error);

showMessage(
error.message||"Password update failed."
);

}

}


/* =========================
AUTH STATE
========================= */

db.auth.onAuthStateChange(
async(event,session)=>{

if(event==="PASSWORD_RECOVERY"){

hideAllScreens();

document.getElementById("passwordSection")
.classList.remove("hidden");

return;

}


if(session&&session.user){

currentUser=session.user;

await loadUser();

}else{

currentUser=null;
currentProfile=null;

showAuth();

}

});


/* =========================
INITIAL LOAD
========================= */

(async()=>{

try{

const {
data:{session}
}=await db.auth.getSession();


if(session){

await loadUser();

}else{

showAuth();

}

}catch(error){

console.error(error);

showAuth();

}

})();

</script>
