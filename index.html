<style>

<script>

/* =====================================
SUPABASE
===================================== */

const SUPABASE_URL =
"https://klreqkbqyyiwmohlmgkh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_xlqcHTsDaMpBq4n54iMs4A_S7gKpiZc";

const db =
supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);


/* =====================================
HELPERS
===================================== */

function escapeHTML(value){

 if(value === null || value === undefined){
  return "";
 }

 return String(value)
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");
}


function escapeAttr(value){
 return escapeHTML(value);
}


function formatDate(date){

 if(!date) return "";

 const d=new Date(date);

 return d.toLocaleString(
  "en-BD",
  {
   dateStyle:"medium",
   timeStyle:"short"
  }
 );

}


/* =====================================
LOGIN
===================================== */

function openLogin(){

 document.getElementById(
  "loginModal"
 ).style.display="flex";

}


function closeLogin(){

 document.getElementById(
  "loginModal"
 ).style.display="none";

}


function emailMode(){

 document.getElementById("emailArea")
 .classList.remove("hidden");

 document.getElementById("phoneArea")
 .classList.add("hidden");

 document.getElementById("forgotArea")
 .classList.add("hidden");

 document.getElementById("emailTab")
 .classList.add("active");

 document.getElementById("phoneTab")
 .classList.remove("active");

}


function phoneMode(){

 document.getElementById("emailArea")
 .classList.add("hidden");

 document.getElementById("phoneArea")
 .classList.remove("hidden");

 document.getElementById("forgotArea")
 .classList.add("hidden");

 document.getElementById("emailTab")
 .classList.remove("active");

 document.getElementById("phoneTab")
 .classList.add("active");

}


function forgotMode(){

 document.getElementById("emailArea")
 .classList.add("hidden");

 document.getElementById("phoneArea")
 .classList.add("hidden");

 document.getElementById("forgotArea")
 .classList.remove("hidden");

}


function showLoginMsg(message){

 document.getElementById(
  "loginMsg"
 ).innerText=message;

}


async function loginEmail(){

 const email=
 document.getElementById("email")
 .value.trim();

 const password=
 document.getElementById("password")
 .value;


 if(!email || !password){

  showLoginMsg(
   "Email ও Password দিন।"
  );

  return;
 }


 showLoginMsg("Login হচ্ছে...");


 const {error}=
 await db.auth.signInWithPassword({
  email,
  password
 });


 if(error){

  showLoginMsg(
   "Login failed: "+error.message
  );

  return;
 }


 showLoginMsg(
  "Login successful ✅"
 );


 setTimeout(
  closeLogin,
  700
 );

}


async function signupEmail(){

 const email=
 document.getElementById("email")
 .value.trim();

 const password=
 document.getElementById("password")
 .value;


 if(!email || !password){

  showLoginMsg(
   "Email ও Password দিন।"
  );

  return;
 }


 if(password.length < 6){

  showLoginMsg(
   "Password কমপক্ষে 6 অক্ষরের হতে হবে।"
  );

  return;
 }


 showLoginMsg(
  "Account তৈরি হচ্ছে..."
 );


 const {data,error}=
 await db.auth.signUp({
  email,
  password
 });


 if(error){

  showLoginMsg(
   "Signup failed: "+
   error.message
  );

  return;
 }


 if(data.session){

  showLoginMsg(
   "Account তৈরি হয়েছে ✅"
  );

 }else{

  showLoginMsg(
   "Account তৈরি হয়েছে। আপনার Email verification করুন।"
  );

 }

}


async function resetPassword(){

 const email=
 document.getElementById("resetEmail")
 .value.trim();


 if(!email){

  showLoginMsg("Email দিন।");

  return;
 }


 showLoginMsg(
  "Reset link পাঠানো হচ্ছে..."
 );


 const redirectUrl=
 window.location.origin+
 window.location.pathname;


 const {error}=
 await db.auth.resetPasswordForEmail(
  email,
  {
   redirectTo:redirectUrl
  }
 );


 if(error){

  showLoginMsg(
   "Reset failed: "+
   error.message
  );

  return;
 }


 showLoginMsg(
  "Password reset link Email-এ পাঠানো হয়েছে ✅"
 );

}


/* =====================================
PHONE OTP
===================================== */

function fullPhone(){

 let phone=
 document.getElementById("phone")
 .value.trim();

 phone=
 phone.replace(
  /[\s\-()]/g,
  ""
 );


 if(phone.startsWith("+")){

  return phone;

 }


 return document.getElementById(
  "countryCode"
 ).value + phone;

}


async function sendOTP(){

 const phone=fullPhone();


 if(phone.length < 8){

  showLoginMsg(
   "সঠিক Phone Number দিন।"
  );

  return;
 }


 showLoginMsg(
  "OTP পাঠানো হচ্ছে..."
 );


 const {error}=
 await db.auth.signInWithOtp({
  phone:phone,
  options:{
   shouldCreateUser:true
  }
 });


 if(error){

  showLoginMsg(
   "OTP failed: "+
   error.message
  );

  return;
 }


 document.getElementById(
  "otpArea"
 ).classList.remove("hidden");


 showLoginMsg(
  "OTP পাঠানো হয়েছে 📱"
 );

}


async function verifyOTP(){

 const phone=fullPhone();

 const token=
 document.getElementById("otp")
 .value.trim();


 if(!token){

  showLoginMsg(
   "OTP দিন।"
  );

  return;
 }


 showLoginMsg(
  "OTP যাচাই হচ্ছে..."
 );


 const {error}=
 await db.auth.verifyOtp({
  phone:phone,
  token:token,
  type:"sms"
 });


 if(error){

  showLoginMsg(
   "OTP failed: "+
   error.message
  );

  return;
 }


 showLoginMsg(
  "Phone Login successful ✅"
 );


 setTimeout(
  closeLogin,
  700
 );

}


/* =====================================
USER
===================================== */

async function getUser(){

 const {
  data:{session}
 }=
 await db.auth.getSession();

 return session?.user || null;

}


function updateUser(user){

 const area=
 document.getElementById(
  "accountArea"
 );

 const status=
 document.getElementById(
  "userStatus"
 );


 if(user){

  const identity=
  user.email ||
  user.phone ||
  "PASSTIME User";


  area.innerHTML=
  `<button
   class="logout"
   onclick="logout()">
   Logout
   </button>`;


  status.innerHTML=
  `আপনি Login করেছেন ✅<br>
   <b>${escapeHTML(identity)}</b>`;

 }else{

  area.innerHTML=
  `<button
   class="login"
   onclick="openLogin()">
   Login
   </button>`;


  status.innerText=
  "আপনি এখনো Login করেননি।";

 }

}


async function logout(){

 await db.auth.signOut();

 updateUser(null);

 loadFeed();

}


/* =====================================
AUTH LISTENER
===================================== */

db.auth.onAuthStateChange(
 (_event,session)=>{

  updateUser(
   session?.user || null
  );

  loadFeed();

 }
);


/* =====================================
POST BOX
===================================== */

async function requireLogin(){

 const user=await getUser();

 if(!user){

  openLogin();

  return false;

 }

 return true;

}


async function openPostBox(type){

 const ok=
 await requireLogin();

 if(!ok) return;


 document.getElementById(
  "postModal"
 ).style.display="flex";


 const file=
 document.getElementById(
  "mediaFile"
 );


 const text=
 document.getElementById(
  "postText"
 );


 if(type==="photo"){

  file.accept="image/*";

  text.placeholder=
  "Photo সম্পর্কে কিছু লিখুন...";

 }else if(type==="video"){

  file.accept="video/*";

  text.placeholder=
  "Video সম্পর্কে কিছু লিখুন...";

 }else{

  file.accept="image/*,video/*";

  text.placeholder=
  "What's on your mind?";

 }

}


function closePostBox(){

 document.getElementById(
  "postModal"
 ).style.display="none";


 document.getElementById(
  "postMsg"
 ).innerText="";

}


function showFileName(){

 const file=
 document.getElementById(
  "mediaFile"
 ).files[0];


 document.getElementById(
  "fileName"
 ).innerText=
 file
 ?
 "Selected: "+file.name
 :
 "";

}


/* =====================================
PUBLISH POST
===================================== */

async function publishPost(){

 const user=
 await getUser();


 if(!user){

  closePostBox();

  openLogin();

  return;
 }


 const text=
 document.getElementById(
  "postText"
 ).value.trim();


 const file=
 document.getElementById(
  "mediaFile"
 ).files[0];


 if(!text && !file){

  document.getElementById(
   "postMsg"
  ).innerText=
  "Post বা Photo/Video দিন।";

  return;

 }


 const msg=
 document.getElementById(
  "postMsg"
 );


 msg.innerText=
 "Publishing...";


 let media_url=null;

 let media_type=null;


 /* FILE */

 if(file){

  if(
   file.size >
   50 * 1024 * 1024
  ){

   msg.innerText=
   "File সর্বোচ্চ 50MB হতে পারবে।";

   return;

  }


  media_type=
  file.type.startsWith("video/")
  ?
  "video"
  :
  "image";


  const extension=
  file.name
  .split(".")
  .pop()
  .toLowerCase();


  const safeExtension=
  extension.replace(
   /[^a-z0-9]/g,
   ""
  ) || "file";


  const path=
  user.id+
  "/"+
  Date.now()+
  "-" +
  Math.random()
  .toString(36)
  .substring(2,8)+
  "."+
  safeExtension;


  const {
   error:uploadError
  }=
  await db.storage
  .from("complaint-media")
  .upload(
   path,
   file,
   {
    upsert:false,
    contentType:file.type
   }
  );


  if(uploadError){

   msg.innerText=
   "Upload failed: "+
   uploadError.message;

   return;

  }


  const {
   data:urlData
  }=
  db.storage
  .from("complaint-media")
  .getPublicUrl(path);


  media_url=
  urlData.publicUrl;

 }


 /* DATABASE */

 const {
  error
 }=
 await db
 .from("posts")
 .insert({

  user_id:user.id,

  content:text,

  media_url:media_url,

  media_type:media_type

 });


 if(error){

  msg.innerText=
  "Post failed: "+
  error.message;

  return;

 }


 msg.innerText=
 "Published successfully ✅";


 document.getElementById(
  "postText"
 ).value="";


 document.getElementById(
  "mediaFile"
 ).value="";


 document.getElementById(
  "fileName"
 ).innerText="";


 setTimeout(
  ()=>{
   closePostBox();
   loadFeed();
  },
  700
 );

}


/* =====================================
LOAD FEED
===================================== */

async function loadFeed(){

 const feed=
 document.getElementById(
  "feed"
 );


 if(!feed) return;


 feed.innerHTML=
 `<div class="card loading">
  Post loading...
 </div>`;


 const {
  data:posts,
  error
 }=
 await db
 .from("posts")
 .select("*")
 .order(
  "created_at",
  {
   ascending:false
  }
 );


 if(error){

  feed.innerHTML=
  `<div class="card error">
   Feed load failed.<br>
   ${escapeHTML(error.message)}
  </div>`;

  return;

 }


 if(
  !posts ||
  posts.length===0
 ){

  feed.innerHTML=
  `<div class="card empty">
   এখনো কোনো Post নেই।<br>
   প্রথম Post আপনিই করুন 😊
  </div>`;

  return;

 }


 let html="";


 for(
  const post of posts
 ){

  html +=
  await renderPost(post);

 }


 feed.innerHTML=html;

}


/* =====================================
RENDER POST
===================================== */

async function renderPost(post){

 const user=
 await getUser();


 const reactions=
 await getReactionCounts(
  post.id
 );


 const comments=
 await getComments(
  post.id
 );


 const myReaction=
 user
 ?
 await getMyReaction(
  post.id,
  user.id
 )
 :
 null;


 const isOwner=
 user &&
 user.id===post.user_id;


 let media="";


 if(post.media_url){

  if(
   post.media_type==="video"
  ){

   media=
   `<video
    class="post-media"
    controls
    preload="metadata"
    src="${escapeAttr(post.media_url)}">
   </video>`;

  }else{

   media=
   `<img
    class="post-media"
    src="${escapeAttr(post.media_url)}"
    alt="Post image"
    loading="lazy"
    onclick="openImage('${escapeAttr(post.media_url)}')">`;

  }

 }


 let commentHTML="";


 for(
  const comment of comments
 ){

  const canDelete=
  user &&
  user.id===comment.user_id;


  commentHTML +=
  `<div class="comment">

   ${
    canDelete
    ?
    `<button
     class="comment-delete"
     onclick="deleteComment(${comment.id})">
     Delete
     </button>`
    :
    ""
   }

   <div class="comment-user">
    User
   </div>

   <div>
    ${escapeHTML(comment.content)}
   </div>

   <div class="comment-date">
    ${formatDate(comment.created_at)}
   </div>

  </div>`;

 }


 return `

 <div class="card">

  <div class="post-head">

   <div class="post-user">
    👤 PASSTIME User
   </div>

   <div>

    ${
     isOwner
     ?
     `<button
      class="delete-post"
      onclick="deletePost(${post.id}, '${escapeAttr(post.media_url || "")}')">
      🗑 Delete
      </button>`
     :
     ""
    }

   </div>

  </div>


  <div class="post-date">
   ${formatDate(post.created_at)}
  </div>


  ${
   post.content
   ?
   `<div class="post-text">
    ${escapeHTML(post.content)}
   </div>`
   :
   ""
  }


  ${media}


  <div class="reactions">

   ${reactionButton(
    "👍",
    "Like",
    reactions.like,
    myReaction==="like",
    post.id
   )}

   ${reactionButton(
    "❤️",
    "Love",
    reactions.love,
    myReaction==="love",
    post.id
   )}

   ${reactionButton(
    "😂",
    "Haha",
    reactions.haha,
    myReaction==="haha",
    post.id
   )}

   ${reactionButton(
    "😮",
    "Wow",
    reactions.wow,
    myReaction==="wow",
    post.id
   )}

   ${reactionButton(
    "😢",
    "Sad",
    reactions.sad,
    myReaction==="sad",
    post.id
   )}

   ${reactionButton(
    "😡",
    "Angry",
    reactions.angry,
    myReaction==="angry",
    post.id
   )}

  </div>


  <div class="actions">

   <button
   onclick="reactToPost(${post.id},'like')">
   👍 Like
   </button>

   <button
   onclick="focusComment(${post.id})">
   💬 Comment
   </button>

  </div>


  <div class="comments">

   <b>
    💬 Comments
   </b>


   <div id="comments-${post.id}">

    ${
     commentHTML ||
     `<div style="color:#888;font-size:13px;margin-top:8px">
      No comments yet.
     </div>`
    }

   </div>


   ${
    user
    ?
    `<div class="comment-input">

     <input
      id="comment-${post.id}"
      placeholder="Write a comment..."
      onkeydown="commentEnter(event,${post.id})">

     <button
      onclick="addComment(${post.id})">
      Send
     </button>

    </div>`
    :
    `<div style="margin-top:10px;color:#777;font-size:13px">
     Comment করতে Login করুন।
     </div>`
   }

  </div>

 </div>

 `;

}


/* =====================================
REACTION BUTTON
===================================== */

function reactionButton(
 emoji,
 name,
 count,
 active,
 postId
){

 return `
 <button
 class="${active ? "active" : ""}"
 onclick="reactToPost(${postId},'${name.toLowerCase()}')">
 ${emoji} ${name} ${count || ""}
 </button>
 `;

}


/* =====================================
REACTIONS
===================================== */

async function getReactionCounts(postId){

 const {
  data,
  error
 }=
 await db
 .from("reactions")
 .select(
  "reaction_type"
 )
 .eq(
  "post_id",
  postId
 );


 const result={
  like:0,
  love:0,
  haha:0,
  wow:0,
  sad:0,
  angry:0
 };


 if(error) return result;


 (data || []).forEach(
  r=>{

   if(
    Object.prototype
    .hasOwnProperty
    .call(
     result,
     r.reaction_type
    )
   ){

    result[
     r.reaction_type
    ]++;

   }

  }
 );


 return result;

}


async function getMyReaction(
 postId,
 userId
){

 const {
  data
 }=
 await db
 .from("reactions")
 .select("reaction_type")
 .eq("post_id",postId)
 .eq("user_id",userId)
 .maybeSingle();


 return data
 ? data.reaction_type
 : null;

}


async function reactToPost(
 postId,
 type
){

 const user=
 await getUser();


 if(!user){

  openLogin();

  return;

 }


 const current=
 await getMyReaction(
  postId,
  user.id
 );


 /* SAME REACTION = REMOVE */

 if(current===type){

  const {
   error
  }=
  await db
  .from("reactions")
  .delete()
  .eq("post_id",postId)
  .eq("user_id",user.id);


  if(error){

   alert(
    "Reaction failed: "+
    error.message
   );

   return;

  }

 }else{

  /* OTHER REACTION = UPDATE/INSERT */

  const {
   error
  }=
  await db
  .from("reactions")
  .upsert(
   {
    post_id:postId,
    user_id:user.id,
    reaction_type:type
   },
   {
    onConflict:
    "post_id,user_id"
   }
  );


  if(error){

   alert(
    "Reaction failed: "+
    error.message
   );

   return;

  }

 }


 loadFeed();

}


/* =====================================
COMMENTS
===================================== */

async function getComments(postId){

 const {
  data,
  error
 }=
 await db
 .from("comments")
 .select("*")
 .eq("post_id",postId)
 .order(
  "created_at",
  {
   ascending:true
  }
 );


 if(error) return [];


 return data || [];

}


async function addComment(postId){

 const user=
 await getUser();


 if(!user){

  openLogin();

  return;

 }


 const input=
 document.getElementById(
  "comment-"+postId
 );


 if(!input) return;


 const content=
 input.value.trim();


 if(!content){

  return;

 }


 input.disabled=true;


 const {
  error
 }=
 await db
 .from("comments")
 .insert({

  post_id:postId,

  user_id:user.id,

  content:content

 });


 input.disabled=false;


 if(error){

  alert(
   "Comment failed: "+
   error.message
  );

  return;

 }


 input.value="";


 loadFeed();

}


function commentEnter(
 event,
 postId
){

 if(event.key==="Enter"){

  event.preventDefault();

  addComment(postId);

 }

}


function focusComment(postId){

 const input=
 document.getElementById(
  "comment-"+postId
 );


 if(input){

  input.focus();

 }else{

  openLogin();

 }

}


async function deleteComment(
 commentId
){

 const user=
 await getUser();


 if(!user){

  openLogin();

  return;

 }


 if(
  !confirm(
   "এই comment delete করবেন?"
  )
 ){

  return;

 }


 const {
  error
 }=
 await db
 .from("comments")
 .delete()
 .eq("id",commentId)
 .eq("user_id",user.id);


 if(error){

  alert(
   "Delete failed: "+
   error.message
  );

  return;

 }


 loadFeed();

}


/* =====================================
DELETE POST
===================================== */

async function deletePost(
 postId,
 mediaUrl
){

 const user=
 await getUser();


 if(!user){

  openLogin();

  return;

 }


 if(
  !confirm(
   "এই Post delete করবেন?"
  )
 ){

  return;

 }


 const {
  error
 }=
 await db
 .from("posts")
 .delete()
 .eq("id",postId)
 .eq("user_id",user.id);


 if(error){

  alert(
   "Delete failed: "+
   error.message
  );

  return;

 }


 /* STORAGE FILE DELETE */

 if(mediaUrl){

  try{

   const marker=
   "/object/public/complaint-media/";

   const index=
   mediaUrl.indexOf(marker);


   if(index!==-1){

    const path=
    decodeURIComponent(
     mediaUrl.substring(
      index+marker.length
     )
    );


    await db.storage
    .from("complaint-media")
    .remove([path]);

   }

  }catch(e){

   console.log(
    "Media delete skipped",
    e
   );

  }

 }


 loadFeed();

}
